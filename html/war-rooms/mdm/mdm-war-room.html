
<!DOCTYPE html>

<html>

<head>

<title>TSM MDM War Room</title>

<link rel="stylesheet" href="/shared/tsm-mdm.css">

</head>


<body>

<div class="mdm-shell">

<h1>MDM Command Center</h1>

<div class="mdm-grid">


<div class="mdm-card">

<div class="mdm-label">
Enterprise Data Trust
</div>

<div id="healthScore"
class="mdm-score">
--
</div>

</div>


<div class="mdm-card">

<h2>Domains</h2>

<div id="domains">
Loading...
</div>

</div>


<div class="mdm-card mdm-risk">

<h2>Anomalies</h2>

<div id="anomalies">
Loading...
</div>

</div>


<div class="mdm-card mdm-mission">

<h2>Mission Queue</h2>

<div id="missions">
Loading...
</div>

</div>


</div>

</div>


<script src="/js/mdm-live-data.js"></script>


<script>

TSM_MDM_LIVE.start();


window.addEventListener(
"TSM_MDM_UPDATED",
(e)=>{


const data=e.detail;


document.getElementById(
"healthScore"
).innerText =
(data.catalog.healthScore || "--")
+"%";


document.getElementById(
"domains"
).innerHTML =
data.catalog.domains
.map(d =>
`${d.name}: ${d.score}%`
)
.join("<br>");


document.getElementById(
"anomalies"
).innerHTML =
data.anomalies
.map(a =>
`${a.finding}<br>
Risk: ${a.riskScore}`
)
.join("<hr>");


document.getElementById(
"missions"
).innerHTML =
data.missions
.map(m =>
`${m.id}<br>
${m.finding}<br>
${m.completion_pct}%`
)
.join("<hr>");

});


</script>


</body>

</html>
