<!DOCTYPE html>

<html>

<head>

<title>
TSM MDM Executive Intelligence
</title>

<link rel="stylesheet" href="/shared/tsm-mdm.css">

</head>


<body>

<div class="mdm-shell">


<h1>
MDM Executive Intelligence
</h1>


<div class="mdm-grid">


<div class="mdm-card">

<div class="mdm-label">
MASTER DATA TRUST
</div>

<div id="trust"
class="mdm-score">
--
</div>

</div>



<div class="mdm-card">

<h2>
Top Risk
</h2>

<div id="risk">
Loading...
</div>

</div>



<div class="mdm-card">

<h2>
AI Explanation
</h2>

<div id="explain">
Loading...
</div>

</div>



<div class="mdm-card">

<h2>
Mission Status
</h2>

<div id="mission">
Loading...
</div>

</div>


</div>

</div>



<script>

async function loadMDM(){

const health =
await fetch("/api/mdm/health")
.then(r=>r.json());


document.getElementById("trust")
.innerHTML =
health.healthScore ||
health.score ||
"--";



const anomalies =
await fetch("/api/mdm/anomalies")
.then(r=>r.json());


const a =
anomalies[0] ||
anomalies.anomalies?.[0];


if(a){

document.getElementById("risk")
.innerHTML =
`
${a.finding || ""}
<br>
Risk Score:
${a.riskScore || a.score}
<br>
Exposure:
${a.exposure || ""}
`;


}



const missions =
await fetch("/api/mdm/missions")
.then(r=>r.json());


const m =
missions[0] ||
missions.missions?.[0];


if(m){

document.getElementById("mission")
.innerHTML =
`
${m.id}
<br>
${m.status}
<br>
${m.completion_pct}%
`;

}


}


loadMDM();


</script>


</body>

</html>
