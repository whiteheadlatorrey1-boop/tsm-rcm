<!DOCTYPE html>
<html lang="en">
<head>
<script defer src="/html/war-rooms/_relay_control_plane/relay.core.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSM &middot; Master Data Management Executive Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a0f;--bg2:#0a1020;--bg3:#0d1528;
  --cyan:#00d4d4;--amber:#f5a623;--green:#22c55e;
  --red:#ef4444;--purple:#a855f7;--blue:#3b82f6;
  --orange:#f97316;--text:#e2e8f0;--muted:#64748b;--border:#1e293b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#020810;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--cyan);letter-spacing:.15em;}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--cyan);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.08em;color:var(--text);}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--cyan);color:var(--cyan);}
.hbtn.primary{border-color:var(--cyan);color:var(--cyan);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center;}
.kpi-val{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--orange);}
.kpi-val.red{color:var(--red);}.kpi-val.green{color:var(--green);}.kpi-val.cyan{color:var(--cyan);}.kpi-val.amber{color:var(--amber);}
.kpi-lbl{font-size:.6rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--cyan);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-hdr::before{content:'\25C6';font-size:.55rem;}
.ai-box{background:rgba(0,212,212,.06);border:1px solid var(--cyan);border-radius:6px;padding:16px;margin-bottom:16px;white-space:pre-wrap;font-size:.88rem;line-height:1.55;}
.ai-box.hero{padding:22px;font-size:.95rem;}
.list-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #0f1a2e;font-size:.82rem;}
.list-row:last-child{border-bottom:none;}
.lbadge{font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0;margin-top:2px;background:rgba(245,166,35,.12);color:var(--amber);border:1px solid var(--amber);white-space:nowrap;}
.meta-row{display:flex;gap:18px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);margin-top:10px;}
.meta-row span{color:var(--text);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--cyan);color:var(--cyan);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}
.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.abtn{font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.08em;padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);}
.abtn.approve{border-color:var(--green);color:var(--green);}
.abtn.escalate{border-color:var(--red);color:var(--red);}
.abtn:hover{opacity:.85;}
.no-items{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.rbadge{font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0;white-space:nowrap;}
.rbadge.HIGH{background:rgba(239,68,68,.12);color:var(--red);border:1px solid var(--red);}
.rbadge.MEDIUM{background:rgba(245,166,35,.12);color:var(--amber);border:1px solid var(--amber);}
.rbadge.LOW{background:rgba(100,116,139,.12);color:var(--muted);border:1px solid var(--border);}
.rec-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #0f1a2e;font-size:.8rem;}
.rec-row:last-child{border-bottom:none;}
.rec-body{flex:1;min-width:0;}
.rec-reason{color:var(--muted);font-size:.72rem;margin-top:3px;}
.rec-btns{display:flex;gap:6px;flex-shrink:0;}
.rbtn{font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:5px 10px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);}
.rbtn.ok{border-color:var(--green);color:var(--green);}
.rbtn.no{border-color:var(--red);color:var(--red);}
.rbtn:disabled{opacity:.4;cursor:default;}
.dom-table{width:100%;border-collapse:collapse;font-size:.78rem;}
.dom-table th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--border);}
.dom-table td{padding:7px 8px;border-bottom:1px solid #0f1a2e;}
.dom-table tr:last-child td{border-bottom:none;}
</style>
</head>
<body>
<div class="topbar">
  <span class="tb-brand">TSM &middot; MASTER DATA MANAGEMENT EXECUTIVE PORTAL</span>
  <span class="tb-time" id="clock"></span>
</div>
<div class="hdr">
  <div>
    <div class="hdr-title" id="hdrTitle">&#128202; MASTER DATA MANAGEMENT EXECUTIVE PORTAL</div>
    <div class="hdr-sub" id="hdrSub">Loading live governance summary&hellip;</div>
  </div>
  <div class="hdr-btns">
    <a class="hbtn" href="mdm-war-room.html">&larr; War Room</a>
    <a class="hbtn primary" href="mdm-strategist.html">Strategist View &rarr;</a>
    <button class="hbtn" id="refreshBtn" onclick="loadSummary()">&#8635; Refresh</button>
    <button class="hbtn" id="printBtn" onclick="window.print()">&darr; Export</button>
  </div>
</div>
<div class="wrap" id="wrap"><!-- populated by JS --></div>
<div class="toast" id="toast"></div>
<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const CFG = {"domain": "MDM", "kpiPath": "kpis", "kpis": [{"key": "total_records", "label": "TOTAL RECORDS", "fmt": "num", "cls": "cyan"}, {"key": "duplicate_count", "label": "DUPLICATES", "fmt": "num", "cls": "red"}, {"key": "quality_score", "label": "QUALITY SCORE", "fmt": "pct", "cls": "green"}, {"key": "pending_approvals", "label": "PENDING MERGES", "fmt": "num", "cls": "amber"}, {"key": "anomalies", "label": "ANOMALIES", "fmt": "num", "cls": "red"}, {"key": "stewards_active", "label": "ACTIVE STEWARDS", "fmt": "num", "cls": "cyan"}], "lists": [{"path": "duplicates", "label": "DUPLICATE CLUSTERS"}], "aiPaths": ["ai_analysis"], "title": "Master Data Management", "isExec": true};
const RELAY_KEY_FALLBACK = 'TSM_' + CFG.domain + '_RELAY';
let LAST_SUMMARY = null;

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

function loadRelay(){
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(CFG.domain);
      if(d) return d;
    }
  } catch(e){}
  try {
    const raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function getPath(obj, path){
  if(!path) return obj;
  return path.split('.').reduce((o,k)=> (o && o[k]!==undefined) ? o[k] : undefined, obj);
}

function fmtVal(v, fmt){
  if(v===undefined || v===null || v==='') return '&mdash;';
  if(fmt==='money') return '$' + Number(v).toLocaleString();
  if(fmt==='pct') return v + '%';
  return String(v);
}

function dynamicCls(v){
  const n = Number(v);
  if(isNaN(n)) return 'cyan';
  if(n>=80) return 'green';
  if(n>=50) return 'amber';
  return 'red';
}

function renderEmpty(){
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO DATA RECEIVED</h2>
      <p>Run an analysis in the Master Data Management war room, then relay it here.</p>
      <div class="hdr-btns" style="justify-content:center;">
        <a class="hbtn primary" href="mdm-war-room.html">&#128202; Go to War Room</a>
      </div>
    </div>`;
}

function itemText(item){
  if(typeof item === 'string') return item;
  if(!item || typeof item !== 'object') return String(item);
  const keys = ['message','description','reason','title','name','label','text','type'];
  for(const k of keys){ if(item[k]) return String(item[k]); }
  return JSON.stringify(item).slice(0,140);
}

function itemBadge(item){
  if(!item || typeof item !== 'object') return null;
  return item.status || item.severity || item.stage || item.priority || null;
}

function renderList(items, label, opts){
  opts = opts || {};
  if(!items || !items.length){
    return `<div class="sec"><div class="sec-hdr">${label}</div><div class="no-items">No items.</div></div>`;
  }
  const rows = items.slice(0,12).map(it=>{
    let main, badge;
    if(opts.scoreItem){
      main = it.label || it.name || it.id || 'Domain';
      badge = (it.score!==undefined) ? it.score+'%' : null;
    } else if(opts.systemItem){
      main = it.name || it.id || 'System';
      badge = it.status || null;
      if(badge && badge==='healthy') return '';
    } else {
      main = itemText(it);
      badge = itemBadge(it);
    }
    if(!main) return '';
    return `<div class="list-row">${badge?`<span class="lbadge">${escapeHtml(String(badge))}</span>`:''}<span>${escapeHtml(String(main))}</span></div>`;
  }).filter(Boolean).join('');
  return `<div class="sec"><div class="sec-hdr">${label}</div>${rows || '<div class="no-items">All clear &mdash; no flagged items.</div>'}</div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function recTitle(r){
  if(r.type === 'merge') return `Merge: keep ${r.survivorName} &larr; retire ${r.mergedName}`;
  return `Quality review: ${r.recordName} (score ${r.qualityScore}/100)`;
}

function renderRecommendations(recs){
  if(!recs || !recs.length){
    return `<div class="sec"><div class="sec-hdr">OPEN GOVERNANCE RECOMMENDATIONS</div><div class="no-items">No open recommendations &mdash; all clear.</div></div>`;
  }
  const rows = recs.map(r => `
    <div class="rec-row" data-rec-id="${escapeHtml(r.id)}">
      <span class="rbadge ${r.risk}">${r.risk}</span>
      <div class="rec-body">
        <div>${escapeHtml(recTitle(r))} <span style="color:var(--muted);">(${escapeHtml(r.domain)})</span></div>
        <div class="rec-reason">${escapeHtml(r.reasoning)}</div>
      </div>
      <div class="rec-btns">
        <button class="rbtn ok" onclick="decideRec('${escapeHtml(r.id)}','approve')">&#10003; Approve</button>
        <button class="rbtn no" onclick="decideRec('${escapeHtml(r.id)}','reject')">&#10007; Reject</button>
      </div>
    </div>`).join('');
  return `<div class="sec"><div class="sec-hdr">OPEN GOVERNANCE RECOMMENDATIONS (${recs.length})</div>${rows}</div>`;
}

function renderDomainTable(domains){
  if(!domains || !domains.length) return '';
  const rows = domains.map(d => `
    <tr>
      <td>${escapeHtml(d.domain)}</td>
      <td>${d.recordCount}</td>
      <td>${d.duplicateCount}</td>
      <td class="${d.avgQualityScore>=80?'kpi-val green':d.avgQualityScore>=50?'kpi-val amber':'kpi-val red'}" style="font-size:.8rem;">${d.avgQualityScore}%</td>
      <td>${escapeHtml(d.steward)}</td>
    </tr>`).join('');
  return `<div class="sec"><div class="sec-hdr">DOMAIN QUALITY BREAKDOWN</div>
    <table class="dom-table"><thead><tr><th>Domain</th><th>Records</th><th>Dupes</th><th>Quality</th><th>Steward</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderDecisions(log){
  if(!log || !log.length) return '';
  const items = log.map(d => `${d.decision} &mdash; ${d.type} (${d.domain}) by ${d.actor}, ${new Date(d.ts).toLocaleString()}`);
  return renderList(items, 'RECENT DECISIONS', {});
}

function renderSummary(data){
  document.getElementById('hdrSub').textContent = `Live &mdash; generated ${new Date(data.generatedAt).toLocaleString()}`;

  const tiles = CFG.kpis.map(k=>{
    const raw = data.kpis[k.key];
    const cls = k.cls === 'dynamic' ? dynamicCls(raw) : k.cls;
    return { val: fmtVal(raw, k.fmt), lbl: k.label, cls };
  });
  let html = `<div class="kpi-row">` + tiles.map(t=>`
    <div class="kpi"><div class="kpi-val ${t.cls}">${t.val}</div><div class="kpi-lbl">${t.lbl}</div></div>
  `).join('') + `</div>`;

  html += renderRecommendations(data.openRecommendations);
  html += renderDomainTable(data.domains);
  html += renderDecisions(data.recentDecisions);

  document.getElementById('wrap').innerHTML = html;
}

async function decideRec(id, action){
  const row = document.querySelector(`.rec-row[data-rec-id="${CSS.escape(id)}"]`);
  if(row) row.querySelectorAll('button').forEach(b => b.disabled = true);
  try{
    const res = await fetch(`/api/mdm/recommendations/${encodeURIComponent(id)}/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': window.TSM_CLIENT_KEY || '' },
      body: JSON.stringify({ actor: 'Executive Portal' })
    });
    const d = await res.json();
    if(!d.ok){ showToast(d.error || 'Action failed'); if(row) row.querySelectorAll('button').forEach(b => b.disabled = false); return; }
    showToast(action === 'approve' ? 'Recommendation approved' : 'Recommendation rejected');
    loadSummary();
  } catch(e){
    showToast('Network error');
    if(row) row.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

// Live data is the primary source. The war-room-to-portal relay (sessionStorage/
// localStorage) is only consulted if the live endpoint is unreachable, so this
// page still degrades gracefully rather than going blank.
async function loadSummary(){
  try{
    const res = await fetch('/api/mdm/executive-summary');
    const data = await res.json();
    if(data && data.ok){ LAST_SUMMARY = data; renderSummary(data); return; }
    throw new Error('bad response');
  } catch(e){
    const relayed = loadRelay();
    if(relayed){
      document.getElementById('hdrSub').textContent = `Relayed ${relayed.timestamp ? new Date(relayed.timestamp).toLocaleString() : '&mdash;'} (live feed unreachable)`;
      const kpiBase = getPath(relayed, CFG.kpiPath) || {};
      const tiles = CFG.kpis.map(k=>{
        const raw = kpiBase[k.key];
        const cls = k.cls === 'dynamic' ? dynamicCls(raw) : k.cls;
        return { val: fmtVal(raw, k.fmt), lbl: k.label, cls };
      });
      document.getElementById('wrap').innerHTML = `<div class="kpi-row">` + tiles.map(t=>`
        <div class="kpi"><div class="kpi-val ${t.cls}">${t.val}</div><div class="kpi-lbl">${t.lbl}</div></div>
      `).join('') + `</div>`;
    } else {
      renderEmpty();
    }
  }
}

loadSummary();
setInterval(loadSummary, 30000);
window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_EVENT_LOG') loadSummary(); });
window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === CFG.domain) loadSummary(); });
</script>
  <script src="/html/core/tsm-runtime.js"></script>
</body>
</html>
