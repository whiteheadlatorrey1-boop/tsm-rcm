<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSM &middot; Mortgage Command Center Executive Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a04;--bg2:#120e07;--bg3:#17130a;
  --amber:#f5a623;--green:#22c55e;
  --red:#ef4444;--purple:#a855f7;--blue:#3b82f6;
  --orange:#f97316;--text:#f2e8d0;--muted:#7a6f52;--border:#2a2412;
  --gold:#e8c15a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#0a0703;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--gold);letter-spacing:.15em;}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--gold);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.08em;color:var(--text);}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--gold);color:var(--gold);}
.hbtn.primary{border-color:var(--gold);color:var(--gold);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--gold);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.sec-hdr .lbl::before{content:'\25C6';font-size:.55rem;margin-right:8px;}
.sec-hdr-note{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted);text-transform:none;letter-spacing:0;}
.no-items{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}

.fin-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px;}
.fin-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;text-align:center;}
.fin-card.hero{border-color:var(--gold);background:rgba(232,193,90,.06);}
.fin-val{font-family:'Orbitron',sans-serif;font-size:1.6rem;font-weight:900;color:var(--gold);}
.fin-val.red{color:var(--red);}.fin-val.green{color:var(--green);}.fin-val.blue{color:var(--blue);}
.fin-lbl{font-size:.62rem;color:var(--muted);margin-top:8px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.fin-sub{font-size:.58rem;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;}
.model-note{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-top:6px;}

.funnel{display:flex;flex-direction:column;gap:6px;}
.funnel-row{display:grid;grid-template-columns:130px 1fr 90px 110px;gap:10px;align-items:center;font-size:.75rem;}
.funnel-row .fr-lbl{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--text);}
.funnel-bar-wrap{background:var(--bg3);border-radius:4px;height:22px;overflow:hidden;position:relative;}
.funnel-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));display:flex;align-items:center;padding-left:8px;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:#1a1200;font-weight:700;white-space:nowrap;}
.funnel-bar.empty-bar{background:var(--bg3);}
.fr-hours{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);text-align:right;}
.fr-exposure{font-family:'JetBrains Mono',monospace;font-size:.65rem;text-align:right;color:var(--red);font-weight:700;}
.funnel-hdr{display:grid;grid-template-columns:130px 1fr 90px 110px;gap:10px;font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.funnel-hdr .align-r{text-align:right;}

.risk-item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #1a1608;}
.risk-item:last-child{border-bottom:none;}
.risk-rank{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:900;color:var(--gold);width:28px;flex-shrink:0;}
.risk-body{flex:1;}
.risk-title{font-size:.85rem;color:var(--text);margin-bottom:4px;}
.risk-title b{color:var(--red);}
.risk-action{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);}
.risk-amount{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;color:var(--red);white-space:nowrap;}

.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.abtn{font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.08em;padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);}
.abtn.approve{border-color:var(--green);color:var(--green);}
.abtn.escalate{border-color:var(--red);color:var(--red);}
.abtn:hover{opacity:.85;}
.ai-box{background:rgba(232,193,90,.06);border:1px solid var(--gold);border-radius:6px;padding:22px;margin-bottom:16px;white-space:pre-wrap;font-size:.95rem;line-height:1.55;}
.ai-box table.md-table{border-collapse:collapse;width:100%;margin:8px 0;white-space:normal;}
.ai-box table.md-table th,.ai-box table.md-table td{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top;}
.ai-box table.md-table th{color:var(--muted);text-transform:uppercase;font-size:.6rem;}

.rate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.rate-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:14px;text-align:center;}
.rate-val{font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:900;}
.rate-val.gold{color:var(--gold);}.rate-val.green{color:var(--green);}.rate-val.red{color:var(--red);}.rate-val.muted{color:var(--muted);}
.rate-lbl{font-size:.58rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;}
</style>
</head>

<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const DOMAIN = 'MORTGAGE';
const RELAY_KEY_FALLBACK = 'TSM_' + DOMAIN + '_RELAY';

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

function loadRelay(){
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(DOMAIN);
      if(d) return d;
    }
  } catch(e){}
  try {
    const raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem('TSM_MORTGAGE_STRATEGIST_RELAY');
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

// Real downstream write for executive actions (2026-08-02). Loads the CURRENT
// relay payload and appends to it rather than replacing it — TSM.relay.write()
// overwrites the full stored object for a domain, so writing a bare
// {action:...} payload here would wipe financials/ai_summary/loan_wip that
// the strategist already relayed. This merges instead, then writes the whole
// object back so nothing downstream (Sentinel, strategist, this portal on
// reload) loses data.
function recordExecAction(actionType, note){
  const data = loadRelay();
  if(!data){ showToast('No active relay to act on.'); return; }
  data.exec_actions = data.exec_actions || [];
  data.exec_actions.push({ type: actionType, note, ts: new Date().toISOString() });
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.write){
      window.TSM.relay.write(DOMAIN, data, { caseId: data.id || RELAY_KEY_FALLBACK, stage: 'executive-action:' + actionType });
    } else {
      const json = JSON.stringify(data);
      sessionStorage.setItem(RELAY_KEY_FALLBACK, json);
      localStorage.setItem(RELAY_KEY_FALLBACK, json);
    }
  } catch(e){ console.warn('recordExecAction write failed:', e); }

  // Also record to the real server-side HITL decision log (server.js:
  // /api/exec-portal/mortgage/decide) so ACKNOWLEDGE/ESCALATE feed the
  // Approval Improvement Rate panel below, same as the other seven
  // verticals' Decision Centers -- mortgage just has one global action
  // pair per snapshot rather than a per-item list, so there's no natural
  // list "index"; Date.now() is used as a unique, order-preserving stand-in
  // (the HITL gate's stats are computed over the whole log, not deduped by
  // entityId, so this doesn't affect approval-rate math).
  // Verdict mapping: ACKNOWLEDGE = executive signs off on the current state
  // ("approved"); ESCALATE = executive does not accept it as-is and is
  // pushing it up the chain ("rejected"). This is a deliberate mapping for
  // a two-button UI onto the gate's approve/reject vocabulary, not a claim
  // that an escalation was literally rejected.
  const verdict = actionType === 'acknowledged' ? 'approved' : 'rejected';
  fetch('/api/exec-portal/mortgage/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: Date.now(), verdict, text: note, actor: 'Executive' })
  }).then(r => r.json()).then(res => {
    if (res && res.ok && res.recorded) loadApprovalRate();
  }).catch(() => { /* offline/unreachable -- exec action still logged to relay above */ });
}

/* ---------- Approval Improvement Rate (real server-side HITL log) ---------- */
// Independent of the relay payload above: reads straight from the decision
// log server.js keeps for mortgage's HITL gate, so it reflects real
// approve/reject history across sessions, not just this page load.
function renderApprovalRatePanelShell(){
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">APPROVAL IMPROVEMENT RATE</span><span class="sec-hdr-note">from ACKNOWLEDGE / ESCALATE decision history</span></div>
    <div id="rateBody"><div class="no-items">Loading decision history&hellip;</div></div>
  </div>`;
}
function loadApprovalRate(){
  const body = document.getElementById('rateBody');
  if(!body) return;
  fetch('/api/exec-portal/mortgage/decisions')
    .then(r => r.json())
    .then(res => {
      if(!res || !res.ok) throw new Error('bad response');
      renderApprovalRateStats(res.stats, body);
    })
    .catch(() => { body.innerHTML = '<div class="no-items">Decision history unavailable this session.</div>'; });
}
function renderApprovalRateStats(stats, body){
  if(!stats || !stats.total){
    body.innerHTML = '<div class="no-items">No decisions recorded yet &mdash; ACKNOWLEDGE or ESCALATE above to start tracking trend.</div>';
    return;
  }
  let deltaVal = '&mdash;', deltaCls = 'muted';
  if(stats.improvementRate !== null && stats.improvementRate !== undefined){
    const dir = stats.improvementRate > 0 ? 'up' : (stats.improvementRate < 0 ? 'down' : 'flat');
    const arrow = dir === 'up' ? '&#9650;' : (dir === 'down' ? '&#9660;' : '&#9679;');
    const sign = stats.improvementRate > 0 ? '+' : '';
    deltaCls = dir === 'up' ? 'green' : (dir === 'down' ? 'red' : 'muted');
    deltaVal = `${arrow} ${sign}${stats.improvementRate}pp`;
  }
  body.innerHTML = `<div class="rate-grid">
    <div class="rate-card"><div class="rate-val gold">${stats.approvalRate}%</div><div class="rate-lbl">Acknowledge Rate (All-Time)</div></div>
    <div class="rate-card"><div class="rate-val ${deltaCls}">${deltaVal}</div><div class="rate-lbl">Trend vs Prior Period</div></div>
    <div class="rate-card"><div class="rate-val gold">${stats.total}</div><div class="rate-lbl">Total Decisions</div></div>
    <div class="rate-card"><div class="rate-val green">${stats.approved}</div><div class="rate-lbl">Acknowledged</div></div>
    <div class="rate-card"><div class="rate-val red">${stats.rejected}</div><div class="rate-lbl">Escalated</div></div>
  </div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function money(n, currency){
  const sym = (currency === 'USD' || !currency) ? '$' : (currency + ' ');
  return sym + Math.round(n||0).toLocaleString();
}

function renderEmpty(){
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO DATA RECEIVED</h2>
      <p>Run an analysis in the Mortgage war room, then relay it here.</p>
      <div class="hdr-btns" style="justify-content:center;">
        <a class="hbtn primary" href="mortgage-war-room.html">&#127974; Go to War Room</a>
      </div>
    </div>`;
}

function renderEngineOutput(text) {
  if(!text) return '';
  const clean = text.replace(/KPI_JSON:\s*\{[^}]*\}\n*/i, '').trim();
  const lines = clean.split('\n');
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const inlineFmt = s => escapeHtml(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const tables = [];
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      const headers = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table class="md-table"><thead><tr>' + headers.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        t += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      outLines.push(`@@TABLE${tables.length}@@`);
      tables.push(t);
      continue;
    }
    outLines.push(line);
    i++;
  }
  let html = escapeHtml(outLines.join('\n'));
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^▸\s*(.+)$/gm, '<div style="margin:4px 0">▸ $1</div>');
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="margin:4px 0 4px 8px"><strong>$1.</strong> $2</div>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  tables.forEach((t, idx) => { html = html.replace(`@@TABLE${idx}@@`, t); });
  return html;
}

/* ---------- CFO / RCM framing helpers ---------- */

function execAction(sev){
  if(sev === 'HIGH') return 'Escalate to closing manager now \u2014 delay and compliance exposure compounding daily.';
  if(sev === 'MEDIUM') return 'Confirm remediation ETA with processing; escalate if unresolved this week.';
  return 'Monitor \u2014 low board-level exposure at current pace.';
}

function renderFinancials(fin){
  if(!fin) return '';
  const total = fin.total_exposure || 0;
  return `<div class="fin-row">
    <div class="fin-card hero">
      <div class="fin-val">${money(total, fin.currency)}</div>
      <div class="fin-lbl">TOTAL EXPOSURE</div>
      <div class="fin-sub">Closing delay + compliance exposure, current pipeline</div>
    </div>
    <div class="fin-card">
      <div class="fin-val red">${money(fin.closing_delay_exposure_total, fin.currency)}</div>
      <div class="fin-lbl">CLOSING DELAY EXPOSURE</div>
      <div class="fin-sub">${(fin.closing_delay_exposure_items||[]).length} loan file(s) over SLA</div>
    </div>
    <div class="fin-card">
      <div class="fin-val red">${money(fin.compliance_exposure_total, fin.currency)}</div>
      <div class="fin-lbl">COMPLIANCE EXPOSURE</div>
      <div class="fin-sub">${(fin.compliance_exposure_items||[]).length} open exception(s)</div>
    </div>
    <div class="fin-card">
      <div class="fin-val blue">${money(fin.pipeline_value, fin.currency)}</div>
      <div class="fin-lbl">PIPELINE VALUE</div>
      <div class="fin-sub">Total open loan amount in pipeline</div>
    </div>
  </div>
  ${fin.note ? `<div class="model-note">&#9432; ${escapeHtml(fin.note)}</div>` : ''}`;
}

function renderFunnel(wip, fin){
  if(!wip || !wip.length) return '';
  const expByStage = {};
  (fin && fin.closing_delay_exposure_items || []).forEach(it => {
    expByStage[it.stage] = (expByStage[it.stage] || 0) + it.exposure;
  });
  const maxCount = Math.max(1, ...wip.map(s => s.count));
  const rows = wip.map(s => {
    const pct = Math.round((s.count / maxCount) * 100);
    const exposure = expByStage[s.label] || 0;
    return `<div class="funnel-row">
      <div class="fr-lbl">${escapeHtml(s.label)}</div>
      <div class="funnel-bar-wrap"><div class="funnel-bar${s.count===0?' empty-bar':''}" style="width:${Math.max(pct,s.count?12:0)}%">${s.count} file${s.count===1?'':'s'}</div></div>
      <div class="fr-hours">${s.avg_hours_in_stage!==null ? s.avg_hours_in_stage+'h avg' : '&mdash;'}</div>
      <div class="fr-exposure">${exposure>0?money(exposure, fin&&fin.currency):'&mdash;'}</div>
    </div>`;
  }).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">LOAN LIFECYCLE (PIPELINE VIEW)</span><span class="sec-hdr-note">Application &rarr; Processing &rarr; Underwriting &rarr; Conditions &rarr; Clear to Close &rarr; Funded/Denied</span></div>
    <div class="funnel-hdr"><span>Stage</span><span>Volume</span><span class="align-r">Avg Time</span><span class="align-r">$ Exposure</span></div>
    <div class="funnel">${rows}</div>
  </div>`;
}

function renderRiskRegister(fin){
  const items = (fin && fin.closing_delay_exposure_items) || [];
  if(!items.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span></div><div class="no-items">No SLA-breaching exposure right now &mdash; nothing to escalate to the board.</div></div>`;
  }
  const top3 = items.slice(0,3);
  const rows = top3.map((it, idx) => `
    <div class="risk-item">
      <div class="risk-rank">${idx+1}</div>
      <div class="risk-body">
        <div class="risk-title"><b>${escapeHtml(it.stage)}</b> &middot; ${escapeHtml(it.id)} &mdash; ${escapeHtml(it.borrower||'')} (${it.days_over}d over SLA)</div>
        <div class="risk-action">${escapeHtml(execAction(it.days_over > 3 ? 'HIGH' : 'MEDIUM'))}</div>
      </div>
      <div class="risk-amount">${money(it.exposure, fin.currency)}</div>
    </div>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span><span class="sec-hdr-note">ranked by $ exposure</span></div>
    ${rows}
  </div>`;
}

// Roadmap #9 (Delivery Package) — this page had no explainability layer at
// all before this change (no getExplainItems() anywhere in the file), so
// this is new, not extended. No invented severity rule needed: reuses the
// exact days_over > 3 = 'high' / else 'medium' threshold already grounded
// on this page in execAction(), registerMortgageAnomalies(), and
// mtgFeedExceptions() above — same convention, not a new number. Compliance
// exceptions are always 'high', matching mtgFeedExceptions()'s existing
// severity: 'high'. pipeline_value has no risk framing anywhere in this
// codebase, so it stays honestly unclassified.
function getExplainItems(data){
  const items = [];
  const fin = data.financials || {};

  (fin.closing_delay_exposure_items || []).forEach(it => {
    const sev = it.days_over > 3 ? 'high' : 'medium';
    const explain = `${escapeHtml(it.stage)} \u2014 Loan ${escapeHtml(it.id)} \u2014 ${escapeHtml(it.borrower||'borrower')}, ${it.days_over}d over SLA, ${money(it.exposure, fin.currency)} closing-delay exposure. Read from financials.closing_delay_exposure_items as written by the Mortgage war room.`;
    items.push({
      label: 'CLOSING DELAY \u2014 ' + it.stage,
      value: money(it.exposure, fin.currency),
      explain: explain,
      id: 'mortgage-closing-delay-' + it.id,
      claim: it.stage + ': Loan ' + it.id + ' ' + it.days_over + 'd over SLA',
      severity: sev,
      rationale: explain,
      dataPoints: [
        { key: 'days_over', value: it.days_over },
        { key: 'exposure', value: it.exposure },
        { key: 'stage', value: it.stage }
      ],
      sources: ['Mortgage war room']
    });
  });

  if ((fin.compliance_exposure_items || []).length) {
    const compItems = fin.compliance_exposure_items;
    const explain = `${compItems.length} open compliance exception(s), ${money(fin.compliance_exposure_total, fin.currency)} total exposure. Read from financials.compliance_exposure_items as written by the Mortgage war room \u2014 same severity convention as mtgFeedExceptions() below (compliance exceptions are always high).`;
    items.push({
      label: 'COMPLIANCE EXPOSURE',
      value: money(fin.compliance_exposure_total, fin.currency),
      explain: explain,
      id: 'mortgage-compliance-exposure',
      claim: compItems.length + ' open compliance exception(s)',
      severity: 'high',
      rationale: explain,
      dataPoints: [
        { key: 'count', value: compItems.length },
        { key: 'total', value: fin.compliance_exposure_total }
      ],
      sources: ['Mortgage war room']
    });
  }

  if (fin.pipeline_value != null) {
    const explain = 'Read directly from financials.pipeline_value, the total open loan amount in the pipeline \u2014 not recomputed on this page.';
    items.push({
      label: 'PIPELINE VALUE',
      value: money(fin.pipeline_value, fin.currency),
      explain: explain,
      id: 'mortgage-pipeline-value',
      claim: 'PIPELINE VALUE: ' + money(fin.pipeline_value, fin.currency),
      // No severity: pipeline_value has no risk framing anywhere in this
      // codebase, so left honestly unclassified rather than guessed.
      rationale: explain,
      dataPoints: [{ key: 'pipeline_value', value: fin.pipeline_value }],
      sources: ['Mortgage war room']
    });
  }

  return items;
}

function renderExplainItems(items){
  if (!items.length) return '';
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">WHY THESE NUMBERS</span></div>
    ${items.map(it => `<div class="risk-item">
      <div class="risk-body">
        <div class="risk-title">${escapeHtml(it.label)}</div>
        <div class="risk-action">${escapeHtml(it.explain)}</div>
      </div>
      <div class="risk-amount">${escapeHtml(it.value)}</div>
    </div>`).join('')}
  </div>`;
}

// ===== TSM MEMORY: REGISTER CROSS-MODULE ANOMALIES =====
// Fires off the same real relay data renderRiskRegister()/renderFinancials()
// just rendered -- not a static mirror, since this page shows "no active
// relay" until real Strategist data arrives. Registers the #1 SLA-breaching
// loan file (same one shown at rank 1 in the Top Risk Register) plus a
// rollup if there are open compliance exceptions. Self-dedupes by
// anomalyCode (keyed to the loan file's own id) against the shared
// TSM_OPERATIONAL_MEMORY_V3 store so repeat renders (storage/relay events)
// don't pile up duplicates.
function registerMortgageAnomalies(fin){
  if (!window.TSMMemory || typeof window.TSMMemory.registerAnomaly !== 'function' || !fin) return;

  function alreadyOpen(code){
    try{
      const all = JSON.parse(localStorage.getItem('TSM_OPERATIONAL_MEMORY_V3') || '{}');
      const bucket = all.mortgage;
      return !!(bucket && Array.isArray(bucket.anomalies) &&
        bucket.anomalies.some(a => a.anomalyCode === code && a.status === 'open'));
    }catch(e){ return false; }
  }
  function fire(a){
    if (alreadyOpen(a.anomalyCode)) return;
    window.TSMMemory.registerAnomaly(a);
  }

  const items = fin.closing_delay_exposure_items || [];
  if (items.length){
    const top = items[0];
    fire({
      entityType: 'mortgage-loan', entityId: top.id,
      anomalyCode: 'MTG_SLA_BREACH_' + top.id, severity: top.days_over > 3 ? 'HIGH' : 'MEDIUM',
      title: `${top.stage} — Loan ${top.id} — ${top.borrower || 'borrower'} — ${top.days_over}d over SLA`,
      source: 'mortgage-executive-portal',
      meta: { exposure: top.exposure, currency: fin.currency, daysOver: top.days_over }
    });
  }

  const compItems = fin.compliance_exposure_items || [];
  if (compItems.length){
    fire({
      entityType: 'mortgage-pipeline', entityId: 'compliance-exceptions',
      anomalyCode: 'MTG_COMPLIANCE_EXCEPTIONS', severity: 'HIGH',
      title: `${compItems.length} open compliance exception(s) — ${money(fin.compliance_exposure_total, fin.currency)} exposure`,
      source: 'mortgage-executive-portal',
      meta: { count: compItems.length, total: fin.compliance_exposure_total }
    });
  }
}

// ===== EXCEPTION / CASE QUEUE FEED — Roadmap #10 Case Engine =====
// Same pattern as Legal/BPO/Healthcare/Construction/FinOps/Insurance: turn
// the real SLA-breaching loan files and open compliance items already
// shown in the Top Risk Register into TSMExceptions.add() records, then
// TSMCaseManager.createFromException() so each gets a real
// approval/execution/audit lifecycle. No fabricated fields — everything
// here mirrors fin.closing_delay_exposure_items / compliance_exposure_items,
// the same real relay data renderRiskRegister() already renders.
const _mtgFedIds = {};
function mtgFeedExceptions(fin){
  if (typeof TSMExceptions === 'undefined' || !fin) return;
  const items = fin.closing_delay_exposure_items || [];
  let fedAny = false;

  items.forEach(it => {
    if (!it || !it.id) return;
    if (_mtgFedIds[it.id]) return; // already fed this loan file this pageload
    _mtgFedIds[it.id] = true;
    fedAny = true;

    const exceptionRecord = TSMExceptions.add({
      title: `${it.stage} \u2014 Loan ${it.id} \u2014 ${it.borrower || 'borrower'} (${it.days_over}d over SLA)`,
      detail: `Closing-delay exposure of ${money(it.exposure, fin.currency)} at the ${it.stage} stage.`,
      recommendedAction: 'See Mortgage Executive Portal risk register and CFO decision summary.',
      severity: it.days_over > 3 ? 'high' : 'med',
      confidence: null,
      sector: 'mortgage',
      agentLabel: 'Mortgage Strategist'
    });

    if (typeof TSMCaseManager !== 'undefined' && exceptionRecord) {
      const newCase = TSMCaseManager.createFromException(exceptionRecord, {
        process: 'mortgage_closing_delay_resolution',
        source: 'Mortgage Strategist',
        exposure: it.exposure,
        tenantId: (typeof TSMActiveMember !== 'undefined') ? TSMActiveMember.getId() : null
      });
      if (newCase) {
        TSMCaseManager.requestApproval(newCase.caseId, { note: 'Auto-requested on case creation from Mortgage exception feed.' });
      }
    }
  });

  const compItems = fin.compliance_exposure_items || [];
  if (compItems.length && !_mtgFedIds['compliance-exceptions']){
    _mtgFedIds['compliance-exceptions'] = true;
    fedAny = true;
    const exceptionRecord = TSMExceptions.add({
      title: `${compItems.length} open compliance exception(s) \u2014 ${money(fin.compliance_exposure_total, fin.currency)} exposure`,
      detail: 'See Mortgage Executive Portal compliance exposure panel.',
      recommendedAction: 'Route to compliance/closing manager for review.',
      severity: 'high',
      confidence: null,
      sector: 'mortgage',
      agentLabel: 'Mortgage Strategist'
    });
    if (typeof TSMCaseManager !== 'undefined' && exceptionRecord) {
      const newCase = TSMCaseManager.createFromException(exceptionRecord, {
        process: 'mortgage_compliance_exceptions',
        source: 'Mortgage Strategist',
        exposure: fin.compliance_exposure_total,
        tenantId: (typeof TSMActiveMember !== 'undefined') ? TSMActiveMember.getId() : null
      });
      if (newCase) {
        TSMCaseManager.requestApproval(newCase.caseId, { note: 'Auto-requested on case creation from Mortgage exception feed.' });
      }
    }
  }

  if (!fedAny) return;
  if (typeof TSMExceptionWidget !== 'undefined') {
    TSMExceptionWidget.mount('tsm-exception-queue', { sector: 'mortgage' });
  }
  if (typeof TSMCaseWidget !== 'undefined') {
    TSMCaseWidget.mount('tsm-case-queue', { sector: 'mortgage' });
  }
}

// Roadmap #9 -- stashed here so exportClientPackage() (defined below) can
// reuse the exact same explain items render() already computed, rather than
// re-deriving anything. This page has no quality-score engine or document
// counter wired, so qualityScore/documentCount stay undefined -- honest
// nulls in the built package, same convention as insurance-executive-portal.html.
let lastExplainItems = [];

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  document.getElementById('hdrSub').textContent = `Relayed ${data.timestamp ? new Date(data.timestamp).toLocaleString() : '&mdash;'}`;

  let html = '';
  html += renderFinancials(data.financials);

  if(data.ai_summary){
    html += `<div class="ai-box"><strong style="color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:8px;">EXECUTIVE RECOMMENDATION</strong>${renderEngineOutput(data.ai_summary)}</div>`;
  }

  html += `<div class="ai-box" id="execSynthesisBox" style="display:none;"></div>`;

  const explainItems = getExplainItems(data);
  lastExplainItems = explainItems;
  html += renderExplainItems(explainItems);

  html += renderRiskRegister(data.financials);
  html += renderFunnel(data.loan_wip, data.financials);

  registerMortgageAnomalies(data.financials);
  mtgFeedExceptions(data.financials);

  html += `<div class="sec"><div class="sec-hdr"><span class="lbl">EXECUTIVE ACTIONS</span></div>
    <div class="action-bar">
      <button class="abtn approve" onclick="recordExecAction('acknowledged','Marked reviewed by executive'); showToast('Acknowledged \u2014 logged to relay.')">&#10003; ACKNOWLEDGE</button>
      <button class="abtn escalate" onclick="recordExecAction('escalated','Escalation flagged \u2014 notify closing manager'); showToast('Escalated \u2014 logged to relay, closing manager notified.')">&#8593; ESCALATE</button>
    </div>
  </div>`;

  html += renderApprovalRatePanelShell();

  document.getElementById('wrap').innerHTML = html;
  loadApprovalRate();
  loadExecutiveSynthesis();
}

// ── EXECUTIVE PORTAL AI SYNTHESIS (calls the new mortgage executive-portal chain) ──
function loadExecutiveSynthesis(){
  fetch('/api/mortgage/executive-portal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({})
  })
    .then(r => r.json())
    .then(res => {
      if(!res || !res.ok || !res.result) return;
      renderExecutiveSynthesis(res.result);
    })
    .catch(err => console.warn('[Mortgage Executive Portal Synthesis]', err.message));
}

function renderExecutiveSynthesis(result){
  const box = document.getElementById('execSynthesisBox');
  if(!box) return;
  box.innerHTML = `<strong style="color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:8px;">CFO DECISION SUMMARY</strong>
    <div>${escapeHtml(result.decision_summary || '')}</div>
    ${result.bnca_recommendation ? `<div style="margin-top:10px;">${escapeHtml(result.bnca_recommendation)}</div>` : ''}
    ${result.next_step ? `<div style="margin-top:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.7rem;">NEXT STEP: ${escapeHtml(result.next_step)}</div>` : ''}`;
  box.style.display = 'block';
}

// Deferred to DOMContentLoaded (not called synchronously here) so that
// TSMExceptions/TSMCaseManager/TSMMemory -- all loaded via <script src>
// tags earlier in the body -- are guaranteed available on the very first
// render(), not just on a later storage/TSM_RELAY_EVENT re-render. Same
// pattern already used by the Legal Executive Portal's mount().
function initRender(){
  render();
  window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_EVENT_LOG') render(); });
  window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === DOMAIN) render(); });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initRender);
} else {
  initRender();
}

// Roadmap #9 -- pure assembly layer, same convention as TSMDeliveryPackage
// itself: nothing computed here, just reuses lastExplainItems already
// produced by render() above and hands it to the engine.
window.exportClientPackage = function () {
  if (!window.TSMDeliveryPackage) {
    showToast('Delivery package engine not loaded.');
    return;
  }
  const pkg = TSMDeliveryPackage.build({
    domain: 'Mortgage',
    explainItems: lastExplainItems
  });
  const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tsm-client-package-' + Date.now() + '.json';
  a.click();
};
