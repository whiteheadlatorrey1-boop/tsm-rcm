<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSM &middot; Schools Command Center Strategist</title>
<style>
:root{
  --bg:#07101c;--panel:#0d1a2b;--panel2:#0a1520;--border:#1a3050;
  --text:#e0eaf5;--muted:#5a7a99;--teal:#14b8a6;
  --gold:#f59e0b;--red:#ef4444;--green:#10b981;--blue:#3b82f6;
  --purple:#a78bfa;--orange:#f97316;--pink:#ec4899;
  --mono:'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#050d18;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:.15em;}
.tb-time{font-family:var(--mono);font-size:.75rem;color:var(--gold);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-size:1.05rem;font-weight:700;letter-spacing:.04em;color:#fff;}
.hdr-sub{font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--gold);color:var(--gold);}
.hbtn.primary{border-color:var(--gold);color:var(--gold);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center;}
.kpi-val{font-family:var(--mono);font-size:1.3rem;font-weight:700;color:var(--orange);}
.kpi-val.red{color:var(--red);}.kpi-val.green{color:var(--green);}.kpi-val.gold{color:var(--gold);}.kpi-val.teal{color:var(--teal);}
.kpi-lbl{font-size:.6rem;color:var(--muted);margin-top:6px;font-family:var(--mono);letter-spacing:.08em;}
.sec{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-size:.68rem;color:var(--gold);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-transform:uppercase;font-weight:700;}
.sec-hdr .lbl::before{content:'\25C6';font-size:.55rem;margin-right:8px;}
.sec-hdr-note{font-family:var(--mono);font-size:.58rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;}
.ai-box{background:rgba(245,158,11,.06);border:1px solid var(--gold);border-radius:6px;padding:16px;margin-bottom:16px;white-space:pre-wrap;font-size:.88rem;line-height:1.55;}
.ai-box table.md-table{border-collapse:collapse;width:100%;margin:8px 0;white-space:normal;}
.ai-box table.md-table th,.ai-box table.md-table td{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top;}
.ai-box table.md-table th{color:var(--muted);text-transform:uppercase;font-size:.6rem;}
.no-items{font-family:var(--mono);font-size:.7rem;color:var(--muted);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:4px;font-family:var(--mono);font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}

.wip-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.wip-stage{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:12px;text-align:center;position:relative;}
.wip-stage.stalled{border-color:var(--red);background:rgba(239,68,68,.06);}
.wip-stage .ws-lbl{font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;min-height:26px;}
.wip-stage .ws-count{font-family:var(--mono);font-size:1.4rem;font-weight:700;color:var(--gold);}
.wip-stage.stalled .ws-count{color:var(--red);}
.wip-stage .ws-meta{font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-top:6px;}
.wip-stage .ws-flag{position:absolute;top:6px;right:8px;font-size:.55rem;color:var(--red);}
.wip-arrow{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;}

.aq-table{width:100%;border-collapse:collapse;font-size:.78rem;}
.aq-table th{text-align:left;font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--border);}
.aq-table td{padding:9px 8px;border-bottom:1px solid #0e2236;vertical-align:top;}
.aq-table tr:last-child td{border-bottom:none;}
.impact{font-family:var(--mono);font-size:.55rem;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.impact.high{background:rgba(239,68,68,.12);color:var(--red);border:1px solid var(--red);}
.impact.medium{background:rgba(245,158,11,.12);color:var(--gold);border:1px solid var(--gold);}
.impact.low{background:rgba(90,122,153,.12);color:var(--muted);border:1px solid var(--muted);}
.time-hot{color:var(--red);font-weight:700;}
.action-hint{color:var(--text);}
.tsm-delta-row{display:flex;gap:10px;}
.tsm-delta-box{flex:1;padding:12px;border-radius:6px;text-align:center;border:1px solid var(--border);}
.tsm-delta-no{background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.25);}
.tsm-delta-act{background:rgba(16,185,129,.06);border-color:rgba(16,185,129,.25);}
.tsm-delta-lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:5px;}
.tsm-delta-val{font-family:var(--mono);font-size:1.1rem;font-weight:700;}
.tsm-delta-no .tsm-delta-val{color:var(--red);}
.tsm-delta-act .tsm-delta-val{color:var(--green);}
.tsm-recovery{font-family:var(--mono);font-size:.6rem;color:var(--muted);text-align:center;margin-top:8px;}
</style>
</head>
<body data-vertical="schools" data-page-role="warroom">
<div class="topbar">
  <span class="tb-brand">TSM &middot; SCHOOLS COMMAND CENTER STRATEGIST</span>
  <span class="tb-time" id="clock"></span>
</div>
<div class="hdr">
  <div>
    <div class="hdr-title" id="hdrTitle">&#127891; SCHOOLS COMMAND CENTER STRATEGIST</div>
    <div class="hdr-sub" id="hdrSub">Awaiting relay from the Schools Command Center&hellip;</div>
  </div>
  <div class="hdr-btns">
    <a class="hbtn" href="schools-command.html">&larr; Command Center</a>
    <a class="hbtn primary" href="schools-executive-portal.html">Executive View &rarr;</a>
    <button class="hbtn" id="printBtn" onclick="window.print()">&darr; Export</button>
  </div>
</div>
<div class="wrap" id="wrap"><!-- populated by JS --></div>
<div class="toast" id="toast"></div>
<script src="/html/js/tsm-bnca-exposure-engine.js"></script>
<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const DOMAIN = 'SCHOOLS';
const RELAY_KEY_FALLBACK = 'TSM_' + DOMAIN + '_RELAY';

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

function loadRelay(){
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(DOMAIN);
      if(d) return d;
    }
  } catch(e){}
  try {
    const raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem('TSM_SCHOOLS_STRATEGIST_RELAY');
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtVal(v, fmt){
  if(v===undefined || v===null || v==='') return '&mdash;';
  if(fmt==='money') return '$' + Number(v).toLocaleString();
  if(fmt==='pct') return v + '%';
  return String(v);
}

function renderEmpty(){
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO DATA RECEIVED</h2>
      <p>Run an analysis in the Schools Command Center, then relay it here.</p>
      <div class="hdr-btns" style="justify-content:center;">
        <a class="hbtn primary" href="schools-command.html">&#127891; Go to Command Center</a>
      </div>
    </div>`;
}

function renderEngineOutput(text) {
  if(!text) return '';
  const clean = text.replace(/KPI_JSON:\s*\{[^}]*\}\n*/i, '').trim();
  const lines = clean.split('\n');
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const inlineFmt = s => escapeHtml(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const tables = [];
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      const headers = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table class="md-table"><thead><tr>' + headers.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        t += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      outLines.push(`@@TABLE${tables.length}@@`);
      tables.push(t);
      continue;
    }
    outLines.push(line);
    i++;
  }
  let html = escapeHtml(outLines.join('\n'));
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^▸\s*(.+)$/gm, '<div style="margin:4px 0">▸ $1</div>');
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="margin:4px 0 4px 8px"><strong>$1.</strong> $2</div>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  tables.forEach((t, idx) => { html = html.replace(`@@TABLE${idx}@@`, t); });
  return html;
}

/* ---------- Business-value framing helpers ---------- */

// Deterministic, rule-based next action -- derived from stage + breach
// status + ownership, never invented. Mirrors mortgage-strategist.html's
// nextAction(), remapped to Schools' grant_file stage model.
function nextAction(rec, isBreached){
  const owner = rec.owner || 'Unassigned';
  if(rec.stage === 'application' && owner === 'Unassigned') return 'Assign a grants team owner and begin file setup now.';
  if(rec.stage === 'application') return 'Continue application intake against SLA clock.';
  if(rec.stage === 'agency_review' && isBreached) return 'Agency review stalled past SLA \u2014 escalate to review desk lead.';
  if(rec.stage === 'agency_review') return 'Awaiting agency review decision; confirm queue position.';
  if(rec.stage === 'active' && isBreached) return 'Active award past SLA on required check-in \u2014 confirm spend-down status with district.';
  if(rec.stage === 'active') return 'Monitor spend-down pace against obligation/liquidation deadlines.';
  if(rec.stage === 'corrective_action' && isBreached) return 'Corrective action stalled past SLA \u2014 escalate to program officer.';
  if(rec.stage === 'corrective_action') return 'Track corrective action clearance against SLA clock.';
  if(rec.stage === 'closeout_ready') return 'Confirm final expenditure report accuracy and submit closeout package.';
  if(rec.stage === 'denied') return 'Review for resubmission eligibility or alternate funding source.';
  return 'Confirm status and close out.';
}

function impactFromSeverity(sev){
  if(sev === 'HIGH') return { cls: 'high', label: 'HIGH IMPACT' };
  if(sev === 'MEDIUM') return { cls: 'medium', label: 'MED IMPACT' };
  return { cls: 'low', label: 'LOW IMPACT' };
}

// Business Impact Delta — deterministic, no LLM-guessed dollars. Reuses the
// exact total_exposure figure the schools engine already computes from the
// financial_model rate card (funding-delay + compliance exposure) and
// already includes in the relay payload; mirrors mortgage-strategist.html's
// equivalent, remapped to Schools' grant_file stage model.
function severityFromSlaRatio(overSla, openGrants){
  if (!openGrants) return overSla > 0 ? 'MED' : 'LOW';
  const ratio = overSla / openGrants;
  if (ratio >= 0.30) return 'CRIT';
  if (ratio >= 0.15) return 'HIGH';
  if (ratio > 0) return 'MED';
  return 'LOW';
}

function renderBusinessImpactDelta(data){
  const fin = data.financials || {};
  const baseExposure = Number(fin.total_exposure) || 0;
  if (!baseExposure || !window.TSMBNCAExposureEngine) {
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">BUSINESS IMPACT DELTA</span></div><div class="no-items">No quantifiable exposure reported${fin.note ? ' — ' + escapeHtml(fin.note) : ''}.</div></div>`;
  }
  const kpis = data.kpis || {};
  const severity = severityFromSlaRatio(kpis.grants_over_sla || 0, kpis.open_grant_files || 0);
  const impact = window.TSMBNCAExposureEngine.project({
    baseExposure, severity,
    confidence: 70, // no distinct AI-confidence signal for this vertical (rule-based engine, not an LLM call) -- engine's own documented neutral default
    daysUntilDeadline: 0 // no per-grant deadline day-count surfaced to the strategist relay yet
  });
  const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">BUSINESS IMPACT DELTA</span><span class="sec-hdr-note">funding-delay + compliance exposure &middot; deterministic projection</span></div>
    <div class="tsm-delta-row">
      <div class="tsm-delta-box tsm-delta-no"><div class="tsm-delta-lbl">No Action</div><div class="tsm-delta-val">${fmt(impact.ifIgnored.exposure)}</div></div>
      <div class="tsm-delta-box tsm-delta-act"><div class="tsm-delta-lbl">With Action</div><div class="tsm-delta-val">${fmt(impact.ifActed.exposure)}</div></div>
    </div>
    <div class="tsm-recovery">${escapeHtml(impact.urgencyWindow)} &middot; ${escapeHtml(impact.methodology)}</div>
  </div>`;
}

function renderWipBoard(wip){
  if(!wip || !wip.length) return '';
  const stages = wip.map(s => {
    const stalled = s.stalled_count > 0;
    const meta = s.avg_hours_in_stage !== null
      ? `avg ${s.avg_hours_in_stage}h in stage${s.sla_hours!=null ? ' / SLA '+s.sla_hours+'h' : ''}`
      : (s.sla_hours!=null ? `SLA ${s.sla_hours}h` : 'no SLA clock');
    return `<div class="wip-stage${stalled?' stalled':''}">
      ${stalled?'<span class="ws-flag">&#9888;</span>':''}
      <div class="ws-lbl">${escapeHtml(s.label)}</div>
      <div class="ws-count">${s.count}</div>
      <div class="ws-meta">${escapeHtml(meta)}</div>
      ${stalled?`<div class="ws-meta" style="color:var(--red)">${s.stalled_count} stalled past SLA</div>`:''}
    </div>`;
  }).join('<div class="wip-arrow">&rarr;</div>');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">GRANT FILE PIPELINE BY STAGE</span><span class="sec-hdr-note">time-in-stage vs. SLA clock, live from command center data</span></div>
    <div class="wip-board">${stages}</div>
  </div>`;
}

function renderActionQueue(records, breachIds){
  const grants = (records && records.grant_files) || [];
  const open = grants.filter(r => !['closed','denied'].includes(r.stage));
  if(!open.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">ACTION QUEUE</span></div><div class="no-items">No open grant files &mdash; queue is clear.</div></div>`;
  }
  const rows = open
    .slice()
    .sort((a,b) => (b.entered_stage_at_hours_ago||0) - (a.entered_stage_at_hours_ago||0))
    .map(r => {
      const isBreached = breachIds.has(r.grant_id);
      const impact = impactFromSeverity(r.severity);
      const hours = r.entered_stage_at_hours_ago;
      return `<tr>
        <td><strong>${escapeHtml(r.grant_id)}</strong><br><span style="color:var(--muted);font-size:.7rem;">${escapeHtml(r.grantee||'')} &middot; ${escapeHtml(r.program||'')}</span></td>
        <td><span class="impact ${impact.cls}">${impact.label}</span></td>
        <td>${escapeHtml(r.stage)}</td>
        <td class="${isBreached?'time-hot':''}">${hours!==undefined?hours+'h':'&mdash;'}</td>
        <td>${escapeHtml(r.owner||'Unassigned')}</td>
        <td class="action-hint">${escapeHtml(nextAction(r, isBreached))}</td>
      </tr>`;
    }).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">ACTION QUEUE</span><span class="sec-hdr-note">ranked by time in current stage</span></div>
    <table class="aq-table">
      <thead><tr><th>Grant File</th><th>Impact</th><th>Stage</th><th>Time in Stage</th><th>Owner</th><th>Recommended Next Step</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  document.getElementById('hdrSub').textContent = `Relayed ${data.timestamp ? new Date(data.timestamp).toLocaleString() : '\u2014'}`;

  const kpis = data.kpis || {};
  const breaches = data.grant_breaches || [];
  const breachIds = new Set(breaches.map(b => b.id));
  const openGrants = kpis.open_grant_files || 0;
  const compliancePct = openGrants > 0
    ? Math.round(((openGrants - breaches.length) / openGrants) * 1000) / 10
    : 100;

  let html = '';

  html += `<div class="kpi-row">
    <div class="kpi"><div class="kpi-val gold">${fmtVal(kpis.open_grant_files)}</div><div class="kpi-lbl">OPEN GRANT FILES</div></div>
    <div class="kpi"><div class="kpi-val red">${fmtVal(kpis.grants_over_sla)}</div><div class="kpi-lbl">GRANTS OVER SLA</div></div>
    <div class="kpi"><div class="kpi-val ${compliancePct>=90?'green':compliancePct>=70?'gold':'red'}">${compliancePct}%</div><div class="kpi-lbl">SLA COMPLIANCE</div></div>
    <div class="kpi"><div class="kpi-val teal">${fmtVal(kpis.closeout_ready)}</div><div class="kpi-lbl">CLOSEOUT READY</div></div>
    <div class="kpi"><div class="kpi-val gold">${fmtVal(kpis.open_monitoring_items)}</div><div class="kpi-lbl">OPEN MONITORING ITEMS</div></div>
    <div class="kpi"><div class="kpi-val red">${fmtVal(kpis.open_compliance_exceptions)}</div><div class="kpi-lbl">OPEN COMPLIANCE FLAGS</div></div>
  </div>`;

  if(data.ai_summary){
    html += `<div class="ai-box"><strong style="color:var(--gold);font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:8px;">AI PIPELINE ANALYSIS</strong>${renderEngineOutput(data.ai_summary)}</div>`;
  }

  html += renderWipBoard(data.grant_wip);
  html += renderBusinessImpactDelta(data);
  html += renderActionQueue(data.records, breachIds);

  document.getElementById('wrap').innerHTML = html;
}

render();
window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_EVENT_LOG') render(); });
window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === DOMAIN) render(); });
</script>
  <script src="/html/war-rooms/_relay_control_plane/relay.core.js"></script>
  <script src="/html/core/tsm-runtime.js"></script>
  <script src="/js/tsm-guide-engine.js" defer></script>
</body>
</html>
