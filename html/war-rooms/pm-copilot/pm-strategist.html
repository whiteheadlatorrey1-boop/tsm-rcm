<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSM &middot; PM Copilot Strategist</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10;--bg2:#0a0f16;--bg3:#0d1119;
  --accent:#1ee8b6;--accent2:#14b892;--green:#22c55e;
  --red:#ef4444;--amber:#eab308;--muted:#4a7a9b;--text:#e8f0f8;--border:rgba(30,232,182,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#05070c;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--accent);letter-spacing:.15em;}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--accent);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.08em;}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--accent);color:var(--accent);}
.hbtn.primary{border-color:var(--accent);color:var(--accent);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center;}
.kpi-val{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--accent);}
.kpi-val.red{color:var(--red);}.kpi-val.green{color:var(--green);}.kpi-val.amber{color:var(--amber);}
.kpi-lbl{font-size:.6rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--accent);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sec-hdr .lbl::before{content:'\25C6';font-size:.55rem;margin-right:8px;}
.sec-hdr-note{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted);text-transform:none;letter-spacing:0;}
.ai-box{background:rgba(30,232,182,.06);border:1px solid var(--accent);border-radius:6px;padding:16px;margin-bottom:16px;white-space:pre-wrap;font-size:.88rem;line-height:1.55;}
.no-items{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--accent);color:var(--accent);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}
.wip-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
.wip-stage{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px;text-align:center;position:relative;}
.wip-stage.stalled{border-color:var(--red);background:rgba(239,68,68,.06);}
.wip-stage .ws-lbl{font-family:'JetBrains Mono',monospace;font-size:.56rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;min-height:26px;}
.wip-stage .ws-count{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--accent);}
.wip-stage.stalled .ws-count{color:var(--red);}
.wip-stage .ws-meta{font-family:'JetBrains Mono',monospace;font-size:.56rem;color:var(--muted);margin-top:6px;}
.wip-stage .ws-flag{position:absolute;top:6px;right:8px;font-size:.55rem;color:var(--red);}
.wip-arrow{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;}
.impact-row{display:flex;gap:10px;flex-wrap:wrap;}
.impact-box{flex:1;min-width:150px;padding:12px;border-radius:6px;text-align:center;border:1px solid var(--border);background:var(--bg3);}
.impact-lbl{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.impact-val{font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:700;color:var(--red);}
.aq-table{width:100%;border-collapse:collapse;font-size:.78rem;}
.aq-table th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:.56rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--border);}
.aq-table td{padding:9px 8px;border-bottom:1px solid #0f1620;vertical-align:top;}
.aq-table tr:last-child td{border-bottom:none;}
.impact{font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.impact.high{background:rgba(239,68,68,.12);color:var(--red);border:1px solid var(--red);}
.impact.medium{background:rgba(234,179,8,.12);color:var(--amber);border:1px solid var(--amber);}
.impact.low{background:rgba(74,122,155,.12);color:var(--muted);border:1px solid var(--muted);}
.time-hot{color:var(--red);font-weight:700;}
</style>
</head>
<body data-vertical="pm" data-page-role="warroom">
<div class="topbar">
  <span class="tb-brand">TSM &middot; PM COPILOT STRATEGIST</span>
  <span class="tb-time" id="clock"></span>
</div>
<div class="hdr">
  <div>
    <div class="hdr-title" id="hdrTitle">&#127968; PM COPILOT STRATEGIST</div>
    <div class="hdr-sub" id="hdrSub">Awaiting relay from the PM Copilot war room&hellip;</div>
  </div>
  <div class="hdr-btns">
    <a class="hbtn" href="pm-command.html">&larr; War Room</a>
    <a class="hbtn primary" href="pm-exec-portal.html">Executive Portal &rarr;</a>
    <button class="hbtn" id="printBtn" onclick="window.print()">&darr; Export</button>
  </div>
</div>
<div class="wrap" id="wrap"><!-- populated by JS --></div>
<div class="toast" id="toast"></div>
<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const DOMAIN = 'PM';
const RELAY_KEY_FALLBACK = 'TSM_' + DOMAIN + '_RELAY';

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

function loadRelay(){
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(DOMAIN);
      if(d) return d;
    }
  } catch(e){}
  try {
    const raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem('TSM_PM_STRATEGIST_RELAY');
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){ return '$' + Math.round(n||0).toLocaleString('en-US'); }

function renderEmpty(){
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO ACTIVE RELAY</h2>
      <p>Open the PM Copilot war room, run analysis, and click "Relay to Strategist" to populate this view.</p>
      <a class="hbtn primary" href="pm-command.html">Go to War Room &rarr;</a>
    </div>`;
}

function renderWipBoard(wip){
  if(!wip || !wip.length) return '';
  const stages = wip.map(s => {
    const stalled = s.stalled_count > 0;
    const meta = s.avg_hours_in_stage !== null
      ? `avg ${s.avg_hours_in_stage}h in stage${s.sla_hours!=null ? ' / SLA '+s.sla_hours+'h' : ''}`
      : (s.sla_hours!=null ? `SLA ${s.sla_hours}h` : 'no SLA clock');
    return `<div class="wip-stage${stalled?' stalled':''}">
      ${stalled?'<span class="ws-flag">&#9888;</span>':''}
      <div class="ws-lbl">${escapeHtml(s.label)}</div>
      <div class="ws-count">${s.count}</div>
      <div class="ws-meta">${escapeHtml(meta)}</div>
      ${stalled?`<div class="ws-meta" style="color:var(--red)">${s.stalled_count} stalled past SLA</div>`:''}
    </div>`;
  }).join('<div class="wip-arrow">&rarr;</div>');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">WORK ORDER PIPELINE BY STAGE</span><span class="sec-hdr-note">time-in-stage vs. SLA clock, live from war room data</span></div>
    <div class="wip-board">${stages}</div>
  </div>`;
}

function renderImpact(fin){
  if(!fin) return '';
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">FINANCIAL EXPOSURE</span><span class="sec-hdr-note">${escapeHtml(fin.note || 'deterministic projection from vacancy, SLA delay, and vendor compliance data')}</span></div>
    <div class="impact-row">
      <div class="impact-box"><div class="impact-lbl">Vacancy Exposure</div><div class="impact-val">${fmtMoney(fin.vacancy_exposure_total)}</div></div>
      <div class="impact-box"><div class="impact-lbl">Maintenance Delay</div><div class="impact-val">${fmtMoney(fin.maintenance_delay_exposure_total)}</div></div>
      <div class="impact-box"><div class="impact-lbl">Vendor Compliance</div><div class="impact-val">${fmtMoney(fin.vendor_compliance_exposure_total)}</div></div>
      <div class="impact-box" style="border-color:var(--accent)"><div class="impact-lbl">Total Exposure</div><div class="impact-val" style="color:var(--accent)">${fmtMoney(fin.total_exposure)}</div></div>
    </div>
  </div>`;
}

function actionForWorkOrder(hoursOver){
  if(hoursOver > 24) return 'Escalate to vendor manager — SLA breach >24h';
  if(hoursOver > 0) return 'Dispatch vendor / confirm ETA today';
  return 'On track';
}

function renderActionQueue(data){
  const records = data.records || {};
  const workOrders = records.work_orders || [];
  const breaches = data.work_order_breaches || [];
  const breachMap = {};
  breaches.forEach(b => { breachMap[b.id] = b.hours_over; });
  const open = workOrders.filter(w => !['verified','cancelled'].includes(w.stage));

  const rows = open.slice()
    .sort((a,b) => (breachMap[b.work_order_id]||0) - (breachMap[a.work_order_id]||0))
    .map(w => {
      const hoursOver = breachMap[w.work_order_id];
      const isBreached = hoursOver !== undefined;
      const impactCls = isBreached ? (hoursOver > 24 ? 'high' : 'medium') : 'low';
      const impactLbl = isBreached ? (hoursOver > 24 ? 'HIGH' : 'MEDIUM') : 'LOW';
      return `<tr>
        <td><strong>${escapeHtml(w.work_order_id)}</strong><br><span style="color:var(--muted);font-size:.7rem;">${escapeHtml(w.unit_id||'')} &middot; ${escapeHtml(w.category||'')}</span></td>
        <td><span class="impact ${impactCls}">${impactLbl}</span></td>
        <td>${escapeHtml(w.stage||'')}</td>
        <td class="${isBreached?'time-hot':''}">${isBreached ? Math.round(hoursOver)+'h over SLA' : '&mdash;'}</td>
        <td>${escapeHtml(w.vendor_id||'Unassigned')}</td>
        <td>${escapeHtml(isBreached ? actionForWorkOrder(hoursOver) : 'On track')}</td>
      </tr>`;
    }).join('');

  const leaseRows = (data.records && data.records.leases || [])
    .filter(l => !['vacated'].includes(l.stage))
    .filter(l => { const end = new Date(l.end_date).getTime(); return Number.isFinite(end) && end <= Date.now()+60*86400000; })
    .map(l => `<tr>
      <td><strong>${escapeHtml(l.lease_id)}</strong><br><span style="color:var(--muted);font-size:.7rem;">${escapeHtml(l.tenant_name||'')} &middot; ${escapeHtml(l.unit_id||'')}</span></td>
      <td><span class="impact medium">MEDIUM</span></td>
      <td>${escapeHtml(l.stage||'')}</td>
      <td>ends ${escapeHtml(l.end_date||'')}</td>
      <td>&mdash;</td>
      <td>Confirm renewal intent / issue notice</td>
    </tr>`).join('');

  const vendorRows = (data.records && data.records.vendors || [])
    .filter(v => ['expiring_soon','expired'].includes(v.stage))
    .map(v => `<tr>
      <td><strong>${escapeHtml(v.vendor_id)}</strong><br><span style="color:var(--muted);font-size:.7rem;">${escapeHtml(v.name||'')} &middot; ${escapeHtml(v.trade||'')}</span></td>
      <td><span class="impact ${v.stage==='expired'?'high':'medium'}">${v.stage==='expired'?'HIGH':'MEDIUM'}</span></td>
      <td>${escapeHtml(v.stage||'')}</td>
      <td>ins. exp ${escapeHtml(v.insurance_expiry||'')}</td>
      <td>&mdash;</td>
      <td>${v.stage==='expired' ? 'Block dispatch until renewed' : 'Request updated certificate'}</td>
    </tr>`).join('');

  const allRows = rows + leaseRows + vendorRows;
  if(!allRows){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">ACTION QUEUE</span></div><div class="no-items">No open work orders, at-risk leases, or vendor flags &mdash; queue is clear.</div></div>`;
  }
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">ACTION QUEUE</span><span class="sec-hdr-note">work orders ranked by SLA breach, then leases expiring &lt;60d, then vendor flags</span></div>
    <table class="aq-table">
      <thead><tr><th>Item</th><th>Impact</th><th>Stage</th><th>Time / Detail</th><th>Owner</th><th>Recommended Next Step</th></tr></thead>
      <tbody>${allRows}</tbody>
    </table>
  </div>`;
}

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  document.getElementById('hdrSub').textContent = `Relayed ${data.timestamp ? new Date(data.timestamp).toLocaleString() : '\u2014'}`;

  const kpis = data.kpis || {};
  let html = '';

  html += `<div class="kpi-row">
    <div class="kpi"><div class="kpi-val ${kpis.occupancy_rate>=90?'green':kpis.occupancy_rate>=75?'amber':'red'}">${kpis.occupancy_rate!=null?kpis.occupancy_rate+'%':'&mdash;'}</div><div class="kpi-lbl">OCCUPANCY RATE</div></div>
    <div class="kpi"><div class="kpi-val amber">${kpis.units_vacant ?? '&mdash;'}</div><div class="kpi-lbl">UNITS VACANT</div></div>
    <div class="kpi"><div class="kpi-val amber">${kpis.open_work_orders ?? '&mdash;'}</div><div class="kpi-lbl">OPEN WORK ORDERS</div></div>
    <div class="kpi"><div class="kpi-val red">${kpis.work_orders_over_sla ?? '&mdash;'}</div><div class="kpi-lbl">WORK ORDERS OVER SLA</div></div>
    <div class="kpi"><div class="kpi-val amber">${kpis.leases_expiring_60d ?? '&mdash;'}</div><div class="kpi-lbl">LEASES EXPIRING &lt;60D</div></div>
    <div class="kpi"><div class="kpi-val red">${kpis.vendor_compliance_flags ?? '&mdash;'}</div><div class="kpi-lbl">VENDOR COMPLIANCE FLAGS</div></div>
  </div>`;

  if(data.ai_summary){
    html += `<div class="ai-box"><strong style="color:var(--accent);font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:8px;">AI PORTFOLIO ANALYSIS</strong>${escapeHtml(data.ai_summary)}</div>`;
  }

  html += renderWipBoard(data.work_order_wip);
  html += renderImpact(data.financials);
  html += renderActionQueue(data);

  document.getElementById('wrap').innerHTML = html;
}

render();
window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_PM_STRATEGIST_RELAY' || e.key === 'TSM_EVENT_LOG') render(); });
window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === DOMAIN) render(); });
</script>
  <script src="/html/war-rooms/_relay_control_plane/relay.core.js"></script>
  <script src="/html/core/tsm-runtime.js"></script>
  <script src="/js/tsm-guide-engine.js" defer></script>
</body>
</html>
