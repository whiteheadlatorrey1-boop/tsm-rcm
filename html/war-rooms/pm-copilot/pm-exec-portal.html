<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSM &middot; PM Copilot Executive Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10;--bg2:#0a0f16;--bg3:#0d1119;
  --accent:#1ee8b6;--accent2:#14b892;--green:#22c55e;
  --red:#ef4444;--amber:#eab308;--muted:#4a7a9b;--text:#e8f0f8;--border:rgba(30,232,182,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#05070c;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--accent);letter-spacing:.15em;}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--accent);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.08em;}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--accent);color:var(--accent);}
.hbtn.primary{border-color:var(--accent);color:var(--accent);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center;}
.kpi-val{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--accent);}
.kpi-val.red{color:var(--red);}.kpi-val.green{color:var(--green);}.kpi-val.amber{color:var(--amber);}
.kpi-val.gold{color:#d4af37;}
.kpi-lbl{font-size:.6rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--accent);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sec-hdr .lbl::before{content:'\25C6';font-size:.55rem;margin-right:8px;}
.sec-hdr-note{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted);text-transform:none;letter-spacing:0;}
.no-items{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--accent);color:var(--accent);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}
.impact-row{display:flex;gap:10px;flex-wrap:wrap;}
.impact-box{flex:1;min-width:150px;padding:12px;border-radius:6px;text-align:center;border:1px solid var(--border);background:var(--bg3);}
.impact-lbl{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.impact-val{font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:700;color:var(--red);}
.actions{display:flex;gap:10px;margin-top:4px;}
.abtn{flex:1;padding:12px;border-radius:6px;font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.08em;font-weight:700;cursor:pointer;border:1px solid;background:transparent;}
.abtn.approve{color:var(--green);border-color:var(--green);}
.abtn.approve:hover{background:rgba(34,197,94,.1);}
.abtn.escalate{color:var(--red);border-color:var(--red);}
.abtn.escalate:hover{background:rgba(239,68,68,.1);}
.rate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.rate-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:14px;text-align:center;}
.rate-val{font-family:'Orbitron',sans-serif;font-size:1.15rem;font-weight:700;}
.rate-val.gold{color:#d4af37;}.rate-val.green{color:var(--green);}.rate-val.red{color:var(--red);}.rate-val.muted{color:var(--muted);}
.rate-lbl{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--muted);margin-top:6px;letter-spacing:.05em;}
</style>
</head>
<body data-vertical="pm" data-page-role="executive">
<div class="topbar">
  <span class="tb-brand">TSM &middot; PM COPILOT EXECUTIVE PORTAL</span>
  <span class="tb-time" id="clock"></span>
</div>
<div class="hdr">
  <div>
    <div class="hdr-title" id="hdrTitle">&#128188; PM COPILOT EXECUTIVE PORTAL</div>
    <div class="hdr-sub" id="hdrSub">Awaiting relay from the PM Copilot war room&hellip;</div>
  </div>
  <div class="hdr-btns">
    <a class="hbtn" href="pm-strategist.html">&larr; Strategist</a>
    <a class="hbtn" href="pm-command.html">War Room</a>
    <button class="hbtn" id="printBtn" onclick="window.print()">&darr; Export</button>
  </div>
</div>
<div class="wrap" id="wrap"><!-- populated by JS --></div>
<div class="toast" id="toast"></div>
<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const DOMAIN = 'PM';
const RELAY_KEY_FALLBACK = 'TSM_' + DOMAIN + '_RELAY';

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

function loadRelay(){
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(DOMAIN);
      if(d) return d;
    }
  } catch(e){}
  try {
    const raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem('TSM_PM_STRATEGIST_RELAY');
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){ return '$' + Math.round(n||0).toLocaleString('en-US'); }

function renderEmpty(){
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO ACTIVE RELAY</h2>
      <p>Open the PM Copilot war room, run analysis, and click "Relay to Strategist" to populate this view.</p>
      <a class="hbtn primary" href="pm-command.html">Go to War Room &rarr;</a>
    </div>`;
}

// Real downstream write for executive actions -- loads the CURRENT relay
// payload and appends to it rather than replacing it (TSM.relay.write()
// overwrites the whole stored object for a domain), same pattern as
// mortgage-executive-portal.html's recordExecAction().
function recordExecAction(actionType, note){
  const data = loadRelay();
  if(!data){ showToast('No active relay to act on.'); return; }
  data.exec_actions = data.exec_actions || [];
  data.exec_actions.push({ type: actionType, note, ts: new Date().toISOString() });
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.write){
      window.TSM.relay.write(DOMAIN, data, { caseId: data.id || RELAY_KEY_FALLBACK, stage: 'executive-action:' + actionType });
    } else {
      const json = JSON.stringify(data);
      sessionStorage.setItem(RELAY_KEY_FALLBACK, json);
      localStorage.setItem(RELAY_KEY_FALLBACK, json);
    }
  } catch(e){ console.warn('recordExecAction write failed:', e); }

  // Also record to the real server-side HITL decision log (server.js:
  // /api/exec-portal/pm/decide, same shared gate factory Mortgage/Governance/
  // Integration Hub use) so ACKNOWLEDGE/ESCALATE feed the Approval
  // Improvement Rate panel below and persist across sessions/reloads.
  // Verdict mapping: ACKNOWLEDGE = executive signs off on current portfolio
  // state ("approved"); ESCALATE = executive does not accept it as-is
  // ("rejected") -- same deliberate two-button-onto-approve/reject mapping
  // Mortgage uses, not a claim that an escalation was literally rejected.
  const verdict = actionType === 'acknowledged' ? 'approved' : 'rejected';
  fetch('/api/exec-portal/pm/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: Date.now(), verdict, text: note, actor: 'Executive' })
  }).then(r => r.json()).then(res => {
    if (res && res.ok && res.recorded) loadApprovalRate();
  }).catch(() => { /* offline/unreachable -- exec action still logged to relay above */ });
}

function renderApprovalRatePanelShell(){
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">APPROVAL IMPROVEMENT RATE</span><span class="sec-hdr-note">from ACKNOWLEDGE / ESCALATE decision history</span></div>
    <div id="rateBody"><div class="no-items">Loading decision history&hellip;</div></div>
  </div>`;
}
function loadApprovalRate(){
  const body = document.getElementById('rateBody');
  if(!body) return;
  fetch('/api/exec-portal/pm/decisions')
    .then(r => r.json())
    .then(res => {
      if(!res || !res.ok) throw new Error('bad response');
      renderApprovalRateStats(res.stats, body);
    })
    .catch(() => { body.innerHTML = '<div class="no-items">Decision history unavailable this session.</div>'; });
}
function renderApprovalRateStats(stats, body){
  if(!stats || !stats.total){
    body.innerHTML = '<div class="no-items">No decisions recorded yet &mdash; ACKNOWLEDGE or ESCALATE above to start tracking trend.</div>';
    return;
  }
  let deltaVal = '&mdash;', deltaCls = 'muted';
  if(stats.improvementRate !== null && stats.improvementRate !== undefined){
    const dir = stats.improvementRate > 0 ? 'up' : (stats.improvementRate < 0 ? 'down' : 'flat');
    const arrow = dir === 'up' ? '&#9650;' : (dir === 'down' ? '&#9660;' : '&#9679;');
    const sign = stats.improvementRate > 0 ? '+' : '';
    deltaCls = dir === 'up' ? 'green' : (dir === 'down' ? 'red' : 'muted');
    deltaVal = `${arrow} ${sign}${stats.improvementRate}pp`;
  }
  body.innerHTML = `<div class="rate-grid">
    <div class="rate-card"><div class="rate-val gold">${stats.approvalRate}%</div><div class="rate-lbl">Acknowledge Rate (All-Time)</div></div>
    <div class="rate-card"><div class="rate-val ${deltaCls}">${deltaVal}</div><div class="rate-lbl">Trend vs Prior Period</div></div>
    <div class="rate-card"><div class="rate-val gold">${stats.total}</div><div class="rate-lbl">Total Decisions</div></div>
    <div class="rate-card"><div class="rate-val green">${stats.approved}</div><div class="rate-lbl">Acknowledged</div></div>
    <div class="rate-card"><div class="rate-val red">${stats.rejected}</div><div class="rate-lbl">Escalated</div></div>
  </div>`;
}

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  document.getElementById('hdrSub').textContent = `Relayed ${data.timestamp ? new Date(data.timestamp).toLocaleString() : '\u2014'}`;

  const kpis = data.kpis || {};
  const fin = data.financials || {};
  let html = '';

  html += `<div class="kpi-row">
    <div class="kpi"><div class="kpi-val ${kpis.occupancy_rate>=90?'green':kpis.occupancy_rate>=75?'amber':'red'}">${kpis.occupancy_rate!=null?kpis.occupancy_rate+'%':'&mdash;'}</div><div class="kpi-lbl">OCCUPANCY RATE</div></div>
    <div class="kpi"><div class="kpi-val gold">${fmtMoney(kpis.portfolio_rent_value)}</div><div class="kpi-lbl">PORTFOLIO RENT VALUE</div></div>
    <div class="kpi"><div class="kpi-val red">${kpis.work_orders_over_sla ?? '&mdash;'}</div><div class="kpi-lbl">WORK ORDERS OVER SLA</div></div>
    <div class="kpi"><div class="kpi-val red">${kpis.vendor_compliance_flags ?? '&mdash;'}</div><div class="kpi-lbl">VENDOR COMPLIANCE FLAGS</div></div>
  </div>`;

  html += `<div class="sec">
    <div class="sec-hdr"><span class="lbl">TOTAL FINANCIAL EXPOSURE</span><span class="sec-hdr-note">${escapeHtml(fin.note || 'vacancy + SLA delay + vendor compliance, deterministic')}</span></div>
    <div class="impact-row">
      <div class="impact-box"><div class="impact-lbl">Vacancy</div><div class="impact-val">${fmtMoney(fin.vacancy_exposure_total)}</div></div>
      <div class="impact-box"><div class="impact-lbl">Maintenance Delay</div><div class="impact-val">${fmtMoney(fin.maintenance_delay_exposure_total)}</div></div>
      <div class="impact-box"><div class="impact-lbl">Vendor Compliance</div><div class="impact-val">${fmtMoney(fin.vendor_compliance_exposure_total)}</div></div>
      <div class="impact-box" style="border-color:var(--accent)"><div class="impact-lbl">Total</div><div class="impact-val" style="color:var(--accent)">${fmtMoney(fin.total_exposure)}</div></div>
    </div>
  </div>`;

  if(data.ai_summary){
    html += `<div class="sec"><div class="sec-hdr"><span class="lbl">AI PORTFOLIO ANALYSIS</span></div><div style="white-space:pre-wrap;font-size:.85rem;line-height:1.5;">${escapeHtml(data.ai_summary)}</div></div>`;
  }

  html += `<div class="sec">
    <div class="sec-hdr"><span class="lbl">EXECUTIVE DECISION</span><span class="sec-hdr-note">signs off on or escalates the current portfolio snapshot above</span></div>
    <div class="actions">
      <button class="abtn approve" onclick="recordExecAction('acknowledged','Portfolio snapshot reviewed and signed off by executive'); showToast('Acknowledged \\u2014 logged to relay and decision log.')">&#10003; ACKNOWLEDGE</button>
      <button class="abtn escalate" onclick="recordExecAction('escalated','Escalation flagged \\u2014 notify regional PM manager'); showToast('Escalated \\u2014 logged to relay and decision log.')">&#8593; ESCALATE</button>
    </div>
  </div>`;

  html += renderApprovalRatePanelShell();

  document.getElementById('wrap').innerHTML = html;
  loadApprovalRate();
}

render();
window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_PM_STRATEGIST_RELAY' || e.key === 'TSM_EVENT_LOG') render(); });
window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === DOMAIN) render(); });
</script>
  <script src="/html/war-rooms/_relay_control_plane/relay.core.js"></script>
  <script src="/html/core/tsm-runtime.js"></script>
  <script src="/js/tsm-guide-engine.js" defer></script>
</body>
</html>
