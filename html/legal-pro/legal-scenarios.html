<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legal Scenarios · TSM Legal-Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap');
:root{
  --bg:#08111f;--bg2:#111c2b;--bg3:#162033;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --gold:#d4af37;--gold2:rgba(212,175,55,.12);
  --green:#00ff88;--green2:rgba(0,255,136,.08);
  --red:#ff5555;--red2:rgba(255,85,85,.08);
  --amber:#f5a623;--amber2:rgba(245,166,35,.08);
  --cyan:#00e5ff;--cyan2:rgba(0,229,255,.07);
  --t:#dde5f4;--m:#5a6f90;
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:var(--mono);min-height:100vh;
  background-image:linear-gradient(rgba(212,175,55,.007) 1px,transparent 1px),
    linear-gradient(90deg,rgba(212,175,55,.007) 1px,transparent 1px);
  background-size:48px 48px;
}

.flow-nav{display:flex;align-items:center;background:rgba(8,17,31,.97);border-bottom:1px solid var(--border2);
  padding:0;overflow-x:auto;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.fn-brand{padding:12px 20px;font-family:var(--sans);font-size:13px;font-weight:800;color:var(--gold);
  letter-spacing:3px;border-right:1px solid var(--border2);white-space:nowrap;flex-shrink:0}
.fn-step{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:8px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--m);border-right:1px solid var(--border);white-space:nowrap;
  text-decoration:none;transition:.2s;cursor:pointer;background:transparent;
  border-top:none;border-bottom:none;font-family:var(--mono)}
.fn-step:hover{color:var(--t);background:rgba(255,255,255,.03)}
.fn-step.active{color:var(--gold);background:var(--gold2)}
.fn-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.fn-arrow{color:var(--border2);font-size:14px;padding:0 2px;flex-shrink:0}

.shell{max-width:1100px;margin:0 auto;padding:48px 24px 80px}
.eyebrow{font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
h1{font-family:var(--sans);font-size:32px;font-weight:800;letter-spacing:-.01em;color:var(--t);margin-bottom:12px}
.lede{font-size:13px;color:var(--m);line-height:1.7;max-width:640px;margin-bottom:40px}

/* ── SCENARIO LIST ── */
.scenario-list{display:flex;flex-direction:column;gap:1px;background:var(--border);margin-bottom:32px}
.scenario{background:var(--bg2);padding:18px 20px;cursor:pointer;transition:.15s}
.scenario:hover{background:var(--bg3)}
.scenario.active{border-left:3px solid var(--gold);background:var(--bg3)}
.scenario-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.scenario-name{font-family:var(--sans);font-size:15px;font-weight:800}
.scenario-tag{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px}
.scenario-tag.high{color:var(--red);background:var(--red2);border:1px solid rgba(255,85,85,.25)}
.scenario-tag.med{color:var(--amber);background:var(--amber2);border:1px solid rgba(245,166,35,.3)}
.scenario-desc{font-size:11px;color:var(--m);line-height:1.6}

/* ── DETAIL PANEL ── */
.detail{display:none;background:var(--bg2);border:1px solid var(--border2);padding:24px;margin-bottom:24px}
.detail.show{display:block}
.detail-title{font-family:var(--sans);font-size:18px;font-weight:800;margin-bottom:10px}
.detail-fact{font-size:12px;color:var(--t);line-height:1.7;margin-bottom:18px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--bg);border:1px solid var(--border2);padding:12px 14px;font-size:12px;text-align:left;
  color:var(--t);cursor:pointer;font-family:var(--mono);transition:.15s}
.opt:hover{border-color:var(--gold)}
.opt.correct{border-color:var(--green);background:var(--green2);color:var(--green)}
.opt.incorrect{border-color:var(--red);background:var(--red2);color:var(--red)}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;padding:12px 14px;font-size:11px;line-height:1.7;border-left:3px solid var(--gold);
  background:rgba(212,175,55,.05);display:none}
.feedback.show{display:block}

.actions{margin-top:20px;display:flex;gap:10px}
.abtn{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:10px 18px;
  cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--t);transition:.2s}
.abtn.primary{background:var(--gold);border-color:var(--gold);color:#08111f;font-weight:700}
.abtn:hover{background:rgba(255,255,255,.04)}
.abtn.primary:hover{background:#e0bd4a}
.abtn:disabled{opacity:.4;cursor:default}
#toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--gold);color:var(--t);
  padding:10px 16px;font-size:11px;border-radius:4px;opacity:0;transform:translateY(10px);transition:.25s;z-index:999}
#toast.show{opacity:1;transform:translateY(0)}
</style>
</head>

<div class="shell">
  <div class="eyebrow">Judgment Practice &amp; Case Decisions</div>
  <h1>Legal Scenarios</h1>
  <p class="lede">Work through realistic matter scenarios, choose a response, and see the reasoning behind the recommended approach. Resolutions relay forward to the Case Strategist as a logged decision.</p>

  <div class="scenario-list" id="scenarioList"></div>

  <div class="detail" id="detailPanel">
    <div class="detail-title" id="detailTitle"></div>
    <div class="detail-fact" id="detailFact"></div>
    <div class="options" id="detailOptions"></div>
    <div class="feedback" id="detailFeedback"></div>
    <div class="actions">
      <button class="abtn primary" id="relayBtn" onclick="relayToStrategist()" disabled>RELAY RESOLUTION TO CASE STRATEGIST</button>
      <button class="abtn" onclick="closeDetail()">← BACK TO SCENARIOS</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SCENARIOS = [
  {
    id: 'conflict-mid-case',
    name: 'Conflict of Interest Discovered Mid-Case',
    severity: 'high',
    desc: 'A new associate joining the firm previously worked for opposing counsel on an unrelated but overlapping matter.',
    fact: 'Six weeks into active litigation, you learn a newly-hired associate spent two years at the firm representing the opposing party in a separate but related transaction. The associate has not yet touched this file.',
    options: [
      { text: 'Screen the associate from this matter and document an ethical wall immediately', correct: true,
        note: 'Correct. An ethical screen documented before any exposure, combined with prompt disclosure to the client, is the standard response and generally preserves representation.' },
      { text: 'Say nothing since the associate has not worked on the file', correct: false,
        note: 'Risky. Even without direct involvement, the appearance of conflict and imputed knowledge rules in most jurisdictions require proactive screening and disclosure, not silence.' },
      { text: 'Withdraw from the matter entirely', correct: false,
        note: 'Usually unnecessary. Withdrawal is a last resort — an effective ethical wall is typically sufficient and avoids disrupting the client relationship.' }
    ]
  },
  {
    id: 'improper-fee',
    name: 'Client Requests an Improper Fee Structure',
    severity: 'med',
    desc: 'A client asks to structure a contingency fee in a way that conflicts with state bar rules for the matter type.',
    fact: 'A client in a family-law matter requests a contingency fee arrangement. Most jurisdictions prohibit contingency fees in domestic relations cases as a matter of public policy.',
    options: [
      { text: 'Explain the prohibition and propose a compliant fee structure (hourly or flat fee)', correct: true,
        note: 'Correct. Contingency fees are barred in domestic relations matters in most jurisdictions. Redirecting to a compliant structure protects both the client and the firm.' },
      { text: 'Agree to the contingency fee since the client requested it', correct: false,
        note: 'This creates a serious ethics violation and could void the fee agreement or trigger bar discipline.' },
      { text: 'Draft the agreement as hourly but privately track it as contingency', correct: false,
        note: 'This is fee-agreement fraud and a bar-discipline matter in its own right — never structure a workaround to disguise a prohibited fee arrangement.' }
    ]
  },
  {
    id: 'missed-filing',
    name: 'Opposing Counsel Missed a Filing Deadline',
    severity: 'med',
    desc: 'The opposing party missed a statutory response deadline. Several strategic paths are available.',
    fact: 'Opposing counsel missed the deadline to respond to a motion by three days, with no request for extension filed.',
    options: [
      { text: 'Move for default/relief as procedurally appropriate, while documenting the missed deadline', correct: true,
        note: 'Correct. Pursuing available procedural remedies is a legitimate advocacy duty to the client — courtesy calls are optional, not obligatory, once a deadline has lapsed without request.' },
      { text: 'Ignore the miss and wait for opposing counsel to notice on their own', correct: false,
        note: 'This does not serve the client\'s interests and may waive available procedural relief if too much time passes.' },
      { text: 'File a bar complaint against opposing counsel immediately', correct: false,
        note: 'Disproportionate for a single missed deadline absent a pattern of misconduct — pursue the procedural remedy first.' }
    ]
  },
  {
    id: 'privilege-dispute',
    name: 'Discovery Document Privilege Dispute',
    severity: 'high',
    desc: 'A privileged document was inadvertently produced in discovery to opposing counsel.',
    fact: 'During document review, you discover that an attorney-client privileged memo was inadvertently included in last week\'s production to opposing counsel.',
    options: [
      { text: 'Notify opposing counsel promptly in writing and formally request return/destruction under the clawback provision', correct: true,
        note: 'Correct. Prompt written notice invoking any applicable clawback agreement or rule (e.g., FRE 502(b)) is the standard and generally required response to preserve the privilege claim.' },
      { text: 'Say nothing and hope opposing counsel does not notice', correct: false,
        note: 'Silence risks waiver of privilege and does not meet the duty of candor — inadvertent production must be addressed promptly once discovered.' },
      { text: 'Demand opposing counsel be sanctioned for reviewing the document', correct: false,
        note: 'Premature — the document was produced by your own side\'s error; the immediate step is the clawback request, not a sanctions motion.' }
    ]
  }
];

let currentScenario = null;
let resolved = false;

function renderList(){
  const list = document.getElementById('scenarioList');
  list.innerHTML = SCENARIOS.map(s => `
    <div class="scenario" onclick="openScenario('${s.id}')">
      <div class="scenario-top">
        <div class="scenario-name">${s.name}</div>
        <span class="scenario-tag ${s.severity}">${s.severity === 'high' ? 'High Stakes' : 'Moderate'}</span>
      </div>
      <div class="scenario-desc">${s.desc}</div>
    </div>
  `).join('');
}

function openScenario(id){
  currentScenario = SCENARIOS.find(s => s.id === id);
  resolved = false;
  document.getElementById('detailTitle').textContent = currentScenario.name;
  document.getElementById('detailFact').textContent = currentScenario.fact;
  document.getElementById('detailOptions').innerHTML = currentScenario.options.map((o, i) => `
    <button class="opt" onclick="chooseOption(${i})">${o.text}</button>
  `).join('');
  document.getElementById('detailFeedback').classList.remove('show');
  document.getElementById('relayBtn').disabled = true;
  document.getElementById('detailPanel').classList.add('show');
  document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth' });
}

function chooseOption(i){
  if(resolved) return;
  resolved = true;
  const opts = document.querySelectorAll('#detailOptions .opt');
  const chosen = currentScenario.options[i];
  opts.forEach((btn, idx) => {
    btn.disabled = true;
    if(currentScenario.options[idx].correct) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('incorrect');
  });
  const fb = document.getElementById('detailFeedback');
  fb.textContent = chosen.note;
  fb.classList.add('show');
  document.getElementById('relayBtn').disabled = false;
}

function closeDetail(){
  document.getElementById('detailPanel').classList.remove('show');
  currentScenario = null;
}

function nav(page){ window.location.href = page; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function relayToStrategist(){
  if(!currentScenario) return;
  const payload = {
    domain: 'LEGAL_SCENARIO',
    scenarioId: currentScenario.id,
    scenarioName: currentScenario.name,
    severity: currentScenario.severity,
    resolvedAt: Date.now()
  };
  try{
    if(window.TSM_KERNEL && typeof TSM_KERNEL.setRelay === 'function'){
      TSM_KERNEL.setRelay('legal-pro', JSON.stringify(payload));
    }
  }catch(e){ /* relay unavailable in this context */ }
  showToast('Resolution relayed to Case Strategist');
}

renderList();

window.tsmMission = window.tsmMission || {
  id: 'LEGAL-PRO-' + Date.now().toString(36),
  vertical: 'legal-pro'
};
</script>
