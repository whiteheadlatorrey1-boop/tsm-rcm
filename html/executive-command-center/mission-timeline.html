<!DOCTYPE html>

<html>

<head>

<title>
TSM Mission Timeline
</title>


<style>

body{
font-family:Arial;
padding:40px;
background:#0f172a;
color:white;
}


.card{

background:#1e293b;
padding:25px;
border-radius:12px;
margin-bottom:20px;

}


.timeline-event{

padding:15px;
margin:10px 0;
background:#334155;
border-left:5px solid #38bdf8;

}


button{

padding:12px;
margin:5px;
cursor:pointer;

}

</style>


</head>


<body>


<h1>
TSM Enterprise Mission Timeline
</h1>


<div class="card">


<button onclick="loadMission('MISSION-CON-001')">
Construction Permit Delay
</button>


<button onclick="loadMission('MISSION-HC-001')">
Healthcare Claim Denial
</button>


<button onclick="loadMission('MISSION-FIN-001')">
Vendor Invoice Exception
</button>


</div>



<div class="card">

<h2>
Execution Timeline
</h2>


<div id="timeline">

Select Mission

</div>


</div>



<script src="/shared/runtime/enterprise/mission-timeline-engine.js"></script>


<script>

TSMMissionTimeline.load();


function loadMission(id){

TSMMissionTimeline.render(
id,
"#timeline"
);

}

</script>


</body>

</html>
