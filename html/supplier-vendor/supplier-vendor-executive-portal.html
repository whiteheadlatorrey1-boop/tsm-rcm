<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSM &middot; Supplier/Vendor Executive Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a0f;--bg2:#0a1020;--bg3:#0d1528;
  --cyan:#00d4d4;--amber:#f5a623;--green:#22c55e;
  --red:#ef4444;--purple:#a855f7;--blue:#3b82f6;
  --orange:#f97316;--text:#e2e8f0;--muted:#64748b;--border:#1e293b;
  --gold:#e8c15a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#020810;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--gold);letter-spacing:.15em;}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--gold);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.08em;color:var(--text);}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--gold);color:var(--gold);}
.hbtn.primary{border-color:var(--gold);color:var(--gold);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--gold);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.sec-hdr .lbl::before{content:'\25C6';font-size:.55rem;margin-right:8px;}
.sec-hdr-note{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted);text-transform:none;letter-spacing:0;}
.no-items{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center;}
.kpi-val{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--gold);}
.kpi-val.red{color:var(--red);}.kpi-val.green{color:var(--green);}.kpi-val.cyan{color:var(--cyan);}
.kpi-lbl{font-size:.6rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.meta-row{display:flex;gap:18px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);margin-top:10px;}
.meta-row span{color:var(--text);}

.fin-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px;}
.fin-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;text-align:center;}
.fin-card.hero{border-color:var(--gold);background:rgba(232,193,90,.06);}
.fin-val{font-family:'Orbitron',sans-serif;font-size:1.6rem;font-weight:900;color:var(--gold);}
.fin-val.red{color:var(--red);}.fin-val.green{color:var(--green);}.fin-val.cyan{color:var(--cyan);}
.fin-lbl{font-size:.62rem;color:var(--muted);margin-top:8px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.fin-sub{font-size:.58rem;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;}

.risk-item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #0f1a2e;}
.risk-item:last-child{border-bottom:none;}
.risk-rank{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:900;color:var(--gold);width:28px;flex-shrink:0;}
.risk-body{flex:1;}
.risk-title{font-size:.85rem;color:var(--text);margin-bottom:4px;}
.risk-title b{color:var(--red);}
.risk-action{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);}
.risk-badge{font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.risk-badge.critical{background:rgba(239,68,68,.12);color:var(--red);border:1px solid var(--red);}
.risk-badge.high{background:rgba(245,166,35,.12);color:var(--amber);border:1px solid var(--amber);}
.risk-badge.med{background:rgba(100,116,139,.12);color:var(--muted);border:1px solid var(--muted);}

.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.abtn{font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.08em;padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);}
.abtn.approve{border-color:var(--green);color:var(--green);}
.abtn.escalate{border-color:var(--red);color:var(--red);}
.abtn:hover{opacity:.85;}
.ai-box{background:rgba(232,193,90,.06);border:1px solid var(--gold);border-radius:6px;padding:22px;margin-bottom:16px;white-space:pre-wrap;font-size:.95rem;line-height:1.55;}
.exec-log{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:10px;}
.exec-log div{padding:4px 0;border-top:1px solid #0f1a2e;}
</style>
</head>
<body>
<div class="topbar">
  <span class="tb-brand">TSM &middot; SUPPLIER/VENDOR EXECUTIVE PORTAL</span>
  <span class="tb-time" id="clock"></span>
</div>
<div class="hdr">
  <div>
    <div class="hdr-title" id="hdrTitle">&#128188; SUPPLIER/VENDOR EXECUTIVE PORTAL</div>
    <div class="hdr-sub" id="hdrSub">Awaiting relay from the Supplier/Vendor war room&hellip;</div>
  </div>
  <div class="hdr-btns">
    <a class="hbtn" href="supplier-vendor-situation-room.html">&larr; War Room</a>
    <a class="hbtn primary" href="supplier-vendor-strategist-v2.html">Strategist View &rarr;</a>
    <button class="hbtn" id="printBtn" onclick="window.print()">&darr; Export</button>
  </div>
</div>
<div class="wrap" id="wrap"><!-- populated by JS --></div>
<div class="wrap" id="excWrap" style="padding-top:0;"><div id="tsm-exception-queue"></div></div>
<div class="toast" id="toast"></div>
<script src="/html/js/tsm-bnca-exposure-engine.js"></script>
<script src="/html/shared/tsm-exec-framework.js"></script>
<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const DOMAIN = 'VENDOR';
const RELAY_KEY_FALLBACK = 'TSM_VENDOR_WAR_RELAY';

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

function loadRelay(){
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(DOMAIN);
      if(d) return d;
    }
  } catch(e){}
  try {
    const raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

// Parses a strict money literal ($8.2M, $450K, $1,200,000) out of the AI's
// free-text revenueAtRisk field. Returns null on anything that doesn't
// cleanly match — never guesses a number out of ambiguous text.
function parseMoneyLoose(s){
  if(!s) return null;
  const m = String(s).trim().match(/^\$?([\d,]+(?:\.\d+)?)\s*(K|M|B)?$/i);
  if(!m) return null;
  const n = parseFloat(m[1].replace(/,/g,''));
  if(!isFinite(n)) return null;
  const mult = {K:1e3, M:1e6, B:1e9}[(m[2]||'').toUpperCase()] || 1;
  return n * mult;
}

// BNCA exposure projection — deterministic, sourced only from this
// incident's own revenueAtRisk figure (same calculation the strategist
// page runs). Honestly reports "unavailable" when that figure isn't in a
// fixed money format, rather than fabricating a number from ambiguous text.
function computeExposureBNCA(ex){
  if(!window.TSMBNCAExposureEngine) return null;
  const base = parseMoneyLoose(ex.revenueAtRisk);
  if(base === null || base <= 0){
    return { unavailable: true, reason: 'revenue at risk is not in a fixed money format' };
  }
  const sevMap = { CRITICAL:'CRIT', HIGH:'HIGH', MEDIUM:'MED' };
  return window.TSMBNCAExposureEngine.project({
    baseExposure: base,
    severity: sevMap[ex.severity] || 'MED',
    confidence: Number.isFinite(ex.confidence) ? ex.confidence : 70,
    daysUntilDeadline: 0
  });
}

// Generic exception feeder for this vertical's own risks list — no
// fabricated fields, same convention as the rest of the platform.
// Self-dedupes per page load.
var _exceptionsSeen = {};
function feedVendorExceptions(ex){
  if(!window.TSMExceptions || !ex || !Array.isArray(ex.risks)) return;
  ex.risks.forEach(function(r){
    if(!r || !r.text) return;
    const key = 'vendor:' + r.text.slice(0,60);
    if(_exceptionsSeen[key]) return;
    _exceptionsSeen[key] = true;
    const lvl = String(r.level||'MED').toUpperCase();
    const severity = (lvl === 'CRITICAL' || lvl === 'HIGH') ? 'high' : (lvl === 'MED' ? 'med' : 'low');
    try {
      window.TSMExceptions.add({
        sector: 'vendor',
        entityType: 'vendor-risk',
        entityId: key,
        title: r.text,
        severity: severity,
        source: 'Supplier/Vendor Strategist'
      });
    } catch(e){}
  });
}

// Write back an exec action without clobbering the rest of the relay payload
// (TSM.relay writes overwrite the full stored object per key, so we merge).
function recordExecAction(action){
  const data = loadRelay();
  if(!data) return;
  data.exec_actions = data.exec_actions || [];
  data.exec_actions.push({ action, ts: new Date().toISOString() });
  try {
    sessionStorage.setItem(RELAY_KEY_FALLBACK, JSON.stringify(data));
    localStorage.setItem(RELAY_KEY_FALLBACK, JSON.stringify(data));
  } catch(e){}
  render();
}

function escapeHtml(s){
  return String(s==null?'&mdash;':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderEmpty(){
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO DATA RECEIVED</h2>
      <p>Run the extraction engine in the Supplier/Vendor war room, then relay it here.</p>
      <div class="hdr-btns" style="justify-content:center;">
        <a class="hbtn primary" href="supplier-vendor-situation-room.html">&#128717; Go to War Room</a>
      </div>
    </div>`;
}

function execAction(sev){
  if(sev === 'CRITICAL') return 'Engage account/supplier lead now \u2014 exposure is compounding.';
  if(sev === 'HIGH') return 'Confirm remediation ETA with ops; escalate if unresolved today.';
  return 'Monitor \u2014 lower board-level exposure at current pace.';
}

function renderFinancials(ex){
  return `<div class="fin-row">
    <div class="fin-card hero">
      <div class="fin-val">${escapeHtml(ex.revenueAtRisk)}</div>
      <div class="fin-lbl">REVENUE AT RISK</div>
      <div class="fin-sub">${escapeHtml(ex.incidentLabel || 'Current incident')}</div>
    </div>
    <div class="fin-card">
      <div class="fin-val red">${escapeHtml(ex.runway)}</div>
      <div class="fin-lbl">RUNWAY TO CRITICAL FAILURE</div>
      <div class="fin-sub">${escapeHtml(ex.linesImpacted)} line(s) impacted</div>
    </div>
    <div class="fin-card">
      <div class="fin-val cyan">${escapeHtml(ex.clientsImpacted)}</div>
      <div class="fin-lbl">CLIENTS IMPACTED</div>
      <div class="fin-sub">${Number.isFinite(ex.confidence) ? ex.confidence+'% AI confidence' : '&mdash;'}</div>
    </div>
  </div>`;
}

function renderRiskRegister(risks){
  if(!risks || !risks.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span></div><div class="no-items">No risks extracted &mdash; nothing to escalate to the board.</div></div>`;
  }
  const order = {CRITICAL:0, HIGH:1, MED:2};
  const top3 = risks.slice().sort((a,b) => (order[a.level]??3) - (order[b.level]??3)).slice(0,3);
  const rows = top3.map((r, idx) => {
    const lvl = (r.level||'MED').toLowerCase();
    return `<div class="risk-item">
      <div class="risk-rank">${idx+1}</div>
      <div class="risk-body">
        <div class="risk-title"><span class="risk-badge ${lvl}">${escapeHtml(r.level||'MED')}</span>&nbsp; ${escapeHtml(r.text)}</div>
        <div class="risk-action">${escapeHtml(execAction(r.level))}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span><span class="sec-hdr-note">ranked by severity</span></div>
    ${rows}
  </div>`;
}

function renderExecLog(actions){
  if(!actions || !actions.length) return '';
  const rows = actions.slice().reverse().slice(0,5).map(a =>
    `<div>${a.action} &mdash; ${new Date(a.ts).toLocaleString()}</div>`).join('');
  return `<div class="exec-log">${rows}</div>`;
}

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  const ex = data.extraction || {};
  document.getElementById('hdrSub').innerHTML = `${escapeHtml(ex.incidentLabel || data.selectedSector || 'Supplier/Vendor Management')} &middot; Relayed ${data.timestamp ? new Date(data.timestamp).toLocaleString() : '&mdash;'}`;

  let html = '';
  html += renderFinancials(ex);

  if(ex.situationSummary){
    html += `<div class="ai-box"><strong style="color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:8px;">EXECUTIVE SUMMARY</strong>${escapeHtml(ex.situationSummary)}</div>`;
  }

  html += renderRiskRegister(ex.risks);

  // Strategist-reviewed badge + exposure projection, so this page reflects
  // the strategist's actual second hop instead of just war room's raw
  // broadcast.
  if(window.TSMExecFramework){
    html += window.TSMExecFramework.renderReviewBadge(data);
    html += window.TSMExecFramework.renderBNCA(computeExposureBNCA(ex));
  }

  html += `<div class="sec"><div class="sec-hdr"><span class="lbl">EXECUTIVE ACTIONS</span></div>
    <div class="action-bar">
      <button class="abtn approve" onclick="recordExecAction('ACKNOWLEDGE'); showToast('Marked reviewed.')">&#10003; ACKNOWLEDGE</button>
      <button class="abtn escalate" onclick="recordExecAction('ESCALATE'); showToast('Escalation flagged \u2014 notify ops lead.')">&#8593; ESCALATE</button>
    </div>
    ${renderExecLog(data.exec_actions)}
  </div>`;

  document.getElementById('wrap').innerHTML = html;

  // Feed the exception queue from this vertical's own risks data — no
  // fabricated fields, same convention as the rest of the platform.
  if(window.TSMExceptions && window.TSMExceptionWidget){
    feedVendorExceptions(ex);
    window.TSMExceptionWidget.mount('tsm-exception-queue', { sector: 'vendor' });
  }
}

render();
window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_EVENT_LOG') render(); });
window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === DOMAIN) render(); });
</script>
  <script src="/html/war-rooms/_relay_control_plane/relay.core.js"></script>
  <script src="/html/shared/tsm-exceptions.js"></script>
  <script src="/html/js/widgets/tsm-exception-widget.js"></script>
  <script src="/html/core/tsm-runtime.js"></script>
</body>
</html>
