body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}

.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}

.ai-box{background:rgba(245,158,11,.06);border:1px solid var(--accent);border-radius:6px;padding:16px;margin-bottom:16px;white-space:pre-wrap;font-size:.88rem;line-height:1.55;}

.ai-box table.md-table th{color:var(--muted);text-transform:uppercase;font-size:.6rem;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--accent);color:var(--accent);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}

.impact.low{background:rgba(74,122,155,.12);color:var(--muted);border:1px solid var(--muted);}

<!-- Loaded here, BEFORE the main inline script below, so window.TSMIntegrity
     exists by the time render() -> loadRelay() first runs synchronously on
     page load. (relay.core.js is loaded further down and isn't available on
     that first render either — pre-existing, out of scope here — but the
     integrity check doesn't depend on it.) -->
<script src="/html/shared/runtime/integrity/tsm-integrity.js"></script>
<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const DOMAIN = 'HOTELOPS';
const RELAY_KEY_FALLBACK = 'TSM_' + DOMAIN + '_RELAY';

// ── ENTERPRISE CAPABILITY SWEEP ──
// Reference pattern: bpo-strategist.html's fireCapabilitySweep_BPO(), fired
// from an explicit user click (storeStratRelay). This page has no equivalent
// click — render() re-runs automatically on every relay/storage event — so
// firing unconditionally would create a brand-new O2C/CRM/CPQ/Catalog/
// Approval case on every re-render for the same underlying incident.
// lastSweptSignature guards against that: sweep fires once per distinct
// relay payload (keyed on data.timestamp, falling back to a shape hash for
// payloads that omit it), not once per render() call.
let lastSweptSignature = null;

function fireCapabilitySweep_HotelOps(data){
  try {
    const kpis = data.kpis || {};
    const fin = data.financials || {};
    const worstMaint = (data.maintenance_breaches || []).slice().sort((a,b) => b.hours_over - a.hours_over)[0];
    const worstCompliance = (data.compliance_risk || []).slice().sort((a,b) => a.due_in_days - b.due_in_days)[0];
    const exposureStr = fin.ota_overcharge_period ? ('$' + Number(fin.ota_overcharge_period).toLocaleString()) : null;

    const summaryParts = [];
    if (data.ai_summary) summaryParts.push(String(data.ai_summary).slice(0, 800));
    if (worstMaint) summaryParts.push(`Highest SLA breach: Room ${worstMaint.room} \u2014 ${worstMaint.title} (${worstMaint.hours_over}h over SLA).`);
    if (worstCompliance) summaryParts.push(`Most urgent compliance item: ${worstCompliance.type}, due in ${worstCompliance.due_in_days}d.`);
    const summary = (summaryParts.join(' ') || 'HotelOps strategist synthesis.').slice(0, 1500);

    fetch('/api/enterprise/capability-sweep', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        vertical: 'hotelops',
        title: 'HotelOps' + (worstMaint || worstCompliance ? ' \u2014 Operations Sweep' : ''),
        summary,
        exposure: exposureStr,
        entities: {
          customer: 'HotelOps Property',
          relationshipType: 'Property Account',
          contingency: 'Maintenance / compliance remediation reserve',
          sku: worstCompliance ? worstCompliance.type : 'HOTELOPS-CASE',
          productName: worstMaint ? worstMaint.title : 'HotelOps Operations'
        }
      })
    }).catch(err => console.warn('[Capability Sweep HotelOps]', err.message));
  } catch (err) { console.warn('[Capability Sweep HotelOps]', err.message); }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

// Dedupe on the full raw string, not the claimed hash: an attacker (or
// accidental corruption) that mutates content WITHOUT re-signing leaves
// _integrity.hash unchanged, so keying off the hash alone would treat
// "already verified this hash" as permanently true after the first
// legitimate check — silently disabling detection for exactly the case
// this exists to catch.
const HOTELOPS_VERIFIED_CONTENT = new Set();
function verifyRelayIntegrity(data, raw){
  if (!data || !data._integrity || !data._integrity.hash || !raw) return;
  if (!window.TSMIntegrity || typeof window.TSMIntegrity.verify !== 'function') return;
  if (HOTELOPS_VERIFIED_CONTENT.has(raw)) return;
  HOTELOPS_VERIFIED_CONTENT.add(raw);
  window.TSMIntegrity.verify(data).then(result => {
    if (!result.ok && result.reason === 'mismatch') {
      console.warn('[hotelops-strategist] relay integrity mismatch:', result);
      if (typeof showToast === 'function') {
        showToast('Warning: relay data failed integrity check — may be stale or tampered.');
      }
    }
  }).catch(() => {});
}

function loadRelay(){
  let data = null;
  let raw = null;
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(DOMAIN);
      if(d) { data = d; raw = JSON.stringify(d); }
    }
  } catch(e){}
  if (data === null) {
    try {
      raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem('TSM_HOTELOPS_STRATEGIST_RELAY');
      data = raw ? JSON.parse(raw) : null;
    } catch(e){ data = null; }
  }
  verifyRelayIntegrity(data, raw);
  return data;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtVal(v, fmt){
  if(v===undefined || v===null || v==='') return '&mdash;';
  if(fmt==='money') return '$' + Number(v).toLocaleString();
  if(fmt==='pct') return v + '%';
  return String(v);
}

function renderEmpty(){
  const liveHtml = renderLiveMissionsRegister();
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO DATA RECEIVED</h2>
      <p>Run an analysis in the HotelOps war room, then relay it here.</p>
      <div class="hdr-btns" style="justify-content:center;">
        <a class="hbtn primary" href="concierge-war-room.html">&#127976; Go to War Room</a>
      </div>
    </div>${liveHtml}`;
}

// Same generic markdown/table renderer used by Mortgage's strategist --
// no vertical-specific logic in here, safe to reuse verbatim.
function renderEngineOutput(text) {
  if(!text) return '';
  const clean = text.replace(/KPI_JSON:\s*\{[^}]*\}\n*/i, '').trim();
  const lines = clean.split('\n');
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const inlineFmt = s => escapeHtml(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const tables = [];
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      const headers = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table class="md-table"><thead><tr>' + headers.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        t += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      outLines.push(`@@TABLE${tables.length}@@`);
      tables.push(t);
      continue;
    }
    outLines.push(line);
    i++;
  }
  let html = escapeHtml(outLines.join('\n'));
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^▸\s*(.+)$/gm, '<div style="margin:4px 0">▸ $1</div>');
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="margin:4px 0 4px 8px"><strong>$1.</strong> $2</div>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  tables.forEach((t, idx) => { html = html.replace(`@@TABLE${idx}@@`, t); });
  return html;
}

/* ---------- Business-value framing helpers, built for HotelOps's real
   severity vocabulary (urgent/high/medium/low), not Mortgage's loan
   stages. ---------- */

function nextActionMaint(b){
  if(b.severity === 'urgent') return 'Escalate immediately \u2014 guest-impact risk; dispatch engineering now.';
  if(b.severity === 'high') return 'Assign engineering today; confirm guest room status.';
  if(b.severity === 'medium') return 'Schedule repair within 24h; notify housekeeping if room-blocking.';
  return 'Queue for next maintenance sweep.';
}

function impactFromSeverity(sev){
  if(sev === 'urgent') return { cls: 'high', label: 'URGENT' };
  if(sev === 'high') return { cls: 'high', label: 'HIGH IMPACT' };
  if(sev === 'medium') return { cls: 'medium', label: 'MED IMPACT' };
  return { cls: 'low', label: 'LOW IMPACT' };
}

function impactFromComplianceSeverity(sev){
  if(sev === 'HIGH') return { cls: 'high', label: 'HIGH IMPACT' };
  if(sev === 'MED') return { cls: 'medium', label: 'MED IMPACT' };
  return { cls: 'low', label: 'LOW IMPACT' };
}

function renderMaintenanceQueue(breaches){
  if(!breaches || !breaches.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">MAINTENANCE ACTION QUEUE</span></div><div class="no-items">No SLA-breaching maintenance tickets &mdash; queue is clear.</div></div>`;
  }
  const rows = breaches.slice().sort((a,b) => b.hours_over - a.hours_over).map(b => {
    const impact = impactFromSeverity(b.severity);
    return `<tr>
      <td><strong>Room ${escapeHtml(b.room)}</strong><br><span style="color:var(--muted);font-size:.7rem;">${escapeHtml(b.title)}</span></td>
      <td><span class="impact ${impact.cls}">${impact.label}</span></td>
      <td class="time-hot">${b.hours_over}h over SLA</td>
      <td class="action-hint">${escapeHtml(nextActionMaint(b))}</td>
    </tr>`;
  }).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">MAINTENANCE ACTION QUEUE</span><span class="sec-hdr-note">ranked by hours over SLA</span></div>
    <table class="aq-table">
      <thead><tr><th>Ticket</th><th>Impact</th><th>Time Over SLA</th><th>Recommended Next Step</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderOtaTable(fin){
  const items = (fin && fin.ota_items) || [];
  if(!items.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">OTA COMMISSION AUDIT</span></div><div class="no-items">No OTA overcharges detected against contracted rates.</div></div>`;
  }
  const rows = items.map(it => `
    <tr>
      <td><strong>${escapeHtml(it.ota)}</strong></td>
      <td>${it.contracted_pct}%</td>
      <td class="time-hot">${it.charged_pct}%</td>
      <td>${fmtVal(it.booking_amount,'money')}</td>
      <td class="time-hot">${fmtVal(it.overcharge_amount,'money')}</td>
    </tr>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">OTA COMMISSION AUDIT</span><span class="sec-hdr-note">this period, ranked by overcharge $</span></div>
    <table class="aq-table">
      <thead><tr><th>OTA</th><th>Contracted %</th><th>Charged %</th><th>Booking Amount</th><th>Overcharge</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderComplianceRegister(items){
  if(!items || !items.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">COMPLIANCE RISK REGISTER</span></div><div class="no-items">No open compliance items.</div></div>`;
  }
  const rows = items.map(c => {
    const impact = impactFromComplianceSeverity(c.severity);
    return `<tr>
      <td><strong>${escapeHtml(c.type)}</strong><br><span style="color:var(--muted);font-size:.7rem;">${escapeHtml(c.detail)}</span></td>
      <td><span class="impact ${impact.cls}">${impact.label}</span></td>
      <td class="${c.due_in_days<=14?'time-hot':''}">${c.due_in_days}d</td>
    </tr>`;
  }).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">COMPLIANCE RISK REGISTER</span><span class="sec-hdr-note">sorted by due date</span></div>
    <table class="aq-table">
      <thead><tr><th>Item</th><th>Impact</th><th>Due In</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderAirbnbRegister(items){
  const rows = (items||[]).map(it => `<tr>
    <td>${it.unit_name} (${it.listing_id})</td>
    <td>${it.severity ? it.severity.toUpperCase() : ''}</td>
    <td>${it.issue}</td>
    </tr>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">AIRBNB / STR RISK REGISTER</span><span class="sec-hdr-note">flagged listings</span></div>
    <table class="aq-table">
      <thead><tr><th>Listing</th><th>Severity</th><th>Issue</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderExplainItems(items){
  if(!items || !items.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">EXPLAINABILITY &mdash; WHY EACH ITEM IS FLAGGED</span></div><div class="no-items">Nothing currently flagged.</div></div>`;
  }
  const catLabel = {
    maintenance: 'Maintenance', ota_overcharge: 'OTA Overcharge', compliance: 'Compliance',
    iot: 'IoT Sensor', reservation: 'Reservation', front_desk: 'Front Desk', vip: 'VIP Readiness',
    housekeeping: 'Housekeeping', staffing: 'Staffing', incident: 'Incident', airbnb: 'Airbnb/STR'
  };
  const rows = items.map(it => `<tr>
    <td>${escapeHtml(catLabel[it.category] || it.category)}</td>
    <td>${it.severity ? `<span class="impact">${escapeHtml(it.severity.toUpperCase())}</span>` : ''}</td>
    <td>${escapeHtml(it.explain)}</td>
  </tr>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">EXPLAINABILITY &mdash; WHY EACH ITEM IS FLAGGED</span><span class="sec-hdr-note">${items.length} flagged, sorted by severity</span></div>
    <table class="aq-table">
      <thead><tr><th>Category</th><th>Severity</th><th>Reason (real per-record data)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// Business Impact Delta — deterministic, no LLM-guessed dollars. Uses the
// same shared TSMBNCAExposureEngine as Insurance/RE/Healthcare/BPO/FinOps;
// only the inputs differ. Severity and the deadline signal are both derived
// from real per-record data (worst compliance due date, worst SLA breach) —
// same records already used by fireCapabilitySweep_HotelOps above.
function severityFromOpsSignals(worstMaint, worstCompliance){
  const dueDays = worstCompliance && Number.isFinite(worstCompliance.due_in_days) ? worstCompliance.due_in_days : null;
  const hoursOver = worstMaint && Number.isFinite(worstMaint.hours_over) ? worstMaint.hours_over : null;
  if ((dueDays !== null && dueDays <= 7) || (hoursOver !== null && hoursOver >= 48)) return 'CRIT';
  if ((dueDays !== null && dueDays <= 14) || (hoursOver !== null && hoursOver >= 24)) return 'HIGH';
  if ((dueDays !== null && dueDays <= 30) || (hoursOver !== null && hoursOver > 0)) return 'MED';
  return 'LOW';
}

function renderBusinessImpactDelta(data){
  const fin = data.financials || {};
  const baseExposure = Number(fin.ota_overcharge_period) || 0;
  if (!baseExposure || !window.TSMBNCAExposureEngine) {
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">BUSINESS IMPACT DELTA</span></div><div class="no-items">No quantifiable OTA overcharge exposure reported for this relay.</div></div>`;
  }
  const worstMaint = (data.maintenance_breaches || []).slice().sort((a,b) => b.hours_over - a.hours_over)[0];
  const worstCompliance = (data.compliance_risk || []).slice().sort((a,b) => a.due_in_days - b.due_in_days)[0];
  const severity = severityFromOpsSignals(worstMaint, worstCompliance);
  const daysUntilDeadline = worstCompliance && Number.isFinite(worstCompliance.due_in_days) ? worstCompliance.due_in_days : 0;
  const impact = window.TSMBNCAExposureEngine.project({
    baseExposure, severity,
    confidence: 70, // no distinct AI-confidence signal in this vertical's relay yet; engine's own documented neutral default
    daysUntilDeadline
  });
  const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">BUSINESS IMPACT DELTA</span><span class="sec-hdr-note">OTA overcharge exposure &middot; deterministic projection</span></div>
    <div class="tsm-delta-row">
      <div class="tsm-delta-box tsm-delta-no"><div class="tsm-delta-lbl">No Action</div><div class="tsm-delta-val">${fmt(impact.ifIgnored.exposure)}</div></div>
      <div class="tsm-delta-box tsm-delta-act"><div class="tsm-delta-lbl">With Action</div><div class="tsm-delta-val">${fmt(impact.ifActed.exposure)}</div></div>
    </div>
    <div class="tsm-recovery">${escapeHtml(impact.urgencyWindow)} &middot; ${escapeHtml(impact.methodology)}</div>
  </div>`;
}

function renderLiveMissionsRegister(){
  if(!window.TSMMissionStore) return '';
  const missions = window.TSMMissionStore.listMissions({ vertical: 'hotelops' });
  if(!missions.length) return '';
  const open = missions.filter(m => m.stage !== 'closed' && m.stage !== 'delivered');
  if(!open.length) return '';
  const rows = open.map(m => `<tr>
    <td><strong>${escapeHtml(m.client || m.missionNo || m.id)}</strong></td>
    <td>${escapeHtml(m.stage)}</td>
    <td>${m.workflow && m.workflow.priority ? escapeHtml(m.workflow.priority) : '&mdash;'}</td>
  </tr>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">LIVE MISSIONS</span><span class="sec-hdr-note">from Mission Store, vertical: hotelops</span></div>
    <table class="aq-table">
      <thead><tr><th>Client / Ref</th><th>Stage</th><th>Priority</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  document.getElementById('hdrSub').textContent = `Relayed ${data.timestamp ? new Date(data.timestamp).toLocaleString() : '&mdash;'}`;

  const sweepSignature = data.timestamp || JSON.stringify({ kpis: data.kpis, fin: data.financials, m: data.maintenance_breaches, c: data.compliance_risk });
  if (sweepSignature !== lastSweptSignature) {
    lastSweptSignature = sweepSignature;
    fireCapabilitySweep_HotelOps(data);
  }

  const kpis = data.kpis || {};
  const fin = data.financials || {};

  let html = '';

  html += `<div class="kpi-row">
    <div class="kpi"><div class="kpi-val amber">${fmtVal(kpis.revpar,'money')}</div><div class="kpi-lbl">REVPAR</div></div>
    <div class="kpi"><div class="kpi-val amber">${fmtVal(kpis.adr,'money')}</div><div class="kpi-lbl">ADR</div></div>
    <div class="kpi"><div class="kpi-val ${kpis.occupancy_pct>=80?'green':'amber'}">${fmtVal(kpis.occupancy_pct,'pct')}</div><div class="kpi-lbl">OCCUPANCY</div></div>
    <div class="kpi"><div class="kpi-val ${kpis.gop_margin_pct>=(kpis.gop_target_pct||0)?'green':'red'}">${fmtVal(kpis.gop_margin_pct,'pct')}</div><div class="kpi-lbl">GOP MARGIN</div></div>
    <div class="kpi"><div class="kpi-val ${kpis.nps_score>=(kpis.nps_industry_avg||0)?'green':'red'}">${fmtVal(kpis.nps_score)}</div><div class="kpi-lbl">NPS SCORE</div></div>
    <div class="kpi"><div class="kpi-val red">${fmtVal(kpis.maint_tickets_over_sla)}</div><div class="kpi-lbl">MAINT OVER SLA</div></div>
    <div class="kpi"><div class="kpi-val red">${fmtVal(fin.ota_overcharge_period,'money')}</div><div class="kpi-lbl">OTA OVERCHARGE</div></div>
    <div class="kpi"><div class="kpi-val red">${fmtVal(kpis.compliance_items_at_risk)}</div><div class="kpi-lbl">COMPLIANCE AT RISK</div></div>
  </div>`;

  if(data.ai_summary){
    html += `<div class="ai-box"><strong style="color:var(--accent);font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:8px;">AI OPERATIONS ANALYSIS</strong>${renderEngineOutput(data.ai_summary)}</div>`;
  }

  html += renderBusinessImpactDelta(data);
  html += renderMaintenanceQueue(data.maintenance_breaches);
  html += renderOtaTable(fin);
  html += renderComplianceRegister(data.compliance_risk);
  html += renderAirbnbRegister(data.airbnb_risks ? data.airbnb_risks.items : []);
  html += renderExplainItems(data.explain_items);
  html += renderLiveMissionsRegister();

  document.getElementById('wrap').innerHTML = html;
}

render();
window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_EVENT_LOG') render(); });
window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === DOMAIN) render(); });
if (window.TSMMissionStore) {
  window.TSMMissionStore.subscribe('*', () => render());
}
</script>
  <script src="/html/war-rooms/_relay_control_plane/relay.core.js"></script>
  <script src="/html/core/tsm-runtime.js"></script>
</body>
