<!DOCTYPE html>
<html lang="en">
<head>
<script src="/html/war-rooms/_relay_control_plane/relay.core.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSM · Concierge Transport War Room</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a0f;--bg2:#0a1020;--bg3:#0d1528;
  --cyan:#00d4d4;--amber:#f5a623;--green:#22c55e;
  --red:#ef4444;--purple:#a855f7;--blue:#3b82f6;
  --gold:#c9a84c;--text:#e2e8f0;--muted:#64748b;--border:#1e293b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:40px;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;z-index:9999;}

/* ── TOP BAR ── */
.topbar{height:44px;background:#020810;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:16px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.72rem;color:var(--cyan);letter-spacing:.18em;display:flex;align-items:center;gap:8px;}
.tb-brand-pulse{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:pulse 1.2s infinite;}
.tb-stat{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);}
.tb-stat span{color:var(--green);}
.topbar-right{display:flex;align-items:center;gap:16px;}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.78rem;color:var(--amber);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ── CHAIN NAV ── */
.chain-nav{height:38px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:0;}
.chain-step{display:flex;align-items:center;gap:0;}
.chain-node{font-family:'Orbitron',sans-serif;font-size:.58rem;padding:6px 16px;letter-spacing:.08em;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap;}
.chain-node:hover{color:var(--text);}
.chain-node.active{color:var(--cyan);border-bottom-color:var(--cyan);}
.chain-arrow{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--border);padding:0 2px;}
.chain-right{margin-left:auto;display:flex;gap:8px;}
.chain-btn{padding:5px 14px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Orbitron',sans-serif;font-size:.58rem;cursor:pointer;letter-spacing:.06em;transition:.2s;}
.chain-btn:hover{border-color:var(--amber);color:var(--amber);}
.chain-btn.primary{border-color:rgba(0,212,212,.4);color:var(--cyan);}
.chain-btn.primary:hover{background:var(--cyan);color:#001;}

.wrap{padding:20px;max-width:1400px;margin:0 auto;}
.panel-title{font-family:'Orbitron',sans-serif;font-size:.62rem;color:var(--muted);letter-spacing:.1em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.panel-title .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);}

.grid2{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start;}
@media (max-width:900px){.grid2{grid-template-columns:1fr;}}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}

/* FORM */
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.form-row label{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);letter-spacing:.05em;}
.form-row input,.form-row select{background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:8px 10px;font-family:'Rajdhani',sans-serif;font-size:.85rem;}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--cyan);}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{width:100%;padding:10px;border-radius:4px;border:1px solid var(--cyan);background:rgba(0,212,212,.08);color:var(--cyan);font-family:'Orbitron',sans-serif;font-size:.62rem;letter-spacing:.08em;cursor:pointer;transition:.2s;margin-top:6px;}
.btn:hover{background:var(--cyan);color:#001;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-sm{padding:6px 10px;font-size:.55rem;width:auto;margin-top:0;}
.btn-red{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.08);}
.btn-red:hover{background:var(--red);color:#fff;}
.btn-amber{border-color:var(--amber);color:var(--amber);background:rgba(245,166,35,.08);}
.btn-amber:hover{background:var(--amber);color:#001;}

.err-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:4px;padding:10px 12px;color:var(--red);font-family:'JetBrains Mono',monospace;font-size:.7rem;margin-bottom:12px;display:none;}

/* QUOTES */
.quote-card{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.quote-veh{font-family:'Orbitron',sans-serif;font-size:.72rem;color:var(--text);}
.quote-sub{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);margin-top:4px;}
.quote-price{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:900;color:var(--green);white-space:nowrap;}

/* MISSIONS */
.mission-card{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:5px;padding:14px;margin-bottom:10px;}
.mission-card.status-completed{border-left-color:var(--green);}
.mission-card.status-cancelled,.mission-card.status-cancelled_by_driver{border-left-color:var(--red);opacity:.7;}
.mission-card.status-en_route,.mission-card.status-driver_assigned,.mission-card.status-arrived,.mission-card.status-picked_up{border-left-color:var(--amber);}
.mission-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.mission-id{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);}
.mission-guest{font-family:'Rajdhani',sans-serif;font-size:.9rem;font-weight:700;color:#fff;margin-top:2px;}
.mission-status-badge{font-family:'Orbitron',sans-serif;font-size:.52rem;padding:3px 9px;border-radius:2px;letter-spacing:.06em;white-space:nowrap;}
.sb-confirmed{background:rgba(59,130,246,.15);border:1px solid var(--blue);color:var(--blue);}
.sb-driver_assigned,.sb-en_route,.sb-arrived,.sb-picked_up{background:rgba(245,166,35,.15);border:1px solid var(--amber);color:var(--amber);}
.sb-completed{background:rgba(34,197,94,.15);border:1px solid var(--green);color:var(--green);}
.sb-cancelled,.sb-cancelled_by_driver{background:rgba(239,68,68,.15);border:1px solid var(--red);color:var(--red);}
.mission-meta{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);margin-top:8px;line-height:1.6;}
.mission-meta b{color:#bbb;}
.mission-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.empty-state{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);text-align:center;padding:30px 10px;}
.loading-txt{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filter-chip{font-family:'Orbitron',sans-serif;font-size:.55rem;padding:5px 12px;border-radius:12px;border:1px solid var(--border);color:var(--muted);cursor:pointer;letter-spacing:.05em;transition:.2s;}
.filter-chip:hover{border-color:var(--cyan);color:var(--cyan);}
.filter-chip.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,212,.08);}
</style>
  <link rel="stylesheet" href="/shared/tsm-guided-how-to.css">
</head>
<body>
<section
  id="tsm-guided-how-to-root"
  data-tsm-guided-how-to="true"
  aria-label="TSM Guided How-To"
></section>


<div class="topbar">
  <div class="topbar-left">
    <div class="tb-brand"><div class="tb-brand-pulse"></div>◈ CONCIERGE TRANSPORT WAR ROOM</div>
    <div class="tb-stat">OPEN MISSIONS: <span id="tbOpenCount">—</span></div>
    <div class="tb-stat">PROVIDER: <span id="tbProvider">mock-transport</span></div>
  </div>
  <div class="topbar-right">
    <div class="tb-time" id="tbTime">--:--:--</div>
  </div>
</div>

<div class="chain-nav">
  <div class="chain-step">
    <div class="chain-node active">01 · REQUEST &amp; DISPATCH</div>
    <div class="chain-arrow">→</div>
    <div class="chain-node" onclick="nav('/html/concierge/concierge-strategist.html')">02 · STRATEGIST</div>
    <div class="chain-arrow">→</div>
    <div class="chain-node" onclick="nav('/html/concierge/concierge-executive-portal.html')">03 · EXEC PORTAL</div>
  </div>
  <div class="chain-right">
    <button class="chain-btn" onclick="nav('/html/tsm-platform-hub.html')">← PLATFORM HUB</button>
    <button class="chain-btn primary" onclick="loadMissions()">↻ REFRESH MISSIONS</button>
  </div>
</div>

<div class="wrap">
  <div class="grid2">

    <!-- ── LEFT: QUOTE REQUEST FORM ── -->
    <div>
      <div class="card">
        <div class="panel-title"><div class="dot"></div>REQUEST A QUOTE</div>
        <div id="quoteErr" class="err-box"></div>
        <form id="quoteForm" onsubmit="return submitQuote(event)">
          <div class="form-row">
            <label>SERVICE TYPE</label>
            <select id="qService">
              <option value="airport_transfer">Airport Transfer</option>
              <option value="point_to_point">Point to Point</option>
              <option value="hourly">Hourly</option>
            </select>
          </div>
          <div class="form-row">
            <label>PICKUP ADDRESS</label>
            <input id="qPickup" type="text" placeholder="123 Main St, Phoenix, AZ" required>
          </div>
          <div class="form-row">
            <label>DESTINATION</label>
            <input id="qDest" type="text" placeholder="Sky Harbor Intl (PHX)" required>
          </div>
          <div class="form-2col">
            <div class="form-row">
              <label>DATE</label>
              <input id="qDate" type="date" required>
            </div>
            <div class="form-row">
              <label>TIME</label>
              <input id="qTime" type="time" required>
            </div>
          </div>
          <div class="form-2col">
            <div class="form-row">
              <label>PASSENGERS</label>
              <input id="qPax" type="number" min="1" max="14" value="2" required>
            </div>
            <div class="form-row">
              <label>BAGS</label>
              <input id="qBags" type="number" min="0" max="20" value="2">
            </div>
          </div>
          <div class="form-row">
            <label>VEHICLE (optional — leave blank to quote all classes)</label>
            <select id="qVehicle">
              <option value="">— Any / quote all —</option>
              <option value="standard">Standard sedan</option>
              <option value="suv">SUV</option>
              <option value="black_car">Black car</option>
              <option value="van">Passenger van</option>
            </select>
          </div>
          <button class="btn" type="submit" id="quoteBtn">GET QUOTES →</button>
        </form>
      </div>

      <div class="card" id="guestCard" style="display:none;">
        <div class="panel-title"><div class="dot" style="background:var(--amber)"></div>GUEST / PROPERTY DETAILS</div>
        <div class="form-row">
          <label>GUEST NAME</label>
          <input id="bGuest" type="text" placeholder="Guest name">
        </div>
        <div class="form-row">
          <label>PROPERTY / CLIENT ID</label>
          <input id="bProperty" type="text" placeholder="e.g. PROP-104">
        </div>
        <div class="form-row">
          <label>VERTICAL</label>
          <select id="bVertical">
            <option value="hotelops">HotelOps</option>
            <option value="bpo">BPO</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-row">
          <label>NOTES</label>
          <input id="bNotes" type="text" placeholder="Flight number, special requests, etc.">
        </div>
      </div>
    </div>

    <!-- ── RIGHT: QUOTES + MISSIONS ── -->
    <div>
      <div class="card" id="quotesCard" style="display:none;">
        <div class="panel-title"><div class="dot"></div>AVAILABLE QUOTES</div>
        <div id="quotesList"></div>
      </div>

      <div class="card">
        <div class="panel-title"><div class="dot" style="background:var(--green)"></div>ACTIVE &amp; RECENT MISSIONS</div>
        <div class="filter-bar" id="filterBar">
          <div class="filter-chip active" data-status="" onclick="setFilter('')">ALL</div>
          <div class="filter-chip" data-status="confirmed" onclick="setFilter('confirmed')">CONFIRMED</div>
          <div class="filter-chip" data-status="en_route" onclick="setFilter('en_route')">EN ROUTE</div>
          <div class="filter-chip" data-status="completed" onclick="setFilter('completed')">COMPLETED</div>
          <div class="filter-chip" data-status="cancelled" onclick="setFilter('cancelled')">CANCELLED</div>
        </div>
        <div id="missionsList"><div class="loading-txt">Loading missions…</div></div>
      </div>
    </div>

  </div>
</div>

<script>
const API_BASE = '';
let lastQuotes = [];
let missionFilter = '';

function nav(url){ window.location.href = url; }

function fetchClock(){
  const el = document.getElementById('tbTime');
  function tick(){ el.textContent = new Date().toLocaleTimeString(); }
  tick(); setInterval(tick, 1000);
}
fetchClock();

// Prefill date/time to something sensible (tomorrow, 09:00)
(function prefill(){
  const d = new Date(Date.now() + 24*3600*1000);
  document.getElementById('qDate').value = d.toISOString().slice(0,10);
  document.getElementById('qTime').value = '09:00';
})();

async function apiCall(path, opts){
  opts = opts || {};
  opts.credentials = 'same-origin';
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  const res = await fetch(API_BASE + path, opts);
  let body = null;
  try { body = await res.json(); } catch(e) {}
  if (!res.ok || !body || body.ok === false) {
    const msg = (body && body.error) ? body.error : ('Request failed (' + res.status + ')');
    throw new Error(msg);
  }
  return body;
}

function showErr(elId, msg){
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function submitQuote(ev){
  ev.preventDefault();
  showErr('quoteErr', '');
  const btn = document.getElementById('quoteBtn');
  btn.disabled = true; btn.textContent = 'REQUESTING…';

  const request = {
    service: document.getElementById('qService').value,
    pickup: { address: document.getElementById('qPickup').value },
    destination: { address: document.getElementById('qDest').value },
    date: document.getElementById('qDate').value,
    time: document.getElementById('qTime').value,
    passengers: parseInt(document.getElementById('qPax').value, 10) || 1,
    bags: parseInt(document.getElementById('qBags').value, 10) || 0,
  };
  const vehicle = document.getElementById('qVehicle').value;
  if (vehicle) request.vehicle = vehicle;

  try {
    const data = await apiCall('/api/concierge/quotes', { method: 'POST', body: JSON.stringify(request) });
    lastQuotes = data.quotes || [];
    renderQuotes(data.quotes || [], data.errors || []);
    document.getElementById('guestCard').style.display = 'block';
    document.getElementById('quotesCard').style.display = lastQuotes.length ? 'block' : 'block';

    // Fire the war-room relay so Strategist/Exec can see quote activity.
    try {
      TSM.relay.write('CONCIERGE', {
        stage: 'quote_requested',
        request,
        quoteCount: lastQuotes.length,
      }, { stage: 'concierge-war-room' });
    } catch(e) { console.warn('relay write failed (non-fatal):', e.message); }

  } catch(e) {
    showErr('quoteErr', e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'GET QUOTES →';
  }
}

function renderQuotes(quotes, errors){
  const wrap = document.getElementById('quotesList');
  document.getElementById('quotesCard').style.display = 'block';
  if (!quotes.length) {
    wrap.innerHTML = '<div class="empty-state">No quotes available for this request.'
      + (errors && errors.length ? '<br>' + errors.map(e => (e.provider||'') + ': ' + (e.error||e)).join('<br>') : '')
      + '</div>';
    return;
  }
  wrap.innerHTML = quotes.map(q => `
    <div class="quote-card">
      <div>
        <div class="quote-veh">${q.vehicleLabel || q.vehicle}</div>
        <div class="quote-sub">${q.provider} · pickup in ~${q.etaPickupMinutes}m · trip ~${q.etaTripMinutes}m</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="quote-price">$${q.priceEstimate.amount.toFixed(2)}</div>
        <button class="btn btn-sm" onclick="bookQuote('${q.quoteId}')">BOOK →</button>
      </div>
    </div>
  `).join('');
}

async function bookQuote(quoteId){
  showErr('quoteErr', '');
  try {
    const body = {
      quoteId,
      guestName: document.getElementById('bGuest').value || undefined,
      propertyId: document.getElementById('bProperty').value || undefined,
      vertical: document.getElementById('bVertical').value,
      notes: document.getElementById('bNotes').value || undefined,
    };
    const data = await apiCall('/api/concierge/bookings', { method: 'POST', body: JSON.stringify(body) });

    try {
      TSM.relay.write('CONCIERGE', {
        stage: 'booking_confirmed',
        bookingId: data.booking.bookingId,
        guestName: body.guestName,
        propertyId: body.propertyId,
        status: data.booking.status,
      }, { caseId: data.booking.bookingId, stage: 'concierge-war-room' });
    } catch(e) { console.warn('relay write failed (non-fatal):', e.message); }

    document.getElementById('quotesCard').style.display = 'none';
    document.getElementById('quoteForm').reset();
    (function prefillAgain(){
      const d = new Date(Date.now() + 24*3600*1000);
      document.getElementById('qDate').value = d.toISOString().slice(0,10);
      document.getElementById('qTime').value = '09:00';
    })();
    await loadMissions();
  } catch(e) {
    showErr('quoteErr', e.message);
  }
}

function setFilter(status){
  missionFilter = status;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.status === status));
  loadMissions();
}

async function loadMissions(){
  const wrap = document.getElementById('missionsList');
  try {
    const q = missionFilter ? ('?status=' + encodeURIComponent(missionFilter)) : '';
    const data = await apiCall('/api/concierge/missions' + q);
    renderMissions(data.missions || []);
    const openCount = (data.missions || []).filter(m => !['completed','cancelled','cancelled_by_driver'].includes(m.status)).length;
    document.getElementById('tbOpenCount').textContent = openCount;
  } catch(e) {
    wrap.innerHTML = '<div class="empty-state">Could not load missions: ' + e.message + '</div>';
  }
}

function renderMissions(missions){
  const wrap = document.getElementById('missionsList');
  if (!missions.length) {
    wrap.innerHTML = '<div class="empty-state">No missions yet — book a quote above to create one.</div>';
    return;
  }
  const NEXT_EVENT = {
    confirmed: 'driver_assigned', driver_assigned: 'en_route', en_route: 'arrived',
    arrived: 'picked_up', picked_up: 'completed',
  };
  wrap.innerHTML = missions.map(m => {
    const canCancel = !['completed','cancelled','cancelled_by_driver'].includes(m.status);
    const next = NEXT_EVENT[m.status];
    return `
    <div class="mission-card status-${m.status}">
      <div class="mission-top">
        <div>
          <div class="mission-id">#${m.bookingId}</div>
          <div class="mission-guest">${m.guestName || 'Unnamed guest'}${m.propertyId ? ' · ' + m.propertyId : ''}</div>
        </div>
        <div class="mission-status-badge sb-${m.status}">${m.status.replace(/_/g,' ').toUpperCase()}</div>
      </div>
      <div class="mission-meta">
        <b>Provider:</b> ${m.provider || '—'} &nbsp;|&nbsp; <b>Confirmation:</b> ${m.confirmationCode || '—'}${m.priceEstimate ? ' &nbsp;|&nbsp; <b>Price:</b> $' + m.priceEstimate.amount.toFixed(2) : ''}<br>
        ${m.driver ? `<b>Driver:</b> ${m.driver.name} · ${m.driver.vehicle} · ${m.driver.plate}` : '<b>Driver:</b> not yet assigned'}
      </div>
      <div class="mission-actions">
        <button class="btn btn-sm" onclick="refreshMission('${m.bookingId}')">↻ REFRESH</button>
        ${next ? `<button class="btn btn-sm btn-amber" onclick="simulateEvent('${m.bookingId}','${next}')">SIMULATE → ${next.replace(/_/g,' ').toUpperCase()}</button>` : ''}
        ${canCancel ? `<button class="btn btn-sm btn-red" onclick="cancelMission('${m.bookingId}')">CANCEL</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

async function refreshMission(bookingId){
  try {
    await apiCall('/api/concierge/missions/' + encodeURIComponent(bookingId) + '/refresh');
    await loadMissions();
  } catch(e) { alert('Refresh failed: ' + e.message); }
}

async function simulateEvent(bookingId, status){
  try {
    await apiCall('/api/concierge/missions/' + encodeURIComponent(bookingId) + '/simulate-event', {
      method: 'POST', body: JSON.stringify({ status, note: 'simulated from war room' })
    });
    try {
      TSM.relay.write('CONCIERGE', { stage: 'status_update', bookingId, status }, { caseId: bookingId, stage: 'concierge-war-room' });
    } catch(e) {}
    await loadMissions();
  } catch(e) { alert('Simulate failed: ' + e.message); }
}

async function cancelMission(bookingId){
  if (!confirm('Cancel mission ' + bookingId + '?')) return;
  try {
    await apiCall('/api/concierge/missions/' + encodeURIComponent(bookingId) + '/cancel', { method: 'POST' });
    try {
      TSM.relay.write('CONCIERGE', { stage: 'mission_cancelled', bookingId }, { caseId: bookingId, stage: 'concierge-war-room' });
    } catch(e) {}
    await loadMissions();
  } catch(e) { alert('Cancel failed: ' + e.message); }
}

loadMissions();
setInterval(loadMissions, 20000);
