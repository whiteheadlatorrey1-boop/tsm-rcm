<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSHA 30 Exam Simulator · TSM Academy</title>
<style>
:root{
  --bg:#05080b;--surface:#080f16;--s2:#060d13;--border:rgba(0,210,255,.13);
  --text:#d8f0ff;--muted:#6a8a9e;
  --cyan:#00d4ff;--amber:#ffb300;--orange:#ff6a00;--purple:#a855f7;
  --green:#00ffc6;--red:#ff4060;--white:#ffffff;
  --mono:'JetBrains Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,Arial;font-size:13px;padding-bottom:60px}
.topbar{position:sticky;top:0;z-index:100;background:var(--s2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:950;color:var(--cyan);letter-spacing:.16em;font-size:11px;white-space:nowrap;font-family:var(--mono)}
.topbar-links{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;align-items:center}
.topbar-links a{color:var(--muted);text-decoration:none;font-size:10px;font-family:var(--mono);padding:5px 10px;border:1px solid transparent;border-radius:3px;letter-spacing:.08em;transition:all .2s}
.topbar-links a:hover{color:var(--cyan);border-color:var(--cyan)}
.timer{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--amber);padding:4px 12px;border:1px solid var(--amber);border-radius:4px}
.timer.low{color:var(--red);border-color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.wrap{max-width:820px;margin:0 auto;padding:24px 20px}
.hero-badge{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--cyan);margin-bottom:8px}
h1{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px}
.sub{color:var(--muted);font-size:12px;margin-bottom:20px;line-height:1.6}
.progress-bar{height:4px;background:var(--surface);border-radius:2px;overflow:hidden;margin-bottom:24px}
.progress-fill{height:100%;background:var(--cyan);transition:width .3s}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:22px}
.q-domain{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--amber);margin-bottom:10px}
.q-num{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:14px}
.q-text{font-size:15px;font-weight:700;color:#fff;margin-bottom:18px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;background:var(--s2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:6px;margin-bottom:8px;cursor:pointer;font-size:13px;transition:all .15s;font-family:inherit}
.opt:hover{border-color:var(--cyan)}
.opt.selected{border-color:var(--cyan);background:rgba(0,212,255,.08)}
.opt.correct{border-color:var(--green);background:rgba(0,255,198,.1)}
.opt.wrong{border-color:var(--red);background:rgba(255,64,96,.1)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:6px;font-size:12px;line-height:1.6;display:none}
.feedback.show{display:block}
.feedback.right{background:rgba(0,255,198,.08);border:1px solid var(--green);color:var(--green)}
.feedback.wrong{background:rgba(255,64,96,.08);border:1px solid var(--red);color:#ffb0bc}
.nav-row{display:flex;justify-content:flex-end;margin-top:20px}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;font-weight:700;padding:10px 22px;border-radius:6px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);cursor:pointer;transition:all .2s}
.btn:hover{background:var(--cyan);color:#000}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--cyan)}
.results{display:none;text-align:center;padding:40px 20px}
.results.show{display:block}
.score-ring{font-family:var(--mono);font-size:56px;font-weight:900;margin-bottom:6px}
.score-ring.pass{color:var(--green)}
.score-ring.fail{color:var(--red)}
.pass-label{font-family:var(--mono);font-size:12px;letter-spacing:.2em;margin-bottom:26px}
.domain-breakdown{text-align:left;max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px}
.db-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.db-row:last-child{border-bottom:none}
.db-bar{width:100px;height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.db-fill{height:100%;background:var(--cyan)}
.db-fill.weak{background:var(--amber)}
.retry-row{margin-top:26px;display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">TSM ACADEMY</div>
  <div id="timerDisplay" class="timer">30:00</div>
  <div class="topbar-links">
    <a href="/html/tsm-career-training-platform.html">← CAREER PLATFORM</a>
    <a href="/html/construction-suite/compliance.html">COMPLIANCE HUB</a>
    <a href="/html/construction-suite/construction-scenarios.html">SCENARIOS</a>
  </div>
</div>

<div class="wrap">
  <div class="hero-badge">OSHA 30 · CONSTRUCTION SAFETY CERTIFICATION</div>
  <h1>Timed Exam Simulator</h1>
  <p class="sub">20 questions across all 6 safety domains, 30-minute timer, 70% to pass — same shape as the real OSHA outreach exam structure.</p>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="q-card" id="quizCard"></div>

  <div class="results" id="results">
    <div class="score-ring" id="scoreRing">--%</div>
    <div class="pass-label" id="passLabel">—</div>
    <div class="domain-breakdown" id="breakdown"></div>
    <div class="retry-row">
      <button class="btn" onclick="location.reload()">RETAKE EXAM</button>
      <a class="btn" href="/html/construction-suite/construction-scenarios.html" style="text-decoration:none;display:inline-flex;align-items:center">RUN SCENARIOS →</a>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {domain:'Intro & Recordkeeping', q:"Under OSHA's General Duty Clause, an employer must:", opts:['Provide a workplace free from recognized hazards','File OSHA 300 logs weekly','Only respond to worker complaints','Report incidents once a year'], correct:0},
  {domain:'Intro & Recordkeeping', q:'Which form is used to summarize the OSHA 300 log annually?', opts:['OSHA 301','OSHA 300A','OSHA 174','OSHA 200'], correct:1},
  {domain:'Intro & Recordkeeping', q:'A worker who reports a safety violation is protected from retaliation under:', opts:['HIPAA','Whistleblower protection provisions','FMLA','ADA'], correct:1},
  {domain:'Fall Protection', q:'Fall protection is generally required in construction once a worker is exposed to a fall of:', opts:['4 feet or more','6 feet or more','10 feet or more','15 feet or more'], correct:1},
  {domain:'Fall Protection', q:'Which is NOT an acceptable fall-protection system on its own?', opts:['Guardrail system','Safety net system','Verbal warning from a coworker','Personal fall arrest system (PFAS)'], correct:2},
  {domain:'Fall Protection', q:'A scaffold platform must be fully planked/decked and have guardrails when workers are how high above a lower level?', opts:['4 ft','6 ft','10 ft','12 ft'], correct:1},
  {domain:'Electrical Safety', q:'Lockout/tagout (LOTO) procedures exist primarily to:', opts:['Track tool inventory','Prevent unexpected energization during service/maintenance','Speed up job completion','Reduce paperwork'], correct:1},
  {domain:'Electrical Safety', q:'GFCI protection on construction sites is primarily intended to prevent:', opts:['Overheating of extension cords','Electric shock from ground faults','Voltage drops','Circuit overload only'], correct:1},
  {domain:'Electrical Safety', q:'Minimum clearance distances from overhead power lines are governed by:', opts:['Line voltage','Weather conditions only','Crew size','Time of day'], correct:0},
  {domain:'PPE & Hazard Comm', q:'Under the Hazard Communication Standard, an SDS provides:', opts:['Site security procedures','Chemical hazard and safe-handling information','Payroll classification codes','Equipment maintenance schedules'], correct:1},
  {domain:'PPE & Hazard Comm', q:'Respiratory protection is required when a hazard cannot be controlled by:', opts:['Engineering and administrative controls','Overtime scheduling','Verbal instruction alone','Insurance waivers'], correct:0},
  {domain:'PPE & Hazard Comm', q:'GHS pictograms on chemical labels primarily communicate:', opts:['Manufacturer branding','Hazard classification','Price per unit','Storage location'], correct:1},
  {domain:'Excavation & Trenching', q:'A "competent person" on an excavation site is responsible for:', opts:['Payroll only','Identifying hazards and having authority to correct them','Scheduling deliveries','Marketing the project'], correct:1},
  {domain:'Excavation & Trenching', q:'Protective systems (shoring, shielding, sloping) are generally required for trenches deeper than:', opts:['2 feet','5 feet','8 feet','12 feet'], correct:1},
  {domain:'Excavation & Trenching', q:'Atmospheric testing in a trench/excavation is required when the depth exceeds:', opts:['2 feet','4 feet','6 feet','It is never required'], correct:1},
  {domain:'Materials & Rigging', q:'Before use, rigging equipment must be inspected for:', opts:['Color only','Damage and load-limit compliance','Brand consistency','Age only, regardless of condition'], correct:1},
  {domain:'Materials & Rigging', q:'A designated signal person is required when a crane operator\u2019s view of the load is:', opts:['Always, regardless of visibility','Obstructed','Never required if the operator has a mirror','Only on rainy days'], correct:1},
  {domain:'Materials & Rigging', q:'Materials stored in tiers must be stacked, blocked, and limited in height to prevent:', opts:['Aesthetic issues','Sliding, falling, or collapse','Faster loading only','Insurance premium increases'], correct:1},
  {domain:'Materials & Rigging', q:'Powered industrial trucks (forklifts) require operators to be:', opts:['At least 16 years old with no training','Trained and evaluated/certified','Supervised at all times with no certification','Certified only if lifting over 5,000 lbs'], correct:1},
  {domain:'Intro & Recordkeeping', q:'An OSHA inspection may be triggered by:', opts:['A worker complaint','An imminent danger report','A referral, fatality, or catastrophe','All of the above'], correct:3},
];

let current = 0, answers = new Array(QUESTIONS.length).fill(null), locked = false;
let timeLeft = 30 * 60;

function renderQuestion(){
  const q = QUESTIONS[current];
  const card = document.getElementById('quizCard');
  locked = answers[current] !== null;
  card.innerHTML = `
    <div class="q-domain">${q.domain.toUpperCase()}</div>
    <div class="q-num">Question ${current+1} of ${QUESTIONS.length}</div>
    <div class="q-text">${q.q}</div>
    ${q.opts.map((o,i)=>`<button class="opt${answers[current]===i?' selected':''}" onclick="selectAnswer(${i})" ${locked?'disabled':''}>${o}</button>`).join('')}
    <div class="feedback ${locked ? (answers[current]===q.correct?'right show':'wrong show') : ''}" id="feedback">
      ${locked ? (answers[current]===q.correct ? '✓ Correct.' : `✗ Incorrect. Correct answer: ${q.opts[q.correct]}`) : ''}
    </div>
    <div class="nav-row">
      <button class="btn" onclick="nextQuestion()" ${!locked?'disabled':''}>${current === QUESTIONS.length-1 ? 'FINISH EXAM' : 'NEXT →'}</button>
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100) + '%';
}

function selectAnswer(i){
  if (answers[current] !== null) return;
  answers[current] = i;
  renderQuestion();
}

function nextQuestion(){
  if (current < QUESTIONS.length - 1){ current++; renderQuestion(); }
  else finishExam();
}

function finishExam(){
  clearInterval(timerInterval);
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';

  const domainStats = {};
  QUESTIONS.forEach((q,i)=>{
    domainStats[q.domain] = domainStats[q.domain] || {correct:0,total:0};
    domainStats[q.domain].total++;
    if (answers[i] === q.correct) domainStats[q.domain].correct++;
  });
  const totalCorrect = answers.filter((a,i)=>a===QUESTIONS[i].correct).length;
  const pct = Math.round(totalCorrect / QUESTIONS.length * 100);
  const pass = pct >= 70;

  const ring = document.getElementById('scoreRing');
  ring.textContent = pct + '%';
  ring.className = 'score-ring ' + (pass ? 'pass' : 'fail');
  document.getElementById('passLabel').textContent = pass ? 'PASS — READY FOR OSHA 30 SCHEDULING' : 'NOT YET — REVIEW WEAK DOMAINS BELOW';
  document.getElementById('passLabel').style.color = pass ? 'var(--green)' : 'var(--red)';

  const bd = document.getElementById('breakdown');
  bd.innerHTML = Object.entries(domainStats).map(([d,s])=>{
    const dp = Math.round(s.correct/s.total*100);
    return `<div class="db-row"><span>${d}</span><div style="display:flex;align-items:center;gap:8px"><div class="db-bar"><div class="db-fill${dp<70?' weak':''}" style="width:${dp}%"></div></div><span style="font-family:var(--mono);width:32px;text-align:right">${dp}%</span></div></div>`;
  }).join('');

  document.getElementById('results').classList.add('show');

  try {
    localStorage.setItem('tsm_osha_exam_last_score', JSON.stringify({pct, pass, at: new Date().toISOString()}));
  } catch(e) {}
}

const timerInterval = setInterval(()=>{
  timeLeft--;
  const m = Math.floor(timeLeft/60), s = timeLeft%60;
  const disp = document.getElementById('timerDisplay');
  disp.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  if (timeLeft <= 60) disp.classList.add('low');
  if (timeLeft <= 0) finishExam();
}, 1000);

renderQuestion();
</script>
</body>
</html>
