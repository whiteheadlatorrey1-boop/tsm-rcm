<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TSM · FinOps Launcher</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');
:root {
  --bg:#060a0f;--surface:#0d1520;--border:rgba(255,255,255,0.07);
  --border-hover:rgba(255,255,255,0.15);--text:#e8edf5;--muted:#5a6a80;
  --accent:#f59e0b;--accent-dim:rgba(245,158,11,0.12);
  --amber:#f59e0b;--info:#3b82f6;--risk:#ef4444;--cyan:#00d4ff;--gold:#eab308;--good:#22c55e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:2rem}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(245,158,11,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.wordmark{font-size:13px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:.12em}
.wordmark span{color:var(--accent)}
h1{font-size:clamp(28px,5vw,48px);font-weight:800;line-height:1;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
.clock{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
.suite-label{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.suite-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--accent)}
.suite-name{font-size:11px;font-family:'DM Mono',monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);opacity:.7}
.suite-line{flex:1;height:1px;background:var(--border)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:2.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;cursor:pointer;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,background .15s,transform .1s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .15s;background:var(--card-color,var(--accent))}
.card:hover{border-color:var(--border-hover);background:rgba(245,158,11,0.06);transform:translateY(-1px)}
.card:hover::before{opacity:1}
.card:active{transform:translateY(0)}
.card.tsm-launching{animation:tsm-flash .35s ease}
@keyframes tsm-flash{0%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 0 8px rgba(245,158,11,.1)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.card-type{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--card-color,var(--accent))}
.card-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.card-desc{font-size:12px;color:var(--muted);line-height:1.5;flex:1}
.card-arrow{font-size:16px;color:var(--muted);align-self:flex-end;transition:color .15s,transform .15s}
.card:hover .card-arrow{transform:translate(2px,-2px)}
footer{margin-top:1rem;padding-top:1.5rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
footer span{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:6px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#tsm-log{position:fixed;bottom:0;left:0;right:0;background:rgba(6,10,15,.96);border-top:1px solid rgba(245,158,11,.2);font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);padding:6px 16px;height:28px;overflow:hidden;z-index:9999;opacity:0;transition:opacity .5s}
#tsm-log.visible{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header>
<div>
<div class="wordmark">⚜ <span>TSM</span> · FinOps Suite</div>
<h1 style="margin-top:8px;">FinOps <em>Launcher</em></h1>
</div>
<div class="clock" id="clk"></div>
</header>

<div class="suite-label"><div class="suite-dot"></div><span class="suite-name">FinOps Modules</span><div class="suite-line"></div></div>
<div class="cards" id="module-cards"></div>

<footer>
<span><span class="status-dot"></span>TSM Neural Core · Online</span>
<span id="ft-date"></span>
</footer>
</div>
<div id="tsm-log"></div>
<script>
const MODULES = [
  {name:"Branch Operations", file:"finops-operations.html", cat:"Operations", color:"var(--amber)"},
  {name:"Accounting Ledger", file:"finops-accounting.html", cat:"Accounting", color:"var(--info)"},
  {name:"Compliance Desk", file:"compliance.html", cat:"Compliance", color:"var(--risk)"},
  {name:"Scenario Modeling", file:"finops-scenarios.html", cat:"Forecasting", color:"var(--cyan)"},
  {name:"Financial Intelligence", file:"finance-index.html", cat:"Accounts / Audit", color:"var(--gold)"},
  {name:"Vendor Situation Room", file:"../supplier-vendor/supplier-vendor-situation-room.html", cat:"Vendor / AP", color:"var(--gold)"},
  {name:"Logistics Situation Room", file:"../logistics/logistics-situation-room.html", cat:"Logistics", color:"var(--good)"},
  {name:"Document Search", file:"../html/finops-suite/finops-showcase-v1.html", cat:"Search / Evidence", color:"var(--muted)"}
];

const container = document.getElementById('module-cards');
MODULES.forEach((m, i) => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = m.file;
  a.target = '_blank';
  a.style.setProperty('--card-color', m.color);
  a.dataset.tsmAction = 'finops.' + m.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  a.innerHTML = `
    <div class="card-type">${m.cat}</div>
    <div class="card-title">${m.name}</div>
    <div class="card-desc">${m.file}</div>
    <div class="card-arrow">↗</div>
  `;
  container.appendChild(a);
});

const logEl = document.getElementById('tsm-log');
let logTimer = null;
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-tsm-action]');
  if(!el) return;
  el.classList.add('tsm-launching');
  setTimeout(() => el.classList.remove('tsm-launching'), 400);
  const label = el.querySelector('.card-title')?.textContent || el.dataset.tsmAction;
  logEl.textContent = '▶ [FINOPS] ' + label + '  ·  ' + new Date().toISOString().slice(11,19);
  logEl.classList.add('visible');
  clearTimeout(logTimer);
  logTimer = setTimeout(() => logEl.classList.remove('visible'), 2500);
}, true);

function tick(){
  const now = new Date();
  document.getElementById('clk').textContent = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('ft-date').textContent = now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
