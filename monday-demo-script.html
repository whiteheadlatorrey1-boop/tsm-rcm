<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monday Run-of-Show — HonorHealth / Dee Montee</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c12; --panel:#12141d; --panel2:#171a26; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#e9ecf5; --muted:#8890a8; --dim:#565f78;
  --cue:#00d9c0; --wow:#ffb238; --say:#f3c9a3; --warn:#ff5d6c;
  --mono:'JetBrains Mono',monospace; --serif:'Fraunces',serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;min-height:100vh;}
.shell{display:grid;grid-template-columns:270px 1fr;min-height:100vh;}

/* left rail — run sheet */
.rail{background:var(--panel);border-right:1px solid var(--line);padding:22px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.rail-head{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:6px;}
.rail-head .k{color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
.rail-head .v{color:var(--text);font-size:15px;font-weight:600;margin-top:4px;font-family:var(--serif);}
.cue{display:flex;align-items:center;gap:12px;padding:13px 20px;cursor:pointer;border-left:2px solid transparent;color:var(--muted);transition:.15s;}
.cue:hover{background:rgba(255,255,255,.03);}
.cue.active{background:var(--panel2);border-left-color:var(--cue);color:var(--text);}
.cue .num{font-size:10px;color:var(--dim);min-width:18px;}
.cue.active .num{color:var(--cue);}
.cue .t{font-size:12px;line-height:1.4;}
.cue .wow-dot{width:5px;height:5px;border-radius:50%;background:var(--wow);margin-left:auto;flex-shrink:0;box-shadow:0 0 6px var(--wow);}

/* main stage */
.stage{padding:44px 56px 80px;max-width:760px;}
.step-eyebrow{display:flex;align-items:center;gap:10px;color:var(--cue);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;}
.step-eyebrow .n{color:var(--dim);}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.2;margin-bottom:22px;color:var(--text);}

.wow-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,178,56,.1);border:1px solid rgba(255,178,56,.3);color:var(--wow);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:20px;margin-bottom:20px;}

.click-block{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:18px 20px;margin-bottom:22px;}
.click-block .lbl{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.click-block .action{font-size:13.5px;color:var(--text);line-height:1.6;}
.gourl{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:var(--cue);color:#04201c;font-weight:700;font-size:12px;padding:9px 16px;border-radius:6px;text-decoration:none;letter-spacing:.02em;}
.gourl:hover{filter:brightness(1.08);}
.gourl::after{content:'↗';}

.say-block{background:linear-gradient(135deg,rgba(255,201,163,.06),transparent 60%);border-left:3px solid var(--say);border-radius:0 8px 8px 0;padding:20px 24px;margin-bottom:22px;}
.say-block .lbl{font-size:10px;color:var(--say);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}
.say-block p{font-family:var(--serif);font-size:17px;line-height:1.65;color:var(--text);font-weight:500;font-style:italic;}
.say-block p+p{margin-top:12px;}

.caveat{background:rgba(255,93,108,.07);border:1px solid rgba(255,93,108,.28);border-radius:8px;padding:15px 18px;margin-bottom:16px;}
.caveat .lbl{color:var(--warn);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
.caveat p{font-size:12.5px;color:var(--muted);line-height:1.6;}
.caveat .say{color:var(--text);font-style:italic;}

.notes{font-size:12px;color:var(--dim);line-height:1.7;margin-top:6px;}

.navbar{display:flex;justify-content:space-between;margin-top:40px;padding-top:24px;border-top:1px solid var(--line);}
.nbtn{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line2);padding:9px 16px;border-radius:6px;cursor:pointer;}
.nbtn:hover{color:var(--text);border-color:var(--cue);}
.nbtn:disabled{opacity:.3;cursor:default;}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;}
  .rail{position:static;height:auto;}
  .stage{padding:32px 22px 60px;}
}
</style>
</head>
<body>
<div class="shell">

  <div class="rail" id="rail">
    <div class="rail-head"><div class="k">Run of Show</div><div class="v">HonorHealth · Dee Montee<br>Mon 11:30 AM</div></div>
    <!-- cues injected by JS -->
  </div>

  <div class="stage" id="stage"></div>

</div>

<script>
const STEPS = [
  {
    title: "Before You Open Anything",
    wow: false,
    click: {
      label: "Do this first",
      action: "Hand her the printed one-pager. Keep your laptop closed until you've said hello and she's settled. Don't open with the building coincidence as a line — only mention it if it comes up naturally (e.g. she asks how the meeting's going, or where you're headed after)."
    },
    say: [
      "Thanks for making time — I know Monday mornings are rough.",
      "I want to show you something live rather than talk at slides, if that's alright."
    ],
    notes: "Goal of this step: lower her guard, get permission to drive. No tech yet."
  },
  {
    title: "Load a Real Denial",
    wow: true,
    click: {
      label: "Click / do this",
      action: "Open the Denial War Room. Click the DENIAL SAMPLE button to load the claim. Don't narrate the UI — just do it while you talk.",
      url: "https://app.tsmatter.com/html/healthcare/hc-denial-war-room.html"
    },
    say: [
      "This is a real denial — Medicare, CPT 99213, denied for medical necessity and a modifier issue.",
      "I'm not going to type anything or set anything up. I'm going to hit one button and let it think."
    ],
    notes: "This step is just staging — the wow moment is next. Keep it fast."
  },
  {
    title: "Fire All 5 Engines",
    wow: true,
    click: {
      label: "Click / do this",
      action: "Click FIRE ALL 5 ENGINES. Let it run without talking over the first few seconds — the live text streaming in is the moment.",
      url: null
    },
    say: [
      "Watch this — it's reading the claim, pulling the actual denial code, and building the appeal case in real time.",
      "No template. It's reasoning through this specific denial, right now, live."
    ],
    notes: "WOW MOMENT #1. Let silence do the work while it streams. Don't fill the air."
  },
  {
    title: "Point at the Root Cause & Dollar Number",
    wow: true,
    click: {
      label: "Click / do this",
      action: "Scroll to Engine 2 (Root Cause) and Engine 3 (Financial Impact). Point at the screen, don't read it verbatim — she can read.",
      url: null
    },
    say: [
      "There's your root cause — Modifier 25 wasn't billed with separate documentation. That's the actual reason this got denied.",
      "And there's the number — $4,850 tied to this one claim. It found that itself, from the claim text."
    ],
    notes: "This is the moment she starts thinking in dollars, not features. Don't rush it."
  },
  {
    title: "Show the Appeal Starting Point",
    wow: true,
    click: {
      label: "Click / do this",
      action: "Scroll to the Appeal Letter Opening and Documentation Checklist in the Denial Pack.",
      url: null
    },
    say: [
      "It drafts the opening of the appeal and the exact documents your team needs to pull together — in under a minute.",
      "To be straight with you — it gets your team most of the way there fast. It's not writing the entire finished letter end to end yet, that's the next thing we're building. But this alone saves the blank-page problem."
    ],
    notes: "The second sentence is the honest caveat — say it plainly, don't rush past it or apologize for it."
  },
  {
    title: "Zoom Out to the Whole Portfolio",
    wow: true,
    click: {
      label: "Click / do this",
      action: "Navigate to the Main Strategist. Click RUN HC STRATEGIST ANALYSIS.",
      url: "https://app.tsmatter.com/html/healthcare/hc-main-strategist.html"
    },
    say: [
      "That was one claim. Now watch it look at the whole book of denials.",
      "It just found that your denial rate is 18.4% — above the CMS 15% threshold — and traced it to a specific pattern, not just a bad month."
    ],
    notes: "WOW MOMENT #2 — this is the exec-level moment. This is what makes her, not just her coders, care."
  },
  {
    title: "Show the Financial Command Center",
    wow: true,
    click: {
      label: "Click / do this",
      action: "Navigate to the Executive Portal. Scroll to Revenue & Performance and AR Aging.",
      url: "https://app.tsmatter.com/html/healthcare/executive-portal.html"
    },
    say: [
      "This is the view a CFO would actually want — revenue collected, days sales outstanding, AR aging by bucket, all live.",
      "If you ever want to leave a note on a decision — like 'approved, forwarded to compliance' — there's a field right here that saves it and pulls it into the exported report."
    ],
    notes: "Second sentence quietly corrects the Approve/Hold/Reject expectation from the printed snapshot — say it as a feature, not a correction."
  },
  {
    title: "The Close",
    wow: false,
    click: {
      label: "Do this",
      action: "Close the laptop. Hand her the Revenue Leak Snapshot printout if you haven't already. Make the ask directly — don't trail off.",
      url: null
    },
    say: [
      "Here's what I'd propose: a pilot, no cost, three weeks. You send de-identified denials, we run them through exactly what you just saw, and at the end you tell us if it's worth going further.",
      "No pressure to decide today — I just want your team to see it on your own claims."
    ],
    notes: "If she asks whether the $187K / 68% figures on the snapshot are real results — say clearly: 'No, that's illustrative — we haven't run a live engagement yet. You'd be the first.' Don't hedge on this one."
  },
];

let current = 0;

function renderRail() {
  const rail = document.getElementById('rail');
  rail.querySelectorAll('.cue').forEach(el => el.remove());
  STEPS.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'cue' + (i === current ? ' active' : '');
    el.onclick = () => { current = i; render(); };
    el.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span><span class="t">${s.title}</span>${s.wow ? '<span class="wow-dot"></span>' : ''}`;
    rail.appendChild(el);
  });
}

function renderStage() {
  const s = STEPS[current];
  const stage = document.getElementById('stage');
  let html = `
    <div class="step-eyebrow"><span class="n">STEP ${current+1} / ${STEPS.length}</span> ${s.wow ? '· WOW MOMENT' : ''}</div>
    <h1>${s.title}</h1>
  `;
  html += `
    <div class="click-block">
      <div class="lbl">${s.click.label}</div>
      <div class="action">${s.click.action}</div>
      ${s.click.url ? `<a class="gourl" href="${s.click.url}" target="_blank">Open live app</a>` : ''}
    </div>
  `;
  html += `<div class="say-block"><div class="lbl">Say this</div>${s.say.map(p => `<p>"${p}"</p>`).join('')}</div>`;
  if (s.notes && s.notes.toLowerCase().includes('honest') || (s.notes && s.notes.includes('$187K'))) {
    html += `<div class="caveat"><div class="lbl">⚠ If asked</div><p>${s.notes}</p></div>`;
  } else if (s.notes) {
    html += `<div class="notes">${s.notes}</div>`;
  }
  html += `
    <div class="navbar">
      <button class="nbtn" ${current === 0 ? 'disabled' : ''} onclick="prevStep()">← Previous</button>
      <button class="nbtn" ${current === STEPS.length-1 ? 'disabled' : ''} onclick="nextStep()">Next →</button>
    </div>
  `;
  stage.innerHTML = html;
}

function render() { renderRail(); renderStage(); }
function nextStep() { if (current < STEPS.length-1) { current++; render(); } }
function prevStep() { if (current > 0) { current--; render(); } }

render();
</script>
</body>
</html>
