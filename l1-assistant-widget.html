<!--
  L1 Ticket Copilot — Floating AI Assistant
  ------------------------------------------
  Paste this fragment right before </body> on your L1 Ticket Copilot page.
  It is self-contained (no build step, no external deps) and talks to
  POST /api/l1-copilot/assistant  ->  { ok, answer, createdAt }

  Theming: everything reads from CSS variables at the top of the <style>
  block. If your war-room pages already define --tsm-accent / --tsm-bg /
  --tsm-panel etc. globally, delete the ":root" block below and the widget
  will just inherit your existing palette instead.
-->

<style>
  :root {
    --l1a-accent:      #00d4a0;
    --l1a-accent-dark: #00a37a;
    --l1a-bg:          #0d1117;
    --l1a-panel:       #161b22;
    --l1a-border:      #2a313c;
    --l1a-text:        #e6edf3;
    --l1a-text-dim:    #8b949e;
    --l1a-danger:      #f85149;
  }

  #l1a-fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--l1a-accent), var(--l1a-accent-dark));
    color: #04120e;
    border: none;
    box-shadow: 0 4px 18px rgba(0, 212, 160, 0.35);
    cursor: pointer;
    z-index: 9998;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #l1a-fab:hover { transform: scale(1.06); box-shadow: 0 6px 22px rgba(0, 212, 160, 0.5); }
  #l1a-fab:active { transform: scale(0.96); }
  #l1a-fab .l1a-badge {
    position: absolute;
    top: -2px; right: -2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--l1a-accent);
    border: 2px solid var(--l1a-bg);
  }

  #l1a-panel {
    position: fixed;
    bottom: 96px;
    right: 24px;
    width: 380px;
    max-width: calc(100vw - 32px);
    max-height: 560px;
    background: var(--l1a-panel);
    border: 1px solid var(--l1a-border);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #l1a-panel.l1a-open { display: flex; }

  #l1a-header {
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(0,212,160,0.12), rgba(0,212,160,0.02));
    border-bottom: 1px solid var(--l1a-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #l1a-header .l1a-title { color: var(--l1a-text); font-weight: 600; font-size: 14px; }
  #l1a-header .l1a-sub { color: var(--l1a-text-dim); font-size: 11px; margin-top: 2px; }
  #l1a-close {
    background: none; border: none; color: var(--l1a-text-dim);
    font-size: 18px; cursor: pointer; line-height: 1; padding: 4px;
  }
  #l1a-close:hover { color: var(--l1a-text); }

  #l1a-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #l1a-answer {
    background: var(--l1a-bg);
    border: 1px solid var(--l1a-border);
    border-radius: 10px;
    padding: 12px;
    color: var(--l1a-text);
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    display: none;
  }
  #l1a-answer.l1a-show { display: block; }
  #l1a-answer.l1a-error { border-color: var(--l1a-danger); color: var(--l1a-danger); }

  #l1a-empty {
    color: var(--l1a-text-dim);
    font-size: 12.5px;
    line-height: 1.5;
    padding: 4px 2px;
  }

  #l1a-loading {
    color: var(--l1a-accent);
    font-size: 12.5px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  #l1a-loading.l1a-show { display: flex; }
  .l1a-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--l1a-accent); animation: l1a-pulse 1.2s infinite ease-in-out; }
  .l1a-dot:nth-child(2) { animation-delay: 0.15s; }
  .l1a-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes l1a-pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  #l1a-footer {
    padding: 12px 14px;
    border-top: 1px solid var(--l1a-border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #l1a-input {
    width: 100%;
    resize: none;
    background: var(--l1a-bg);
    border: 1px solid var(--l1a-border);
    border-radius: 8px;
    color: var(--l1a-text);
    padding: 9px 10px;
    font-size: 13px;
    font-family: inherit;
    box-sizing: border-box;
    min-height: 56px;
  }
  #l1a-input:focus { outline: none; border-color: var(--l1a-accent); }
  #l1a-send {
    background: var(--l1a-accent);
    color: #04120e;
    border: none;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #l1a-send:hover { background: var(--l1a-accent-dark); }
  #l1a-send:disabled { opacity: 0.5; cursor: not-allowed; }
  #l1a-hint { color: var(--l1a-text-dim); font-size: 10.5px; }
</style>

<button id="l1a-fab" title="Ask the L1 Copilot Assistant" aria-label="Open L1 Copilot Assistant">
  💬<span class="l1a-badge"></span>
</button>

<div id="l1a-panel" role="dialog" aria-label="L1 Copilot Assistant">
  <div id="l1a-header">
    <div>
      <div class="l1a-title">L1 Copilot Assistant</div>
      <div class="l1a-sub">Describe the scenario, get best-practice guidance</div>
    </div>
    <button id="l1a-close" aria-label="Close">✕</button>
  </div>

  <div id="l1a-body">
    <div id="l1a-empty">
      Paste in what you're seeing — an error message, a user complaint, a ticket
      you're stuck on — and get root cause, next steps, and when to escalate.
    </div>
    <div id="l1a-loading">
      <span class="l1a-dot"></span><span class="l1a-dot"></span><span class="l1a-dot"></span>
      Thinking it through…
    </div>
    <div id="l1a-answer"></div>
  </div>

  <div id="l1a-footer">
    <textarea id="l1a-input" placeholder="e.g. User's Dell laptop won't detect the docking station after the latest Windows update..."></textarea>
    <button id="l1a-send">Get Advice</button>
    <div id="l1a-hint">Shift+Enter for a new line · Enter to send</div>
  </div>
</div>

<script>
(function () {
  var fab      = document.getElementById('l1a-fab');
  var panel    = document.getElementById('l1a-panel');
  var closeBtn = document.getElementById('l1a-close');
  var input    = document.getElementById('l1a-input');
  var sendBtn  = document.getElementById('l1a-send');
  var answerEl = document.getElementById('l1a-answer');
  var loadingEl= document.getElementById('l1a-loading');
  var emptyEl  = document.getElementById('l1a-empty');

  function openPanel()  { panel.classList.add('l1a-open'); input.focus(); }
  function closePanel() { panel.classList.remove('l1a-open'); }

  fab.addEventListener('click', function () {
    panel.classList.contains('l1a-open') ? closePanel() : openPanel();
  });
  closeBtn.addEventListener('click', closePanel);

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitScenario();
    }
  });
  sendBtn.addEventListener('click', submitScenario);

  function setLoading(isLoading) {
    sendBtn.disabled = isLoading;
    loadingEl.classList.toggle('l1a-show', isLoading);
  }

  async function submitScenario() {
    var scenario = input.value.trim();
    if (!scenario) return;

    emptyEl.style.display = 'none';
    answerEl.classList.remove('l1a-show', 'l1a-error');
    setLoading(true);

    try {
      var res = await fetch('/api/l1-copilot/assistant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scenario: scenario })
      });
      var data = await res.json();

      setLoading(false);

      if (!res.ok || !data.ok) {
        throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
      }

      answerEl.textContent = data.answer;
      answerEl.classList.add('l1a-show');
    } catch (err) {
      setLoading(false);
      answerEl.textContent = 'Could not reach the assistant: ' + err.message;
      answerEl.classList.add('l1a-show', 'l1a-error');
    }
  }
})();
</script>
