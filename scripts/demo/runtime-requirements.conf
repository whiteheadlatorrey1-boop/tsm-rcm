# scripts/demo/runtime-requirements.conf
#
# label-glob|required substring in the page's HTML
# A page is checked against every rule whose glob matches its label
# (from demo-pages.conf). Add a rule here whenever a new required
# global include is introduced — this is exactly the check that would
# have caught the missing tsm-shared.js include on marketing.html,
# presentation-live.html, and demo-conductor.html before the demo.
#
# NOTE: relay.core.js / tsm-runtime.js rules are listed per-vertical
# (not as a *-strategist / *-executive-portal / *-war-room wildcard)
# because two verticals are intentionally NOT on the canonical relay
# bus and should not be flagged as broken:
#   - MDM: strategist reads via REST (/api/mdm/merge), by design.
#   - Honeywell: still on the legacy TSM_HONEYWELL_RELAY pattern,
#     predates the canonical relay control plane.
# If either of these is migrated onto the relay bus later, move its
# lines into the wildcard-covered set below and delete the explicit
# per-vertical line.

