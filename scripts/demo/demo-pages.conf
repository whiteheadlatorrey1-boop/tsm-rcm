# scripts/demo/demo-pages.conf
#
# Registry of pages the demo-certification suite checks on every run.
# Format: label|path-relative-to-html/
# Blank lines and lines starting with # are ignored.
# Keep this in sync when a vertical or demo flow is added/removed —
# check-pages.sh will fail loudly if a listed page goes missing, and
# will WARN (not fail) about *.html files under html/war-rooms that
# exist on disk but aren't listed here, so new pages get noticed.

