name: Parse Gate — Inline Script Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reject unparseable inline <script> blocks
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const { extractInlineScripts } = require("./scripts/inline-script-parser.js");
            let bad = 0, files = 0;
            function walk(d) {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                if (e.name === "node_modules" || e.name.startsWith(".")) continue;
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (e.name.endsWith(".html")) {
                  files++;
                  const html = fs.readFileSync(p, "utf8");
                  for (const content of extractInlineScripts(html)) {
                    const c = content.trim();
                    if (!c) continue;
                    try { new Function(c); }
                    catch (err) {
                      console.error(`✗ ${p}: ${err.message}`);
                      bad++;
                    }
                  }
                }
              }
            }
            walk("html");
            console.log(`\nScanned ${files} HTML files.`);
            if (bad) {
              console.error(`\n${bad} broken inline script block(s) found. Merge blocked.`);
              process.exit(1);
            }
            console.log("All inline scripts parse cleanly.");
          '

      - name: Sanity-check server.js
        run: node --check server.js
