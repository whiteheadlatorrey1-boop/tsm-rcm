name: Parse Gate — Inline Script Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reject unparseable inline <script> blocks
        run: |
          node -e '
            const fs = require("fs"), path = require("path");

            const baselinePath = ".github/parse-gate-known-broken.txt";
            const baseline = new Set(
              fs.existsSync(baselinePath)
                ? fs.readFileSync(baselinePath, "utf8")
                    .split("\n")
                    .map(l => l.trim())
                    .filter(l => l && !l.startsWith("#"))
                : []
            );

            let bad = 0, knownBad = 0, files = 0;
            function walk(d) {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                if (e.name === "node_modules" || e.name.startsWith(".")) continue;
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (e.name.endsWith(".html")) {
                  files++;
                  const html = fs.readFileSync(p, "utf8");
                  // Strip HTML comments first — otherwise literal text like
                  // "<script>" inside a <!-- --> comment gets matched as a
                  // real opening tag and swallows everything up to the next
                  // actual </script>, hundreds of lines of unrelated markup
                  // included, which then fails to parse as JS.
                  const stripped = html.replace(/<!--[\s\S]*?-->/g, "");
                  const re = /<script(?![^>]*\bsrc\b)[^>]*>([\s\S]*?)<\/script>/gi;
                  let m, fileBad = 0;
                  while ((m = re.exec(stripped))) {
                    const c = m[1].trim();
                    if (!c) continue;
                    try { new Function(c); }
                    catch (err) {
                      fileBad++;
                      if (baseline.has(p)) {
                        console.warn(`⚠ ${p}: ${err.message} (known pre-existing — see .github/parse-gate-known-broken.txt)`);
                      } else {
                        console.error(`✗ ${p}: ${err.message}`);
                      }
                    }
                  }
                  if (fileBad) {
                    if (baseline.has(p)) knownBad += fileBad;
                    else bad += fileBad;
                  }
                }
              }
            }
            walk("html");
            console.log(`\nScanned ${files} HTML files.`);
            if (knownBad) console.log(`${knownBad} pre-existing broken block(s) in ${baseline.size} baselined file(s) — not blocking.`);
            if (bad) {
              console.error(`\n${bad} NEW broken inline script block(s) found (not in baseline). Merge blocked.`);
              process.exit(1);
            }
            console.log("No new broken inline scripts. Gate passes.");
          '

      - name: Sanity-check server.js
        run: node --check server.js