# TSM Shell — JS Obfuscation Pipeline (PR-gated)
#
# HISTORY: this workflow used to `git push` obfuscated output directly to
# whatever branch triggered it, with no review step. On 2026-07-02 it was
# manually dispatched, produced syntactically invalid JS (known-broken config:
# selfDefending + controlFlowFlattening + stringArrayEncoding), and the output
# was merged to main via PR #39 with no automated check to catch it — 610
# files corrupted, reverted in PR #40.
#
# Fix: this workflow now opens a PR instead of pushing directly, and the
# output must pass parse-gate.yml (which runs on every PR) before anyone can
# merge it. It never touches main directly.
#
# Still workflow_dispatch-only. Do not change this to run on push until the
# obfuscator config itself has been fixed and validated (see build.js OBF_OPTIONS —
# selfDefending is the most likely single culprit; test with it off first).

name: Obfuscate JS

on:
  workflow_dispatch:

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --include=dev

      - name: Run obfuscation pipeline
        run: node html/build.js

      - name: Open PR instead of pushing to main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: obfuscate inline JS"
          branch: auto/obfuscate-js
          title: "Obfuscation pipeline output — requires parse-gate pass before merge"
          body: |
            Auto-generated by the Obfuscate JS workflow. Do not merge until
            "Parse Gate — Inline Script Validation" is green on this PR.