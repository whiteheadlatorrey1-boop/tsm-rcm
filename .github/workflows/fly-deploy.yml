name: Fly Deploy

# Fly is paused while we're on GitHub-only for now — this used to fire on
# every push to main. Switched to manual-only so a routine merge doesn't
# trigger a deploy. Flip the `on:` block back to the commented push trigger
# below when Fly comes back into rotation.
#
# on:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: node --check server.js

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
