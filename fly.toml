# fly.toml app configuration file generated for tsm-shell-long-sandbar-8751 on 2026-09-08T22:21:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tsm-shell'
primary_region = 'dfw'

[build]
[[mounts]]
  source = 'tsm_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024

[env]
  CANDIDATE_WRITE_TOKEN_REQUIRED = '1'

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
