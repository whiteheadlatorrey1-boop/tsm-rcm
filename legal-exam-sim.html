<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NALA CP Exam Simulator · TSM Academy</title>
<style>
:root{
  --bg:#05080b;--surface:#080f16;--s2:#060d13;--border:rgba(168,85,247,.16);
  --text:#e8e0ff;--muted:#7a6a9e;
  --cyan:#00d4ff;--amber:#ffb300;--purple:#a855f7;
  --green:#00ffc6;--red:#ff4060;--white:#ffffff;
  --mono:'JetBrains Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,Arial;font-size:13px;padding-bottom:60px}
.topbar{position:sticky;top:0;z-index:100;background:var(--s2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:950;color:var(--purple);letter-spacing:.16em;font-size:11px;white-space:nowrap;font-family:var(--mono)}
.topbar-links{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;align-items:center}
.topbar-links a{color:var(--muted);text-decoration:none;font-size:10px;font-family:var(--mono);padding:5px 10px;border:1px solid transparent;border-radius:3px;letter-spacing:.08em;transition:all .2s}
.topbar-links a:hover{color:var(--purple);border-color:var(--purple)}
.timer{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--amber);padding:4px 12px;border:1px solid var(--amber);border-radius:4px}
.timer.low{color:var(--red);border-color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.wrap{max-width:820px;margin:0 auto;padding:24px 20px}
.hero-badge{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--purple);margin-bottom:8px}
h1{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px}
.sub{color:var(--muted);font-size:12px;margin-bottom:20px;line-height:1.6}
.progress-bar{height:4px;background:var(--surface);border-radius:2px;overflow:hidden;margin-bottom:24px}
.progress-fill{height:100%;background:var(--purple);transition:width .3s}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:22px}
.q-domain{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--amber);margin-bottom:10px}
.q-num{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:14px}
.q-text{font-size:15px;font-weight:700;color:#fff;margin-bottom:18px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;background:var(--s2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:6px;margin-bottom:8px;cursor:pointer;font-size:13px;transition:all .15s;font-family:inherit}
.opt:hover{border-color:var(--purple)}
.opt.selected{border-color:var(--purple);background:rgba(168,85,247,.1)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:6px;font-size:12px;line-height:1.6;display:none}
.feedback.show{display:block}
.feedback.right{background:rgba(0,255,198,.08);border:1px solid var(--green);color:var(--green)}
.feedback.wrong{background:rgba(255,64,96,.08);border:1px solid var(--red);color:#ffb0bc}
.nav-row{display:flex;justify-content:flex-end;margin-top:20px}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;font-weight:700;padding:10px 22px;border-radius:6px;border:1px solid var(--purple);background:transparent;color:var(--purple);cursor:pointer;transition:all .2s}
.btn:hover{background:var(--purple);color:#000}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--purple)}
.results{display:none;text-align:center;padding:40px 20px}
.results.show{display:block}
.score-ring{font-family:var(--mono);font-size:56px;font-weight:900;margin-bottom:6px}
.score-ring.pass{color:var(--green)}
.score-ring.fail{color:var(--red)}
.pass-label{font-family:var(--mono);font-size:12px;letter-spacing:.2em;margin-bottom:26px}
.domain-breakdown{text-align:left;max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px}
.db-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.db-row:last-child{border-bottom:none}
.db-bar{width:100px;height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.db-fill{height:100%;background:var(--purple)}
.db-fill.weak{background:var(--amber)}
.retry-row{margin-top:26px;display:flex;gap:10px;justify-content:center}
</style>
</head>
<body data-vertical="legal" data-page-role="warroom">

<div class="topbar">
  <div class="logo">TSM ACADEMY</div>
  <div id="timerDisplay" class="timer">30:00</div>
  <div class="topbar-links">
    <a href="/html/tsm-career-training-platform.html">← CAREER PLATFORM</a>
    <a href="/html/legal-pro/legal-compliance.html">COMPLIANCE HUB</a>
    <a href="/html/legal-pro/legal-scenarios.html">SCENARIOS</a>
  </div>
</div>

<div class="wrap">
  <div class="hero-badge">NALA CP · CERTIFIED PARALEGAL EXAM PREP</div>
  <h1>Timed Exam Simulator</h1>
  <p class="sub">20 questions across all 6 competency domains, 30-minute timer, 70% to pass — same shape as the NALA CP scaled-score exam structure.</p>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="q-card" id="quizCard"></div>

  <div class="results" id="results">
    <div class="score-ring" id="scoreRing">--%</div>
    <div class="pass-label" id="passLabel">—</div>
    <div class="domain-breakdown" id="breakdown"></div>
    <div class="retry-row">
      <button class="btn" onclick="location.reload()">RETAKE EXAM</button>
      <a class="btn" href="/html/legal-pro/legal-scenarios.html" style="text-decoration:none;display:inline-flex;align-items:center">RUN SCENARIOS →</a>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {domain:'Ethics & Prof. Resp.', q:'The unauthorized practice of law (UPL) rule generally prohibits a paralegal from:', opts:['Drafting documents for attorney review','Giving legal advice directly to a client','Conducting legal research','Organizing case files'], correct:1},
  {domain:'Ethics & Prof. Resp.', q:'Attorney work product protection generally covers:', opts:['Publicly filed court documents','Materials prepared in anticipation of litigation','A firm\u2019s marketing materials','Client billing invoices'], correct:1},
  {domain:'Ethics & Prof. Resp.', q:'An "ethical wall" is used to:', opts:['Track billable hours','Screen a conflicted employee off a matter','Organize physical case files','Set client payment terms'], correct:1},
  {domain:'Ethics & Prof. Resp.', q:'Confidential client information may generally be disclosed without consent when:', opts:['A subpoena or court order compels it','A paralegal thinks it would help the case','Requested by opposing counsel informally','Never, under any circumstance'], correct:0},
  {domain:'Research & Writing', q:'Which is a primary authority?', opts:['A law review article','A statute','A legal treatise','A practice guide'], correct:1},
  {domain:'Research & Writing', q:'Bluebook citation format is used primarily for:', opts:['Client invoicing','Standardizing legal citations','Scheduling depositions','Docket calendaring'], correct:1},
  {domain:'Research & Writing', q:'A legal memo\u2019s primary purpose is to:', opts:['Persuade a judge directly','Analyze law and facts for internal use','Serve as a court filing','Replace attorney review'], correct:1},
  {domain:'Litigation & Discovery', q:'A litigation hold is issued to:', opts:['Speed up settlement talks','Preserve potentially relevant evidence','Reduce attorney fees','Close a case early'], correct:1},
  {domain:'Litigation & Discovery', q:'A privilege log is used to:', opts:['List billable hours per matter','Document withheld privileged documents in discovery','Track court filing fees','Schedule depositions'], correct:1},
  {domain:'Litigation & Discovery', q:'Missing a discovery response deadline can result in:', opts:['No consequence if unintentional','Sanctions or waiver of objections','Automatic case dismissal only','A fee reduction for the client'], correct:1},
  {domain:'Contracts', q:'Which is NOT a required element of contract formation?', opts:['Offer','Acceptance','Consideration','Notarization'], correct:3},
  {domain:'Contracts', q:'"Redlining" a contract refers to:', opts:['Rejecting a contract outright','Marking proposed changes for negotiation','Notarizing a signature page','Filing a contract with the court'], correct:1},
  {domain:'Contracts', q:'An indemnification clause primarily addresses:', opts:['Payment schedules','Allocation of liability/risk between parties','Governing law only','Contract duration'], correct:1},
  {domain:'Case Mgmt & Docketing', q:'A statute of limitations defines:', opts:['The billing rate for a matter','The deadline to file a legal claim','The court\u2019s jurisdiction only','The number of witnesses allowed'], correct:1},
  {domain:'Case Mgmt & Docketing', q:'Docketing systems are primarily used to:', opts:['Track court and filing deadlines','Manage client billing only','Store marketing contacts','Replace case management software'], correct:0},
  {domain:'Case Mgmt & Docketing', q:'Missing a court filing deadline can most directly result in:', opts:['A minor fee','Default judgment or claim dismissal','No consequence','A firm-wide policy change only'], correct:1},
  {domain:'Substantive Law', q:'Civil procedure primarily governs:', opts:['Criminal sentencing','The process for resolving civil disputes in court','Contract drafting standards','Bar admission requirements'], correct:1},
  {domain:'Substantive Law', q:'A tort is best defined as:', opts:['A type of contract','A civil wrong causing harm, giving rise to liability','A criminal statute','A real estate deed'], correct:1},
  {domain:'Substantive Law', q:'Real property fundamentals typically include understanding:', opts:['Titles, deeds, and easements','Only criminal trespass law','Corporate bylaws','Family court procedure'], correct:0},
  {domain:'Ethics & Prof. Resp.', q:'A conflict-of-interest check is typically run:', opts:['Only after a matter concludes','Before a firm accepts a new matter or client','Only if the client requests it','Once per year firm-wide'], correct:1},
];

let current = 0, answers = new Array(QUESTIONS.length).fill(null), locked = false;
let timeLeft = 30 * 60;

function renderQuestion(){
  const q = QUESTIONS[current];
  const card = document.getElementById('quizCard');
  locked = answers[current] !== null;
  card.innerHTML = `
    <div class="q-domain">${q.domain.toUpperCase()}</div>
    <div class="q-num">Question ${current+1} of ${QUESTIONS.length}</div>
    <div class="q-text">${q.q}</div>
    ${q.opts.map((o,i)=>`<button class="opt${answers[current]===i?' selected':''}" onclick="selectAnswer(${i})" ${locked?'disabled':''}>${o}</button>`).join('')}
    <div class="feedback ${locked ? (answers[current]===q.correct?'right show':'wrong show') : ''}" id="feedback">
      ${locked ? (answers[current]===q.correct ? '✓ Correct.' : `✗ Incorrect. Correct answer: ${q.opts[q.correct]}`) : ''}
    </div>
    <div class="nav-row">
      <button class="btn" onclick="nextQuestion()" ${!locked?'disabled':''}>${current === QUESTIONS.length-1 ? 'FINISH EXAM' : 'NEXT →'}</button>
    </div>
  `;
  document.getElementById('progressFill').style.width = ((current)/QUESTIONS.length*100) + '%';
}

function selectAnswer(i){
  if (answers[current] !== null) return;
  answers[current] = i;
  renderQuestion();
}

function nextQuestion(){
  if (current < QUESTIONS.length - 1){ current++; renderQuestion(); }
  else finishExam();
}

function finishExam(){
  clearInterval(timerInterval);
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';

  const domainStats = {};
  QUESTIONS.forEach((q,i)=>{
    domainStats[q.domain] = domainStats[q.domain] || {correct:0,total:0};
    domainStats[q.domain].total++;
    if (answers[i] === q.correct) domainStats[q.domain].correct++;
  });
  const totalCorrect = answers.filter((a,i)=>a===QUESTIONS[i].correct).length;
  const pct = Math.round(totalCorrect / QUESTIONS.length * 100);
  const pass = pct >= 70;

  const ring = document.getElementById('scoreRing');
  ring.textContent = pct + '%';
  ring.className = 'score-ring ' + (pass ? 'pass' : 'fail');
  document.getElementById('passLabel').textContent = pass ? 'PASS — READY FOR NALA CP EXAM SCHEDULING' : 'NOT YET — REVIEW WEAK DOMAINS BELOW';
  document.getElementById('passLabel').style.color = pass ? 'var(--green)' : 'var(--red)';

  const bd = document.getElementById('breakdown');
  bd.innerHTML = Object.entries(domainStats).map(([d,s])=>{
    const dp = Math.round(s.correct/s.total*100);
    return `<div class="db-row"><span>${d}</span><div style="display:flex;align-items:center;gap:8px"><div class="db-bar"><div class="db-fill${dp<70?' weak':''}" style="width:${dp}%"></div></div><span style="font-family:var(--mono);width:32px;text-align:right">${dp}%</span></div></div>`;
  }).join('');

  document.getElementById('results').classList.add('show');

  try {
    localStorage.setItem('tsm_paralegal_exam_last_score', JSON.stringify({pct, pass, at: new Date().toISOString()}));
  } catch(e) {}
}

const timerInterval = setInterval(()=>{
  timeLeft--;
  const m = Math.floor(timeLeft/60), s = timeLeft%60;
  const disp = document.getElementById('timerDisplay');
  disp.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  if (timeLeft <= 60) disp.classList.add('low');
  if (timeLeft <= 0) finishExam();
}, 1000);

renderQuestion();
</script>
  <script src="./js/tsm-guide-engine.js" defer></script>
</body>
</html>
